  - id: carlet-5-theorem-5
    kind: theorem
    location: Carlet, Theorem 5, p. 70
    statement: >-
      Every non-affine quadratic f : V_n -> F_2 is affinely equivalent to
      Q_l + x_(2l+1), where Q_l = x_1 x_2 + ... + x_(2l-1) x_(2l) and
      1 <= l <= (n-1)/2, when f is balanced; to Q_l with
      1 <= l <= n/2 when w_H(f) < 2^(n-1); and to Q_l+1 with
      1 <= l <= n/2 when w_H(f) > 2^(n-1).
    formal_status: formalized
    declarations:
      - CryptBoolean.exists_affineFunction_of_quadraticPolarKernel_eq_zero
      - CryptBoolean.quadraticNormalFormSplitLinearEquiv
      - CryptBoolean.quadraticNormalFormDimension
      - CryptBoolean.quadraticNormalFormDimension_eq
      - CryptBoolean.quadraticNormalForm
      - CryptBoolean.quadraticNormalFormFirstFreeCoordinate
      - CryptBoolean.quadratic_affine_normal_form
    dependencies:
      - carlet-5-def-quadratic-symplectic-form
      - carlet-5-theorem-4
      - carlet-2-affine-invariance

  - id: carlet-5-quadraticization-step
    kind: lemma
    location: Carlet, Remark after Theorem 5, p. 70
    statement: >-
      Let f_1,f_2,f_3 : V_n -> F_2, set g(x)=f_1(x)f_2(x)+f_3(x), and define
      F(x,y_1,y_2)=y_1y_2+y_1f_1(x)+y_2f_2(x)+f_3(x). Then
      W_F(0)=2 W_g(0). Thus one product f_1f_2 can be replaced by a quadratic
      term in two fresh variables together with terms linear in those fresh
      variables while scaling the zero-frequency Walsh value by two.
    formal_status: formalized
    declarations:
      - CryptBoolean.quadraticizationLift
      - CryptBoolean.quadraticizationLift_append
      - CryptBoolean.walshTransform_quadraticizationLift_zero
    dependencies:
      - carlet-2-def-walsh-transform

  - id: carlet-5-degree-three-walsh-lift
    kind: corollary
    location: Carlet, iterated consequence of the Remark, p. 70
    statement: >-
      For every Boolean function g : V_n -> F_2 there exist m in N and a
      Boolean function F : V_(n+2m) -> F_2 of algebraic degree at most three
      such that W_F(0)=2^m W_g(0).
    formal_status: formalized
    declarations:
      - CryptBoolean.exists_degree_le_three_walshTransform_zero_lift
    references: [51]
    fidelity_note: >-
      The proof iterates the compiled one-product lift over the canonical ANF
      support. A natural-valued cubic-excess measure strictly decreases at
      every step, and the terminal ANF has algebraic degree at most three.
    dependencies:
      - carlet-5-quadraticization-step
      - carlet-2-anf-existence-uniqueness
      - carlet-2-def-algebraic-degree

  - id: carlet-5-quadratic-trace-representation
    kind: theorem
    location: Carlet, unnumbered trace representation, pp. 70--71
    statement: >-
      Let theta identify V_n with K_n = GF(2^n). If n=2m+1, a Boolean
      function f is quadratic if and only if there exist beta_empty,beta_i in
      K_n such that f(x)=Tr_n(beta_empty + sum_(i=0)^m beta_i
      theta(x)^(2^i+1)). If n=2m with m>0, f is quadratic if and only if
      there exist an F_2-algebra embedding iota : K_m -> K_n,
      beta_empty,beta_i in K_n, and gamma in K_m such that
      f(x)=Tr_n(beta_empty + sum_(i=0)^(m-1) beta_i
      theta(x)^(2^i+1)) + Tr_m(gamma N_iota(theta(x))), where N_iota is the
      relative norm and iota(N_iota(z))=z^(2^m+1).
    formal_status: formalized
    declarations:
      - CryptBoolean.quadraticTraceMiddleNorm
      - CryptBoolean.quadraticTraceMiddleNorm_map_eq_pow
      - CryptBoolean.functionAlgebraicDegree_le_two_iff_exists_odd_quadraticTraceRepresentation
      - CryptBoolean.functionAlgebraicDegree_le_two_iff_exists_even_quadraticTraceRepresentation
    fidelity_note: >-
      The source suppresses both the cube coordinate map and the inclusion of
      GF(2^m) in GF(2^(2m)). The explicit embedding and relative norm make the
      middle term type-correct, and the norm-to-power theorem recovers the
      printed exponent. Both degree directions reuse Chapter 2 Proposition 3.
    dependencies:
      - carlet-5-def-quadratic-symplectic-form
      - carlet-5-theorem-5
      - carlet-2-absolute-trace
      - carlet-2-trace-monomial-degree
      - carlet-2-trace-pairing-coordinates

  - id: carlet-5-def-quadratic-semi-bent
    kind: definition
    location: Carlet, Section 5.2, p. 71
    statement: >-
      For odd n, a quadratic Boolean function is called semi-bent in this
      section when its nonlinearity is
      2^(n-1)-2^((n-1)/2). The cited trace-form studies concern functions
      Tr_n(sum_(i=1)^((n-1)/2) c_i x^(2^i+1)) satisfying this condition.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsQuadraticSemiBent
    references: [104, 195, 215]
    fidelity_note: >-
      Carlet does not state that arbitrary coefficients c_i give a semi-bent
      function; the trace family is therefore recorded only as the studied
      representation of functions already assumed to have the displayed
      nonlinearity.
    dependencies:
      - carlet-5-quadratic-weight-nonlinearity-values
      - carlet-5-quadratic-trace-representation

  - id: carlet-5-flat-indicator-walsh-nonlinearity
    kind: theorem
    location: Carlet, Section 5.3, p. 71
    statement: >-
      Let 1 <= r <= n, let a_1,...,a_r in V_n be linearly independent, let
      epsilon_1,...,epsilon_r in F_2, and let A be the codimension-r affine
      flat defined by a_i dot x = epsilon_i+1 for all i. Its indicator is
      f(x)=product_(i=1)^r (a_i dot x + epsilon_i), and w_H(f)=2^(n-r).
      If u is outside span{a_i}, then W_f(u)=0. If
      0 != u=sum_i eta_i a_i, then
      W_f(u)=-2^(n-r+1)(-1)^(sum_i eta_i(epsilon_i+1)), while
      W_f(0)=2^n-2^(n-r+1). Consequently nl(f)=0 for r=1 and
      nl(f)=2^(n-r) for r>=2.
    formal_status: formalized
    declarations:
      - CryptBoolean.rawFourierTransform_setIndicator_binaryAffineSubspace
      - CryptBoolean.realSignView_affineFlatIndicator
      - CryptBoolean.walshTransform_affineFlatIndicator
      - CryptBoolean.maxWalshMagnitude_affineFlatIndicator_of_two_le_codimension
      - CryptBoolean.nonlinearity_affineFlatIndicator_of_two_le_codimension
      - CryptBoolean.nonlinearity_affineFlatIndicator_of_codimension_le_one
      - CryptBoolean.nonlinearity_affineFlatIndicator
      - CryptBoolean.nonlinearity_affineFlatIndicator_of_codimension_one
      - CryptBoolean.nonlinearity_affineFlatIndicator_of_finrank_eq
    fidelity_note: >-
      The printed sentence says without qualification that nl(f)=2^(n-r),
      but its own Walsh formula gives nl(f)=0 in codimension one because the
      indicator is affine. The corrected case split is explicit and preserves
      the printed r>=2 conclusion.
    reuse_note: >-
      Reuse the Chapter 3 affine-flat indicator, support and weight theorems;
      only the raw-Walsh spectrum and corrected nonlinearity consequence are
      new.
    dependencies:
      - carlet-3-prop-12
      - carlet-2-def-walsh-transform
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-5-rel-42-restriction-nonlinearity
    kind: theorem
    location: Carlet, Relation (42), pp. 71--72
    statement: >-
      Let E,E' be complementary subspaces of V_n, let dim(E)=k, and for each
      a in E' let h_a be the Boolean function on E obtained by restricting f
      to a+E. Then, for every a in E',
      nl(f) <= 2^(n-1)-2^(k-1)+nl(h_a).
    formal_status: formalized
    declarations:
      - CryptBoolean.coordinateAffineSubspaceRestriction
      - CryptBoolean.coordinateAffineSubspaceDimension_le
      - CryptBoolean.exists_ambientFrequency_restricts_to_subspace
      - CryptBoolean.sum_walshTransform_perpendicularCoset_eq_restriction
      - CryptBoolean.abs_walshTransform_coordinateAffineSubspaceRestriction_le
      - CryptBoolean.maxWalshMagnitude_coordinateAffineSubspaceRestriction_le
      - CryptBoolean.two_mul_nonlinearity_add_two_pow_le_restriction
      - CryptBoolean.nonlinearity_cast_le_restriction_relation_42
      - CryptBoolean.nonlinearity_le_restriction_relation_42
      - CryptBoolean.nonlinearity_le_restriction_relation_42_of_isCompl
    fidelity_note: >-
      Carlet first derives this from Proposition 9, Relation (28), which is
      not represented by the current Chapter 2 inventory. The alternative
      proof printed immediately afterward derives it from the full Poisson
      formula, so the reviewed DAG uses that existing node.
    references: [41, 359]
    dependencies:
      - carlet-2-cor-1-poisson-summation
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-5-affine-flat-restriction-bound
    kind: corollary
    location: Carlet, consequence of Relation (42), p. 72
    statement: >-
      If the restriction of f : V_n -> F_2 to a k-dimensional affine flat A
      is affine, then nl(f) <= 2^(n-1)-2^(k-1). If equality holds and ell is
      any ambient affine extension of that restriction, then f+ell is balanced
      on every other coset of the direction space of A.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_add_affineFunction
      - CryptBoolean.walshTransform_add_affineFunction_natAbs
      - CryptBoolean.maxWalshMagnitude_add_affineFunction
      - CryptBoolean.sum_vectorWalshCharacter_perpendicular_eq_zero_of_not_mem
      - CryptBoolean.exists_affineFunction_eq_coordinateAffineSubspaceRestriction_of_isAffineOnAffineFlat
      - CryptBoolean.nonlinearity_coordinateAffineSubspaceRestriction_eq_zero_of_isAffineOnAffineFlat
      - CryptBoolean.nonlinearity_le_of_isAffineOnAffineFlat
      - CryptBoolean.isBalanced_coordinateAffineSubspaceRestriction_add_affineFunction_of_eq_bound
    fidelity_note: >-
      The natural-exponent bound and equality clause make the source's implicit
      positive-flat-dimension condition 1 <= k explicit. The division-free and
      real-valued forms of Relation (42) remain total at k = 0. The coordinate
      model replaces a chosen complement by a linear equivalence onto the
      direction space; z+a notin E is exactly the condition that z+E is a
      different coset from a+E.
    dependencies:
      - carlet-5-rel-42-restriction-nonlinearity
      - carlet-2-def-affine-functions
      - carlet-2-balanced-zero-walsh

  - id: carlet-5-def-4-normality
    kind: definition
    location: Carlet, Definition 4, p. 72
    statement: >-
      A Boolean function is k-weakly-normal when its restriction to some
      k-dimensional affine flat is affine, and is k-normal when its
      restriction to some k-dimensional affine flat is constant. For even n,
      the unqualified term normal means (n/2)-normal.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsKNormal
      - CryptBoolean.IsKWeaklyNormal
      - CryptBoolean.IsKNormal.isKWeaklyNormal
      - CryptBoolean.IsKNormal.le_normality
      - CryptBoolean.IsKWeaklyNormal.le_weakNormality
    reuse_note: >-
      The predicates on affine-flat restrictions and the maximum normality and
      weak-normality parameters already exist under the Chapter 4
      other-complexity node. Chapter 5 should reuse those declarations and add
      only the exact fixed-k source-facing equivalence if needed.
    dependencies:
      - carlet-4-other-complexity-definitions

  - id: carlet-5-random-nonnormality
    kind: theorem
    location: Carlet, unnumbered asymptotic result, p. 72
    statement: >-
      For every real alpha > 1, as n tends to infinity the uniform
      probability that an n-variable Boolean function is not
      floor(alpha log_2 n)-normal tends to one.
    formal_status: formalized
    declarations:
      - CryptBoolean.weakNormalityProbability
      - CryptBoolean.weakNormalityProbability_le_of_le
      - CryptBoolean.weakNormalityProbability_le
      - CryptBoolean.normalityProbability
      - CryptBoolean.normalityProbability_le_weakNormalityProbability
      - CryptBoolean.tendsto_weakNormalityProbability_zero_of_ratio
      - CryptBoolean.nonWeakNormalityProbability
      - CryptBoolean.tendsto_nonWeakNormalityProbability_one_of_ratio
      - CryptBoolean.nonnormalityProbability
      - CryptBoolean.tendsto_nonnormalityProbability_one_of_ratio
      - CryptBoolean.carletNonnormalityDimension
      - CryptBoolean.tendsto_carletNonnormalityProbability
    references: [65]
    fidelity_note: >-
      The proof first counts certificates for affine restrictions to
      k-dimensional flats and derives a finite weak-normality union bound. It
      then proves the cited general ratio criterion and specializes it to the
      exact natural floor of alpha log base two of n for every real alpha > 1.
    dependencies:
      - carlet-5-def-4-normality
      - carlet-4-degree-count

  - id: carlet-5-def-5-covering-sequence
    kind: definition
    location: Carlet, Definition 5, p. 73
    statement: >-
      Let f : V_n -> F_2 and let lambda=(lambda_a)_(a in V_n) be
      integer-valued. It is a covering sequence of f with level rho in Z when
      the integer-valued function
      x |-> sum_(a in V_n) lambda_a (D_a f(x) viewed in Z)
      is constantly rho. It is non-trivial when rho != 0.
    formal_status: formalized
    declarations:
      - CryptBoolean.bitValueInt
