      - CryptBoolean.quadraticPolar_isSymm
      - CryptBoolean.quadraticPolar_isAlt
      - CryptBoolean.quadraticRadical
      - CryptBoolean.mem_quadraticRadical_iff
      - CryptBoolean.booleanDerivative_eq_const_of_mem_quadraticRadical
      - CryptBoolean.quadraticRadicalSignCharacter
      - CryptBoolean.quadraticRadical_eq_linearKernel
    reuse_note: >-
      Reuse R(2,n), FABL's algebraic degree and derivative, and the existing
      linear-kernel predicate. Only the quadratic polar-form bridge is new.
    dependencies:
      - carlet-3-reed-muller-code
      - carlet-2-def-2-derivative
      - carlet-4-def-linear-kernel

  - id: carlet-5-rel-41-quadratic-kernel-sum
    kind: theorem
    location: Carlet, Relation (41), p. 69
    statement: >-
      For every quadratic f : V_n -> F_2 with linear kernel E_f,
      W_f(0)^2 = 2^n sum_(b in E_f) (-1)^(D_b f(0)). Consequently this square
      is 2^n |E_f| when f is constant on E_f and is zero otherwise.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_zero_sq_eq_two_pow_mul_sum_quadraticRadical
      - CryptBoolean.walshTransform_zero_sq_eq_two_pow_mul_sum_linearKernel
      - CryptBoolean.quadraticRadicalSignCharacter_eq_zero_iff
      - CryptBoolean.walshTransform_zero_sq_eq_if_constant_on_quadraticRadical
      - CryptBoolean.walshTransform_zero_sq_eq_if_constant_on_linearKernel
    dependencies:
      - carlet-5-def-quadratic-symplectic-form
      - carlet-2-rel-26-total-autocorrelation
      - carlet-3-affine-weight

  - id: carlet-5-theorem-4
    kind: theorem
    location: Carlet, Theorem 4, p. 69
    statement: >-
      Let n > 0, let f : V_n -> F_2 be quadratic, and let k = dim(E_f), where
      E_f is its linear kernel, equivalently the kernel of phi_f. Then f is
      balanced if and only if f restricted to E_f is not constant. If f is
      not balanced, then n+k is even and
      w_H(f) = 2^(n-1) + 2^((n+k)/2-1) or
      w_H(f) = 2^(n-1) - 2^((n+k)/2-1).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBalanced_iff_not_constant_on_linearKernel_of_degree_le_two
      - CryptBoolean.even_exponent_of_int_sq_eq_two_pow
      - CryptBoolean.walshTransform_zero_sq_eq_two_pow_add_finrank_of_not_balanced
      - CryptBoolean.even_dimension_add_finrank_linearKernel_of_not_balanced
      - CryptBoolean.quadratic_weight_eq_two_pow_sub_or_add
      - CryptBoolean.theorem_4_quadratic_weight
    fidelity_note: >-
      The positive-dimension domain makes the displayed half-power formula
      total; its balancedness clause and the even-rank corollary are compiled
      without this restriction.
    dependencies:
      - carlet-5-rel-41-quadratic-kernel-sum
      - carlet-2-balanced-zero-walsh

  - id: carlet-5-quadratic-balanced-iff-derivative-one
    kind: corollary
    location: Carlet, consequence after Theorem 4, p. 69
    statement: >-
      A quadratic Boolean function f is balanced if and only if there exists
      b in V_n such that D_b f is the constant function one. Such a direction
      necessarily belongs to E_f and satisfies f(b) != f(0).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBalanced_iff_quadraticRadicalSignCharacter_ne_zero
      - CryptBoolean.quadraticRadicalSignCharacter_ne_zero_iff_exists_derivative_one
      - CryptBoolean.isBalanced_iff_exists_booleanDerivative_eq_one_of_degree_le_two
      - CryptBoolean.mem_linearKernel_and_ne_zero_value_of_booleanDerivative_eq_one
    dependencies:
