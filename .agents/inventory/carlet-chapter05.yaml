items:
  - id: carlet-5-affine-walsh-spectrum
    kind: theorem
    location: Carlet, Section 5.1, p. 68
    statement: >-
      Let n >= 0, a,u in V_n, and epsilon in F_2. For the affine Boolean
      function ell(x) = a dot x + epsilon, its unnormalized Walsh transform is
      W_ell(u) = 0 when u != a and W_ell(a) = 2^n (-1)^epsilon.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_affineFunction
    reuse_note: >-
      Reuse the canonical affine-function and raw-Walsh APIs; the sign view of
      an affine function and its balancedness are already compiled in the
      Chapter 3 affine-weight node.
    dependencies:
      - carlet-2-def-walsh-transform
      - carlet-3-affine-weight

  - id: carlet-5-def-maiorana-mcfarland-affine-slices
    kind: definition
    location: Carlet, Section 5.1, p. 68
    statement: >-
      Fix a decomposition V_(r+s) = V_r x V_s. A Boolean function
      f : V_r x V_s -> F_2 is a Maiorana--McFarland affine-slice function for
      this decomposition when, for every y in V_s, the slice x |-> f(x,y) is
      affine; equivalently, its truth table is the concatenation, indexed by
      y, of affine truth tables on V_r.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsMaioranaMcFarlandAffineSlices
    fidelity_note: >-
      This is the preliminary affine-slice schema stated in Chapter 5. It does
      not conflate the original bent class of Section 6.4 with the more general
      resilient construction of Section 7.5.
    dependencies:
      - carlet-2-def-affine-functions

  - id: carlet-5-def-quadratic-symplectic-form
    kind: definition
    location: Carlet, Section 5.2, pp. 68--69
    statement: >-
      A quadratic Boolean function is an element f of R(2,n), equivalently a
      function of algebraic degree at most two. Define
      phi_f(x,y) = f(0) + f(x) + f(y) + f(x+y). For quadratic f, phi_f is a
      bilinear, symmetric, alternating form. Its kernel is exactly the linear
      kernel E_f = {b in V_n | D_b f is constant}, and the map
      b |-> D_b f(0) = f(b)+f(0) is linear on E_f.
    formal_status: formalized
    declarations:
      - CryptBoolean.quadraticPolarKernel
      - CryptBoolean.quadraticPolarKernel_eq
      - CryptBoolean.quadraticPolarKernel_comm
      - CryptBoolean.quadraticPolarKernel_eq_dotProduct_of_derivative_eq_affine
      - CryptBoolean.quadraticPolarKernel_add_right
      - CryptBoolean.quadraticPolarKernel_smul_right
      - CryptBoolean.quadraticPolarKernel_add_left
      - CryptBoolean.quadraticPolarKernel_smul_left
