  - id: carlet-5-quadratic-weight-nonlinearity-values
    kind: theorem
    location: Carlet, unnumbered value restrictions, p. 69
    statement: >-
      Let n >= 1 and I_n = {i in N | ceil(n/2)-1 <= i <= n-1}. The set of
      weights of quadratic n-variable Boolean functions is exactly
      {2^(n-1)} union {2^(n-1)-2^i, 2^(n-1)+2^i | i in I_n}, and the set of
      their nonlinearities is exactly {2^(n-1)-2^i | i in I_n}. Moreover, if
      a quadratic f has weight 2^(n-1) plus or minus 2^i, then for every
      affine ell the weight of f+ell belongs to
      {2^(n-1)-2^i, 2^(n-1), 2^(n-1)+2^i}.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsQuadraticOffsetExponent
      - CryptBoolean.isQuadraticOffsetExponent_iff_ceilingHalf
      - CryptBoolean.isQuadraticOffsetExponent_iff_ceilDiv
      - CryptBoolean.isQuadraticOffsetExponent_iff_exists_parameters
