      - carlet-5-def-quadratic-symplectic-form

  - id: carlet-5-quadratic-symplectic-rank-even
    kind: corollary
    location: Carlet, consequence after Theorem 4, p. 69
    statement: >-
      For every quadratic Boolean function f, the codimension of its linear
      kernel E_f is even. Equivalently, the alternating bilinear form phi_f has
      even rank.
    formal_status: formalized
    declarations:
