  - id: carlet-5-def-regular-function
    kind: definition
    location: Carlet, regular covering sequences, p. 74
    statement: >-
      A Boolean function is regular when the indicator of the set of
      weight-one directions is a covering sequence. If its level is rho >= 1,
      then it is (rho-1)-resilient. More generally, the same conclusion holds
      when the covering sequence is the indicator of a set of directions with
      pairwise disjoint supports.
    formal_status: formalized
    declarations:
      - CryptBoolean.weightOneDirectionIndicator
      - CryptBoolean.IsRegularAtLevel
      - CryptBoolean.IsRegular
      - CryptBoolean.integerWalshTransform_weightOneDirectionIndicator
