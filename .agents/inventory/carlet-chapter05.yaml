      - carlet-5-def-5-covering-sequence
      - carlet-2-pseudoboolean-fourier
      - carlet-2-def-walsh-transform

  - id: carlet-5-covering-sequence-resiliency
    kind: theorem
    location: Carlet, consequences of the Walsh characterization, p. 74
    statement: >-
      Suppose lambda is a covering sequence of f with level rho, put
      mu=lambda_hat(0)-2rho, and suppose k+1 is the minimum Hamming weight of
      a nonzero b satisfying lambda_hat(b)=mu. Then f is k-th order
      correlation immune, and if rho != 0 it is k-resilient. Conversely, if f
      is k-th order correlation immune but not (k+1)-th order correlation
      immune, there is a covering sequence with this minimum equal to k+1;
      if f is k-resilient but not (k+1)-resilient, such a sequence can be
      chosen non-trivial.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsMinimumNonzeroTransformFiberWeight
      - CryptBoolean.isCorrelationImmune_of_coveringSequence_of_minimumTransformFiberWeight
      - CryptBoolean.isResilient_of_coveringSequence_of_minimumTransformFiberWeight
