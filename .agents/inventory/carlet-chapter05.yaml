  - id: carlet-5-covering-sequence-balancedness
    kind: theorem
    location: Carlet, unnumbered results after Definition 5, p. 73
    statement: >-
      Every Boolean function admitting a non-trivial covering sequence is
      balanced. Conversely, every balanced n-variable Boolean function admits
      the constant sequence lambda_a=1 as a covering sequence of level
      2^(n-1).
    formal_status: formalized
    declarations:
