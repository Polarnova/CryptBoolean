  - id: carlet-5-covering-sequence-walsh-characterization
    kind: theorem
    location: Carlet, Walsh characterization after Definition 5, pp. 73--74
    statement: >-
      For an integer sequence lambda on V_n define
      lambda_hat(b)=sum_a lambda_a (-1)^(a dot b). Then lambda is a covering
      sequence of f with level rho if and only if
      lambda_hat(b)=lambda_hat(0)-2rho for every b with W_f(b) != 0;
      equivalently, lambda_hat is constant with that value on the Walsh
      support of f.
    formal_status: formalized
    declarations:
      - CryptBoolean.weightedTranslatedSignSum
      - CryptBoolean.bitSignInt_eq_one_sub_two_mul_bitValueInt
      - CryptBoolean.bitSignInt_booleanDerivative_mul_left
