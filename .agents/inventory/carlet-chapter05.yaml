      - CryptBoolean.integerWalshTransform_directionFamilyIndicator
      - CryptBoolean.integerWalshTransform_directionFamilyIndicator_zero
      - CryptBoolean.isResilient_natPred_of_pairwiseDisjointSupportCoveringSequence
    references: [94]
    dependencies:
      - carlet-5-def-5-covering-sequence
      - carlet-5-covering-sequence-resiliency

  - id: carlet-5-def-6-partial-covering-sequence
    kind: definition
    location: Carlet, Definition 6, p. 74
    statement: >-
      An integer sequence lambda=(lambda_a)_(a in V_n) is a partial covering
      sequence of f with levels rho,rho' in Z when, for every x, the integer
      sum sum_a lambda_a D_a f(x) belongs to {rho,rho'}. The levels may
      coincide. The sequence is non-trivial when at least one level is
      nonzero.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsPartialCoveringSequence
      - CryptBoolean.partialCoveringExceptionalSet
    references: [68]
    dependencies:
      - carlet-5-def-5-covering-sequence

  - id: carlet-5-derivative-space-partial-covering-sequence
    kind: construction
    location: Carlet, example after Definition 6, p. 74
    statement: >-
      Let D be a nonzero finite F_2-vector space of Boolean functions, every
      element of which is a derivative D_a f. Then the integer sum
      sum_(g in D) g(x) takes only the values 0 and |D|/2. If E is a set of
      directions chosen minimally so that a |-> D_a f is a bijection from E
      to D, then the indicator of E is a non-trivial partial covering sequence
      of f with levels 0 and |D|/2.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsDerivativeSpace
      - CryptBoolean.sum_bitValueInt_submodule_eq_zero_or_half
      - CryptBoolean.derivativeDirectionRepresentative
      - CryptBoolean.booleanDerivative_derivativeDirectionRepresentative
      - CryptBoolean.derivativeDirectionRepresentative_injective
      - CryptBoolean.derivativeRepresentativeDirections
      - CryptBoolean.card_derivativeRepresentativeDirections
      - CryptBoolean.bijOn_booleanDerivative_derivativeRepresentativeDirections
      - CryptBoolean.sum_derivativeRepresentativeDirections
      - CryptBoolean.isPartialCoveringSequence_derivativeRepresentativeDirections
    fidelity_note: >-
      The finite subspace model makes closure under Boolean-function addition
      explicit. A chosen representative direction for each derivative gives a
      bijection onto D and therefore a minimal-cardinality direction set. The
      final theorem also proves that |D|/2 is nonzero when D is nonzero.
    dependencies:
      - carlet-5-def-6-partial-covering-sequence
      - carlet-2-def-2-derivative

  - id: carlet-5-theorem-6
    kind: theorem
    location: Carlet, Theorem 6 and Relation (43), pp. 75--76
    statement: >-
      Let lambda be a partial covering sequence of f with levels rho,rho'. If
      rho' != rho, set
      A={x in V_n | sum_a lambda_a D_a f(x)=rho'}; if rho'=rho, set A to the
      empty set. Then, for every b in V_n,
      (lambda_hat(b)-lambda_hat(0)+2rho) W_f(b)
      = 2(rho-rho') sum_(x in A) (-1)^(f(x)+b dot x).
    formal_status: formalized
    declarations:
      - CryptBoolean.theorem_6_partialCoveringSequence
    references: [68]
    dependencies:
      - carlet-5-def-6-partial-covering-sequence
      - carlet-2-prop-6-fourier-shifts
      - carlet-2-def-walsh-transform

  - id: carlet-5-theorem-6-weight-corollary
    kind: corollary
    location: Carlet, consequence of Theorem 6, p. 76
    statement: >-
      Under the hypotheses and notation of Theorem 6, if rho != 0, then
      2^n-2w_H(f) = W_f(0)
      = (1-rho'/rho) sum_(x in A) (-1)^f(x).
    formal_status: formalized
    declarations:
      - CryptBoolean.theorem_6_weight_identity
    references: [68]
    dependencies:
      - carlet-5-theorem-6
      - carlet-2-balanced-zero-walsh

  - id: carlet-5-theorem-7-weil-bound
    kind: theorem
    location: Carlet, Theorem 7, p. 76
    statement: >-
      Let q be a prime power, let P in F_q[X] have degree d >= 1 with
      gcd(d,q)=1, and let chi be a non-trivial additive character of F_q.
      Then the complete additive character sum satisfies
      |sum_(x in F_q) chi(P(x))| <= (d-1) sqrt(q).
    formal_status: open
    declarations: []
    references: [245]
    fidelity_note: >-
      The word additive is implicit in Carlet's notation and in the binary
      trace specialization; it is made explicit to avoid confusing this with
      a multiplicative-character Weil bound.
    blocker: >-
      Pinned Mathlib and FABL expose non-trivial additive-character
      orthogonality, finite-field Gauss and Jacobi sum identities, and linear
      phase sums, but no bound for an arbitrary polynomial phase. In
      particular they contain no Artin--Schreier curve, genus, Riemann--Roch,
      or finite-field Hasse--Weil point-count layer from which the displayed
      square-root estimate could be derived. The smallest missing result is
      precisely the complete additive-character polynomial Weil bound with
      its degree and coprimality hypotheses.
    dependencies: []

  - id: carlet-5-bridge-trace-character-sum-walsh
    kind: theorem
    location: Project representation bridge for Carlet, p. 76
    statement: >-
      Let theta : V_n ~= GF(2^n) be F_2-linear, let a in GF(2^n) be
      nonzero, and let P in GF(2^n)[X]. For the unique trace-pairing
      coefficient b satisfying u dot x = Tr_n(b theta(x)), the raw Walsh
      coefficient at u of x |-> Tr_n(a P(theta(x))) is the complete
      trace-character sum of a(P+(b/a)X). Hence any uniform real bound B
      for these sums bounds the maximum Walsh magnitude by B and implies
      2^n/2-B/2 <= nl(Tr_n(a P(theta(-)))).
    formal_status: formalized
    declarations:
      - CryptBoolean.tracePolynomialBooleanFunction
      - CryptBoolean.tracePolynomialCharacterSum
      - CryptBoolean.exists_tracePolynomialCharacterSum_eq_walshTransform
      - CryptBoolean.maxWalshMagnitude_tracePolynomialBooleanFunction_le
      - CryptBoolean.two_pow_le_two_mul_nonlinearity_add_of_tracePolynomialCharacterSum_le
      - CryptBoolean.tracePolynomialCharacterSum_nonlinearity_lower_bound
    fidelity_note: >-
      This node isolates the finite-field representation and normalization
      step that Carlet suppresses when identifying V_n with GF(2^n). The
      analytic character-sum estimate remains an explicit hypothesis, so the
      open Weil theorem and its source corollary are not weakened or claimed.
    dependencies:
      - carlet-2-def-walsh-transform
      - carlet-2-trace-pairing-coordinates
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-5-weil-nonlinearity-bound
    kind: corollary
    location: Carlet, binary consequence of Theorem 7, p. 76
    statement: >-
      Let n > 0, let P in GF(2^n)[X] have odd degree d > 1, and let
      a in GF(2^n) be nonzero. For every F_2-linear equivalence
      theta : V_n ~= GF(2^n), define h_theta(x)=Tr_n(a P(theta(x))). Then
      every Walsh coefficient of h_theta has magnitude at most
      (d-1)sqrt(2^n), and
      nl(h_theta) >= 2^(n-1)-(d-1)sqrt(2^n)/2.
    formal_status: open
    declarations: []
    reuse_note: >-
      The field/cube identification, nondegenerate trace pairing, exact Walsh
      identity, and conditional nonlinearity reduction are compiled in the
      project bridge. Once the analytic theorem above is available, only the
      routine verification that every linear perturbation preserves odd
      degree and coprimality remains.
    dependencies:
      - carlet-5-theorem-7-weil-bound
      - carlet-5-bridge-trace-character-sum-walsh

  - id: carlet-5-reciprocal-character-sum-bound
    kind: theorem
    location: Carlet, extended Weil bound and Kloosterman example, p. 76
    statement: >-
      Let n > 0 and let P,Q in GF(2^n)[X] have odd degrees. Then
      |sum_(x in GF(2^n)^*) (-1)^Tr_n(P(x^(-1))+Q(x))|
      <= (deg(P)+deg(Q))sqrt(2^n). Consequently, if inv(0)=0 and
      inv(x)=x^(-1) for x != 0, the corresponding sum over GF(2^n) has
      absolute value at most 1+(deg(P)+deg(Q))sqrt(2^n). With P(X)=X and
      Q(X)=aX, the punctured sums are the Kloosterman sums.
    formal_status: open
    declarations: []
    references: [96, 325]
    fidelity_note: >-
      Carlet prints a one-sided inequality over the whole field after setting
      inv(0)=0. Reference [325, Theorem 1] states the sharp absolute-value
      bound over the nonzero Teichmuller units, which specialize to
      GF(2^n)^*. The omitted x=0 summand has modulus one, so the sharp bound
      transfers to the whole-field convention only with an added 1. This node
      records the primary theorem and its correct whole-field consequence.
    blocker: >-
      This requires a rational-function additive-character estimate with
      controlled pole orders. Replacing inversion by x^(2^n-2) destroys the
      sharp degree bound and generally the coprimality hypothesis, while the
      available Gauss and Jacobi identities do not imply even the stated
      Kloosterman specialization. Pinned dependencies contain neither the
      required conductor/genus calculation nor a Hasse--Weil point-count
      theorem for the corresponding Artin--Schreier curve.
    dependencies:
      - carlet-2-absolute-trace

source_recovery:
  - id: carlet-5-kasami-tokura-low-weight-reed-muller
    kind: theorem
    location: Carlet, Note in Section 5.3, p. 71
    source_claim: >-
      Carlet reports a Kasami--Tokura characterization of the words
      f in R(r,n) with 2^(n-r) <= w_H(f) < 2^(n-r+1): they arise from a
      product of a flat indicator and a quadratic function or from a sum of
      two flat indicators, and their Walsh spectra can be computed exactly.
    statement_status: classification-recovered-primary-fulltext-closed
    formal_status: open
    declarations: []
    references: [205]
    first_release_scope: required-after-source-recovery
    recovered_classification: >-
      Let f : F_2^m -> F_2 be nonzero with degree at most r, where r >= 2,
      and suppose w_H(f) < 2^(m-r+1). Up to an invertible affine change of
      input variables, f is exactly one of the following two forms. First,
      x_1...x_(r-2) times the sum
      x_(r-1)x_r + x_(r+1)x_(r+2) + ... +
      x_(r+2mu-3)x_(r+2mu-2), where 1 <= mu and
      2mu <= m-r+2. Second, x_1...x_(r-mu) times the sum of the two disjoint
      products x_(r-mu+1)...x_r and x_(r+1)...x_(r+mu), where
      3 <= mu <= r and mu <= m-r. Both forms have weight
      2^(m-r+1)-2^(m-r+1-mu). Consequently the weights strictly below twice
      the minimum distance are exactly those values for
      1 <= mu <= max(min(r,m-r), floor((m-r+2)/2)).
    blocker: >-
      The exact classification and parameter ranges are now recovered, but
      the original IEEE full text is closed and has no repository copy, so
      its internal theorem/page number and any discussion beyond the visible
      publisher abstract cannot be checked directly. Promotion should split
      the recovered input-affine normal-form classification from the Walsh
      spectra derived separately using the existing flat-indicator and
      quadratic-spectrum nodes; no visible source attributes those spectra
      to reference [205]. The formal proof additionally lacks the general
      low-weight geometric dichotomy: either the support factors through a
      codimension-(r-2) flat and a quadratic function, or the word is a sum
      of two minimum-weight Reed--Muller words. Proposition 12 and the new
      quadratic normal form close the two terminal branches once that
      structure theorem is available, but the existing weight-8/12/14
      classifications do not generalize the missing induction.
    source_recovery_note: >-
      The publisher abstract for Kasami--Tokura, IEEE TIT 16(6), 752--759,
      DOI 10.1109/TIT.1970.1054545, supplies the hypothesis and both families
      but not every parameter line. Borissov--Manev--Nikova, ISIT 2001,
      proceedings p. 39, Theorem 4, DOI 10.1109/ISIT.2001.935902, gives the
      complete statement above; Carlet--Sole, arXiv:2301.13497v3, p. 2 and
      Theorem 2 on p. 5, independently confirms the forms, ranges, and weight
      set. OpenAlex records the 1970 paper as closed with no repository full
      text. Carlet's sentence about precisely computable Walsh spectra follows
      the citation as a separate consequence, and should be proved from the
      normal forms rather than reported as a theorem visibly stated in [205].
    source_urls:
      - https://doi.org/10.1109/TIT.1970.1054545
      - https://ieeexplore.ieee.org/document/1054545/
      - https://citeseerx.ist.psu.edu/document?doi=fbfce4685203780c0a4b1724c1aa7b8a3027ac62&repid=rep1&type=pdf
      - https://arxiv.org/abs/2301.13497
    dependencies:
      - carlet-3-reed-muller-code
      - carlet-3-prop-12
      - carlet-5-theorem-5
      - carlet-5-flat-indicator-walsh-nonlinearity

