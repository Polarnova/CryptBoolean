items:
  - id: carlet-7-siegenthaler-degree-bounds
    kind: theorem-family
    location: >-
      Siegenthaler's inequalities (Carlet, Section 7.1, p. 111)
    statement: |-
      Let f:V_n\to\mathbb F_2.

      If 0\le m<n-1 and f is m-resilient, then

      \deg(f)\le n-m-1.

      Every (n-1)-resilient function is affine. More generally, if f is
      correlation immune of order m<n, then

      \deg(f)\le n-m.

      If in addition 2^{m+1} divides the Hamming weight of f, then the sharper
      resilient bound \deg(f)\le n-m-1 holds.
    formal_status: formalized
    declarations:
      - CryptBoolean.booleanFunctionF₂Encoding_signCubeView
      - CryptBoolean.functionAlgebraicDegree_le_sub_sub_one_of_isResilient
      - CryptBoolean.functionAlgebraicDegree_le_sub_of_isCorrelationImmune
      - CryptBoolean.functionAlgebraicDegree_le_one_of_isResilient_natPred
      - CryptBoolean.exists_affineFunction_of_isResilient_natPred
      - CryptBoolean.functionAlgebraicDegree_le_sub_sub_one_of_isCorrelationImmune_of_weight
    fidelity_note: >-
      The resilient and correlation-immune forms keep their distinct endpoint
      conventions. The additional weight hypothesis is the one printed in
      footnote 47.
    reuse_note: >-
      The main two degree inequalities are supplied by FABL v0.5.6 after the
      exact Carlet/FABL representation identity is proved.
    dependencies:
      - carlet-4-def-resiliency-correlation-immunity
      - carlet-2-def-algebraic-degree

  - id: carlet-7-prop-32-nnf-characterization
    kind: proposition
    location: >-
      Proposition 32 (Carlet, pp. 111--112)
    statement: |-
      Let n>0, let m<n, and let f:V_n\to\mathbb F_2. Define

      g(x)=f(x)\oplus x_1\oplus\cdots\oplus x_n.

      Then f is m-resilient if and only if the numerical normal form of g has
      degree at most n-m-1.
    formal_status: formalized
    declarations:
      - CryptBoolean.functionNumericalDegree_booleanRealEmbedding_eq_fourierDegree_signCubeView
      - CryptBoolean.functionNumericalDegree_booleanRealEmbedding_le_iff_walshTransform
      - CryptBoolean.proposition_32_resilient_iff_functionNumericalDegree_le
    fidelity_note: >-
      Numerical degree is kept distinct from algebraic degree. The full parity
      shift complements Walsh-frequency supports, exactly as in the source.
    reuse_note: >-
      The proof composes the Chapter 4 Walsh-zero characterization with the
      Chapter 2 NNF/Fourier identities and FABL's canonical numerical degree.
    dependencies:
      - carlet-4-theorem-3
      - carlet-2-rel-30-nnf-fourier
      - carlet-2-nnf-existence-uniqueness

  - id: carlet-7-walsh-weight-divisibility
    kind: theorem-family
    location: >-
      Divisibility consequences following Proposition 32 (Carlet, p. 112)
    statement: |-
      Let 0\le m\le n-2.

      If f:V_n\to\mathbb F_2 is m-resilient, then every value W_f(a) is
      divisible by 2^{m+2}.

      If f is correlation immune of order m, then every W_f(a) is divisible by
      2^{m+1}, and the Hamming weight of f is divisible by 2^m. If moreover
      2^{m+1} divides the Hamming weight of f, then every W_f(a) is divisible
      by 2^{m+2}.
    formal_status: formalized
    declarations:
      - CryptBoolean.bitSignInt_cast_eq_realSignView
      - CryptBoolean.sum_walshTransform_submodule_eq
      - CryptBoolean.two_pow_m_add_two_dvd_walshTransform_of_isResilient
      - CryptBoolean.two_pow_m_add_one_dvd_walshTransform_of_isCorrelationImmune
      - CryptBoolean.two_pow_m_dvd_hammingWeight_of_isCorrelationImmune
      - CryptBoolean.two_pow_m_add_two_dvd_walshTransform_of_isCorrelationImmune_of_weight
    fidelity_note: >-
      The endpoint m=n-1 is excluded exactly as in the printed divisibility
      paragraph.
    reuse_note: >-
      The proof reuses Proposition 32, the exact Walsh/NNF coefficient formulas,
      and the zero-frequency weight identity. Its subspace Walsh-sum identity
      is shared with the later degree-sensitive divisibility proof.
    dependencies:
      - carlet-7-prop-32-nnf-characterization
      - carlet-2-rel-30-nnf-fourier
      - carlet-2-def-support-weight
      - carlet-2-def-walsh-transform

  - id: carlet-7-sarkar-maitra-nonlinearity-bound
    kind: theorem-family
    location: >-
      Sarkar--Maitra bound and equality case (Carlet, pp. 112--113)
    statement: |-
      Let f:V_n\to\mathbb F_2 be m-resilient, where m\le n-2. Then

      \operatorname{nl}(f)\le 2^{n-1}-2^{m+1}.

      If equality holds, then every Walsh coefficient belongs to

      \{0,\,-2^{m+2},\,2^{m+2}\};

      equivalently, f is plateaued with nonzero Walsh magnitude 2^{m+2}.
    formal_status: formalized
    declarations:
      - CryptBoolean.two_mul_nonlinearity_add_two_pow_m_add_two_le_of_isResilient
      - CryptBoolean.nonlinearity_add_two_pow_m_add_one_le_two_pow_sub_one_of_isResilient
      - CryptBoolean.nonlinearity_le_two_pow_sub_two_pow_of_isResilient
      - CryptBoolean.nonlinearity_eq_sarkarMaitra_bound_iff_hasPlateauedWalshAmplitude
      - CryptBoolean.walshTransform_eq_zero_or_eq_neg_two_pow_or_eq_two_pow_of_sarkarMaitra_equality
      - CryptBoolean.isPlateaued_of_sarkarMaitra_equality
    fidelity_note: >-
      The minimum sum-of-squares-indicator sentence is retained separately as
      source recovery because the survey gives neither its comparison class nor
      the minimum value.
    reuse_note: >-
      The inequality composes the preceding divisibility theorem with
      Parseval and Carlet's exact nonlinearity/Walsh identity.
    dependencies:
      - carlet-7-walsh-weight-divisibility
      - carlet-2-parseval
      - carlet-4-rel-35-nonlinearity-walsh
      - carlet-6-def-plateaued

  - id: carlet-7-theorem-13-degree-divisibility
    kind: theorem
    location: >-
      Theorem 13, resilient form (Carlet, p. 113)
    statement: |-
      Let f:V_n\to\mathbb F_2 be m-resilient, let m\le n-2, and let
      d=\deg(f)>0. Every Walsh coefficient of f is divisible by

      2^{\,m+2+\lfloor (n-m-2)/d\rfloor}.

      Consequently, \operatorname{nl}(f) is divisible by

      2^{\,m+1+\lfloor (n-m-2)/d\rfloor}.
    formal_status: formalized
    declarations:
      - CryptBoolean.two_pow_m_add_two_add_degree_quotient_dvd_walshTransform_of_isResilient
      - CryptBoolean.two_pow_m_add_one_add_degree_quotient_dvd_nonlinearity_of_isResilient
    fidelity_note: >-
      Positivity of d is explicit so that the printed quotient is total.
      A resilient function in the stated range cannot be constant.
    reuse_note: >-
      The source proof composes raw Poisson summation with the
      McEliece--Ax character-sum divisibility theorem.
    dependencies:
      - carlet-7-walsh-weight-divisibility
      - carlet-2-cor-1-poisson-summation
      - carlet-6-prop-19
      - carlet-4-theorem-3

  - id: carlet-7-correlation-immune-degree-divisibility
    kind: theorem-family
    location: >-
      Correlation-immune companion to Theorem 13 (Carlet, p. 113)
    statement: |-
      Let f:V_n\to\mathbb F_2 be correlation immune of order m, let
      m\le n-1, and let d=\deg(f)>0. Every Walsh coefficient is divisible by

      2^{\,m+1+\lfloor (n-m-1)/d\rfloor}.

      If m\le n-2 and the Hamming weight of f is divisible by

      2^{\,m+1+\lfloor (n-m-2)/d\rfloor},

      then every Walsh coefficient is divisible by

      2^{\,m+2+\lfloor (n-m-2)/d\rfloor}.
    formal_status: formalized
    declarations:
      - CryptBoolean.two_pow_m_add_one_add_degree_quotient_dvd_walshTransform_of_isCorrelationImmune
      - CryptBoolean.two_pow_m_add_two_add_degree_quotient_dvd_walshTransform_of_isCorrelationImmune_of_weight
    fidelity_note: >-
      The two divisibility exponents and their different endpoint ranges are
      stated separately.
    reuse_note: >-
      This is the correlation-immune branch of the same Poisson and
      McEliece--Ax induction used by Theorem 13.
    dependencies:
      - carlet-6-prop-19
      - carlet-2-cor-1-poisson-summation
      - carlet-4-theorem-3
      - carlet-2-def-support-weight

  - id: carlet-7-degree-sensitive-nonlinearity-bound
    kind: theorem-family
    location: >-
      Consequence of Theorem 13 (Carlet, p. 114)
    statement: |-
      Let f:V_n\to\mathbb F_2 be m-resilient, let m\le n-2, and let
      d=\deg(f)>0. Then

      \operatorname{nl}(f)
      \le 2^{n-1}-2^{\,m+1+\lfloor (n-m-2)/d\rfloor}.

      In particular, equality in the Sarkar--Maitra bound

      \operatorname{nl}(f)=2^{n-1}-2^{m+1}

      is possible only when d=n-m-1.
    formal_status: formalized
    declarations:
      - CryptBoolean.nonlinearity_le_two_pow_sub_two_pow_degree_quotient_of_isResilient
      - CryptBoolean.functionAlgebraicDegree_eq_sub_sub_one_of_sarkarMaitra_equality
    fidelity_note: >-
      The statement records the global algebraic-degree consequence. The
      restriction-minimum refinement is kept under source recovery because the
      survey does not define the minimum when its indexing family is empty.
    reuse_note: >-
      The proof is the direct composition of Theorem 13 with Relation (35) and
      the Siegenthaler degree bound.
    dependencies:
      - carlet-7-theorem-13-degree-divisibility
      - carlet-7-siegenthaler-degree-bounds
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-even-dimension-nonlinearity-bound
    kind: theorem
    location: >-
      Even-dimensional balanced-function improvement (Carlet, p. 114)
    statement: |-
      Let n be positive and even, let m\le n/2-2, and let
      f:V_n\to\mathbb F_2 be m-resilient. Then

      \operatorname{nl}(f)
      \le 2^{n-1}-2^{n/2-1}-2^{m+1}.
    formal_status: formalized
    declarations:
      - CryptBoolean.nonlinearity_le_even_dimension_resilient_bound
    fidelity_note: >-
      The natural-number inequality m\le n/2-2 makes the source range explicit.
    reuse_note: >-
      The proof combines Walsh divisibility with the strict even-dimensional
      upper bound for balanced Boolean functions.
    dependencies:
      - carlet-7-walsh-weight-divisibility
      - carlet-4-rel-36-covering-radius-bent
      - carlet-2-balanced-zero-walsh

  - id: carlet-7-rel-57-parseval-nonlinearity-bound
    kind: theorem
    location: >-
      Relation (57) (Carlet, pp. 114--115)
    statement: |-
      Let f:V_n\to\mathbb F_2 be m-resilient, where m\le n-2. Then

      \operatorname{nl}(f)\le
      2^{n-1}-2^{m+1}
      \left\lceil
        \frac{2^{n-m-2}}
        {\sqrt{\,2^n-\sum_{i=0}^{m}\binom ni\,}}
      \right\rceil.
    formal_status: formalized
    declarations:
      - CryptBoolean.nonlinearity_le_parseval_resilient_bound
    fidelity_note: >-
      The outer brackets in the printed formula are ceilings. Its denominator
      is positive because m<n.
    reuse_note: >-
      The proof counts the non-forced Walsh frequencies, applies Parseval to
      their integer quotients, and then uses Relation (35).
    dependencies:
      - carlet-7-walsh-weight-divisibility
      - carlet-4-theorem-3
      - carlet-2-parseval
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-rel-58-entropy-nonlinearity-bound
    kind: theorem
    location: >-
      Relation (58) (Carlet, p. 115)
    statement: |-
      Let f:V_n\to\mathbb F_2 be m-resilient, where
      1\le m\le n/2. Define

      H_2(x)=-x\log_2x-(1-x)\log_2(1-x).

      Then

      \operatorname{nl}(f)\le
      2^{n-1}-2^{m+1}
      \left\lceil
        \frac{2^{n-m-2}}
        {\sqrt{\,2^n-
          2^{nH_2(m/n)}/\sqrt{8m(1-m/n)}\,}}
      \right\rceil.
    formal_status: formalized
    declarations:
      - CryptBoolean.binaryEntropyBaseTwo
      - CryptBoolean.entropyPower_div_sqrt_le_choose
      - CryptBoolean.nonlinearity_le_entropy_resilient_bound
    fidelity_note: >-
      The survey inherits a standard finite binomial estimate without printing
      its domain. The positive-order half-range is made explicit because m=0
      would make the displayed denominator undefined. Binary entropy is
      normalized in bits by dividing Mathlib's natural-log entropy by log 2.
      The numerator retains the real exponent 2^{-1} at n=2,m=1 rather than
      truncating the exponent as a natural number.
    reuse_note: >-
      A finite Stirling decomposition proves the binomial lower estimate,
      including the two smallest dimensions. Monotonicity of square root,
      division, and ceiling then specializes Relation (57).
    dependencies:
      - carlet-7-rel-57-parseval-nonlinearity-bound

  - id: carlet-7-maximum-correlation-support
    kind: theorem-family
    location: >-
      Maximum correlation with coordinate subsets (Carlet, Section 7.3, p. 115)
    statement: |-
      Let f:V_n\to\mathbb F_2 be m-resilient and let I\subseteq[n].
      Among the Walsh frequencies supported inside I, at most

      \sum_{j=m+1}^{|I|}\binom{|I|}{j}

      can be nonzero.

      If |I|=m+1 and u_I is the unique frequency with support I, then the
      maximum correlation of f with functions depending only on I is

      2^{-n}|W_f(u_I)|.
    formal_status: formalized
    declarations:
      - CryptBoolean.card_highWeightFrequenciesSupportedIn_eq_sum_choose
      - CryptBoolean.card_walshSupport_filter_subset_le_sum_choose_of_isResilient
      - CryptBoolean.maximumCorrelation_eq_abs_walshTransform_f₂CubeOfFinset_div_of_isResilient
    fidelity_note: >-
      The source's application to optimal LFSR attacks is excluded because the
      attack model is not defined in the survey.
    reuse_note: >-
      The exact formula specializes Chapter 4 Relation (40) after the
      low-weight Walsh coefficients vanish.
    dependencies:
      - carlet-4-def-maximum-correlation
      - carlet-4-rel-40-maximum-correlation-bound
      - carlet-4-theorem-3

  - id: carlet-7-resiliency-propagation-tradeoff
    kind: theorem
    location: >-
      Resiliency and propagation criteria (Carlet, Section 7.4, p. 116)
    statement: |-
      If an n-variable Boolean function is m-resilient and satisfies the
      propagation criterion PC(\ell), then

      m+\ell\le n-1.
    formal_status: formalized
    declarations:
      - CryptBoolean.resilient_propagationCriterion_parameter_tradeoff
    fidelity_note: >-
      This is a necessary condition only; the survey does not claim the
      converse.
    reuse_note: >-
      The proof composes the Walsh-zero characterization, the canonical
      propagation predicate, and the full subspace Fourier/autocorrelation
      identity.
    dependencies:
      - carlet-4-def-resiliency-correlation-immunity
      - carlet-4-def-propagation-criteria
      - carlet-4-theorem-3
      - carlet-2-cor-1-poisson-summation
      - carlet-2-rel-25-wiener-khinchin

  - id: carlet-7-resiliency-propagation-equality
    kind: theorem
    location: >-
      Equality case of the resiliency--propagation tradeoff (Carlet,
      Section 7.4, p. 116)
    statement: |-
      Let \ell>0. If an n-variable m-resilient Boolean function satisfies
      PC(\ell) and

      m+\ell=n-1,

      then n is odd, \ell=n-1, and m=0.
    formal_status: formalized
    declarations:
      - CryptBoolean.resilient_propagationCriterion_equality_classification
    fidelity_note: >-
      Positive \ell is implicit in the source's propagation-criterion
      convention and explicit in the formal declaration. With a natural-number
      parameter, PC(0) is vacuous and parity gives a counterexample to the
      unqualified endpoint.
    reuse_note: >-
      The proof composes the Chapter 2 Poisson and autocorrelation identities
      with the canonical propagation and resiliency predicates, then uses
      Walsh-square parity to force odd dimension.
    dependencies:
      - carlet-7-resiliency-propagation-tradeoff

  - id: carlet-7-rel-59-maiorana-mcfarland-general
    kind: definition
    location: >-
      Maiorana--McFarland general construction, Relation (59) (Carlet, p. 117)
    statement: |-
      Let r>0, let r<n, put s=n-r, let
      \phi:V_s\to V_r, and let g:V_s\to\mathbb F_2. Define

      f_{\phi,g}(x,y)
      =x\mathbin\cdot\phi(y)\oplus g(y)
      =\bigoplus_{i=1}^r x_i\phi_i(y)\oplus g(y).
    formal_status: formalized
    declarations:
      - CryptBoolean.booleanMaioranaMcFarlandGeneral
      - CryptBoolean.booleanMaioranaMcFarlandGeneral_append
    fidelity_note: >-
      The two coordinate blocks and the unnormalized Boolean dot product match
      the source convention.
    reuse_note: >-
      This is the same general Maiorana--McFarland representation already used
      by the Chapter 6 fiber-character-sum theorem.
    dependencies:
      - carlet-5-def-maiorana-mcfarland

  - id: carlet-7-rel-60-maiorana-mcfarland-walsh
    kind: theorem
    location: >-
      Relation (60) (Carlet, p. 117)
    statement: |-
      For the function f_{\phi,g} of Relation (59), every a\in V_r and
      b\in V_s satisfy

      W_{f_{\phi,g}}(a,b)
      =2^r\sum_{y\in\phi^{-1}(a)}
        (-1)^{g(y)\oplus b\cdot y}.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_booleanMaioranaMcFarlandGeneral
    fidelity_note: >-
      This is Carlet's raw integer Walsh normalization.
    reuse_note: >-
      The Chapter 6 declaration
      `walshTransform_maioranaMcFarlandGeneral` proves this exact identity and
      is reused without a parallel transform.
    dependencies:
      - carlet-7-rel-59-maiorana-mcfarland-general
      - carlet-6-prop-20-general-maiorana-mcfarland
      - carlet-2-def-walsh-transform

  - id: carlet-7-maiorana-mcfarland-resiliency
    kind: theorem-family
    location: >-
      Resiliency consequences of Relation (60) (Carlet, pp. 117--118)
    statement: |-
      Let f_{\phi,g} be as in Relation (59).

      If w_H(\phi(y))>k for every y\in V_s, then f_{\phi,g} is
      k-resilient. In particular, if 0 is not in the image of \phi, then
      f_{\phi,g} is balanced.

      If additionally, for every a\in V_r, the restriction of g to
      \phi^{-1}(a) is balanced, then f_{\phi,g} is (k+1)-resilient.
      An empty fiber satisfies this condition vacuously through its zero
      signed character sum.
    formal_status: formalized
    declarations:
      - CryptBoolean.isResilient_booleanMaioranaMcFarlandGeneral
      - CryptBoolean.isBalanced_booleanMaioranaMcFarlandGeneral
      - CryptBoolean.isResilient_succ_booleanMaioranaMcFarlandGeneral
    fidelity_note: >-
      “m\ge k” and “m\ge k+1” are represented by the monotone predicates
      `IsResilient k` and `IsResilient (k+1)`, without inventing an exact
      maximal order.
    reuse_note: >-
      Relation (60) and the Chapter 4 Walsh-zero characterization make both
      conclusions direct spectral specializations.
    dependencies:
      - carlet-7-rel-60-maiorana-mcfarland-walsh
      - carlet-4-theorem-3

  - id: carlet-7-maiorana-mcfarland-degree
    kind: theorem-family
    location: >-
      Degree of the general Maiorana--McFarland construction (Carlet, p. 118;
      corrected one-variable endpoint)
    statement: |-
      For f_{\phi,g} on V_r\times V_s,

      \deg(f_{\phi,g})\le s+1,

      and equality holds exactly when some coordinate of \phi has degree s.
      If every value of \phi has weight greater than k, this can happen only
      for k\le r-2.

      Suppose the resiliency order is k. Then f_{\phi,g} reaches
      Siegenthaler's degree bound n-k-1 exactly in either of the following
      cases:

      * k=r-2 and \deg(\phi)=s=n-k-2;
      * k=r-1, \phi is the constant all-one map, and either s=1 or
        \deg(g)=s=n-k-1.
    formal_status: formalized
    declarations:
      - CryptBoolean.maioranaMcFarlandCoordinate
      - CryptBoolean.maioranaMcFarlandMapAlgebraicDegree
      - CryptBoolean.functionAlgebraicDegree_maioranaMcFarlandCoordinate_le
      - CryptBoolean.maioranaMcFarlandMapAlgebraicDegree_le_dimension
      - CryptBoolean.maioranaMcFarlandMapAlgebraicDegree_eq_dimension_iff
      - CryptBoolean.functionAlgebraicDegree_booleanMaioranaMcFarlandGeneral_le
      - CryptBoolean.functionAlgebraicDegree_booleanMaioranaMcFarlandGeneral_eq_iff
      - CryptBoolean.functionAlgebraicDegree_booleanMaioranaMcFarlandGeneral_eq_iff_mapDegree
      - CryptBoolean.functionAlgebraicDegree_booleanMaioranaMcFarlandGeneral_constant_one
      - CryptBoolean.le_r_sub_two_of_weight_gt_of_maioranaMcFarland_degree_eq
      - CryptBoolean.functionAlgebraicDegree_booleanMaioranaMcFarlandGeneral_eq_siegenthalerBound_iff
      - CryptBoolean.isResilient_and_functionAlgebraicDegree_eq_siegenthalerBound_iff
    fidelity_note: >-
      The printed second branch says only `deg(g)=s`; when s=1 the x-linear
      term already gives degree one for every unary g. The explicit `s=1`
      alternative corrects that endpoint.
    reuse_note: >-
      The proof uses the canonical FABL ANF and algebraic-degree operations and
      Relation (59), with no new degree representation.
    dependencies:
      - carlet-7-rel-59-maiorana-mcfarland-general
      - carlet-7-siegenthaler-degree-bounds
      - carlet-2-def-algebraic-degree

  - id: carlet-7-rel-61-maiorana-nonlinearity-lower
    kind: theorem
    location: >-
      Relation (61) (Carlet, p. 118)
    statement: |-
      Let M=\max_{a\in V_r}|\phi^{-1}(a)|. Then

      \operatorname{nl}(f_{\phi,g})
      \ge 2^{n-1}-2^{r-1}M.
    formal_status: formalized
    declarations:
      - CryptBoolean.maioranaMcFarlandFiberCardinality
      - CryptBoolean.maxMaioranaMcFarlandFiberCardinality
      - CryptBoolean.maioranaMcFarlandFiberCardinality_le_max
      - CryptBoolean.maioranaMcFarlandFiberCharacterSum_natAbs_le_cardinality
      - CryptBoolean.maxWalshMagnitude_booleanMaioranaMcFarlandGeneral_le
      - CryptBoolean.relation_61_booleanMaioranaMcFarlandGeneral
      - CryptBoolean.nonlinearity_booleanMaioranaMcFarlandGeneral_lower_bound
    fidelity_note: >-
      Fiber cardinality is a natural number and the displayed expression keeps
      Carlet's raw Walsh scaling.
    reuse_note: >-
      This follows immediately from Relation (60), the triangle inequality,
      and Relation (35).
    dependencies:
      - carlet-7-rel-60-maiorana-mcfarland-walsh
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-rel-62-maiorana-nonlinearity-upper
    kind: theorem-family
    location: >-
      Relation (62) and its square-sum proof (Carlet, pp. 118--119)
    statement: |-
      Let M=\max_{a\in V_r}|\phi^{-1}(a)|. Then

      \operatorname{nl}(f_{\phi,g})
      \le 2^{n-1}-2^{r-1}\lceil\sqrt M\rceil.

      More precisely, for every a\in V_r,

      \sum_{b\in V_s}
        \left(
          \sum_{y\in\phi^{-1}(a)}(-1)^{g(y)\oplus b\cdot y}
        \right)^2
      =2^s|\phi^{-1}(a)|.
    formal_status: formalized
    declarations:
      - CryptBoolean.sum_sq_maioranaMcFarlandFiberCharacterSum
      - CryptBoolean.two_pow_mul_ceil_sqrt_maxFiber_le_maxWalshMagnitude
      - CryptBoolean.nonlinearity_booleanMaioranaMcFarlandGeneral_upper_bound
    fidelity_note: >-
      The large brackets in Relation (62) are a ceiling, forced also by the
      integer-valued character sum in the proof.
    reuse_note: >-
      The square-sum identity is finite character orthogonality; Relation (60)
      and Relation (35) then give the upper bound.
    dependencies:
      - carlet-7-rel-60-maiorana-mcfarland-walsh
      - carlet-2-parseval
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-maiorana-optimal-classification
    kind: theorem-family
    location: >-
      Classification following Relation (62) (Carlet, p. 119)
    statement: |-
      Suppose w_H(\phi(y))>k for every y and

      \operatorname{nl}(f_{\phi,g})=2^{n-1}-2^{k+1}.

      Then r=k+1 or r=k+2.

      If r=k+1, then \phi is the constant all-one map, n\le k+3, and
      either s=1 with arbitrary unary g, or s=2 with
      g(y_1,y_2)=y_1y_2\oplus\ell(y) for an affine \ell.

      If r=k+2, then \phi is injective,

      n\le k+2+\log_2(k+3),

      g is arbitrary, and

      \deg(f_{\phi,g})\le 1+\log_2(k+3).
    formal_status: formalized
    declarations:
      - CryptBoolean.maxWalshMagnitude_eq_two_pow_m_add_two_of_nonlinearity_eq
      - CryptBoolean.map_eq_one_of_weight_gt_natPred
      - CryptBoolean.booleanMaioranaMcFarlandGeneral_constant_one_eq_directSum
      - CryptBoolean.twoVariableProduct
      - CryptBoolean.twoVariableProduct_apply
      - CryptBoolean.twoVariableProductAt
      - CryptBoolean.maxWalshMagnitude_eq_of_maioranaMcFarland_optimal
      - CryptBoolean.leftDimension_eq_succ_or_add_two_of_maioranaMcFarland_optimal
      - CryptBoolean.maxMaioranaMcFarlandFiberCardinality_const
      - CryptBoolean.exists_eq_twoVariableProduct_add_affine_of_maxWalshMagnitude_eq_two
      - CryptBoolean.exists_eq_twoVariableProductAt_add_affine_of_maxWalshMagnitude_eq_two
      - CryptBoolean.maioranaMcFarland_optimal_constant_branch
      - CryptBoolean.injective_of_maioranaMcFarland_optimal_add_two_branch
      - CryptBoolean.card_highWeightCube
      - CryptBoolean.two_pow_rightDimension_le_k_add_three_of_add_two_branch
      - CryptBoolean.rightDimension_cast_le_logb_two_k_add_three
      - CryptBoolean.maioranaMcFarland_optimal_injective_branch
      - CryptBoolean.maioranaMcFarland_optimal_classification
    fidelity_note: >-
      The inequalities involving logarithms are the real-valued inequalities
      printed in the source. The constant-map branch states the feasible
      unary endpoint separately: when s=1 the offset is arbitrary, whereas
      the quadratic-affine normal form applies to s=2.
    reuse_note: >-
      Relation (35) first fixes the maximum Walsh magnitude. Relation (62)
      reduces the two possible block sizes to finite fiber-cardinality
      classifications, while the existing Maiorana--McFarland degree bound
      supplies the final logarithmic degree estimate.
    dependencies:
      - carlet-7-rel-62-maiorana-nonlinearity-upper
      - carlet-7-maiorana-mcfarland-degree

  - id: carlet-7-linear-pullback-construction
    kind: theorem
    location: >-
      Linear-map construction (Carlet, p. 120)
    statement: |-
      Let k<n, let g:V_k\to\mathbb F_2, let
      L:V_n\to V_k be a surjective linear map, and let s\in V_n.
      Let C be the row space of a matrix for L and put

      d=\operatorname{dist}(s,C).

      If d>0, then

      f(x)=g(Lx)\oplus s\cdot x

      is (d-1)-resilient.
    formal_status: formalized
    declarations:
      - CryptBoolean.vectorFourierCoeff_comp_linearMap_eq_zero_of_not_mem_perpendicular_ker
      - CryptBoolean.binaryCosetMinimumWeight
      - CryptBoolean.binaryCosetMinimumWeight_le
      - CryptBoolean.binaryCosetMinimumWeight_le_dimension
      - CryptBoolean.linearPullbackWithFrequency
      - CryptBoolean.walshTransform_linearPullbackWithFrequency
      - CryptBoolean.isResilient_linearPullbackWithFrequency
    fidelity_note: >-
      The source silently treats d-1 as a nonnegative order. The explicit
      hypothesis d>0 is necessary; if s lies in the row space, f need not be
      balanced. The production theorem is coordinate-free: the row space is
      represented canonically as the perpendicular complement of the kernel.
      Its proof does not require surjectivity, so it deliberately generalizes
      that source hypothesis.
    reuse_note: >-
      The proof identifies the Walsh support of a linear pullback with an
      affine row-space coset and then applies the Chapter 4 Walsh-zero
      characterization.
    dependencies:
      - carlet-4-theorem-3
      - carlet-2-prop-6-fourier-shifts
      - carlet-4-resiliency-support-dual-distance

  - id: carlet-7-rel-63-partial-spread-resilient
    kind: theorem
    location: >-
      Partial-spread-derived construction, Relation (63) (Carlet, pp. 120--121)
    statement: |-
      Let k,r be positive, let n\ge r, put s=n-r, and identify V_r with
      \mathbb F_{2^r}. Let g:\mathbb F_{2^r}\to\mathbb F_2, let
      \phi:V_s\to\mathbb F_{2^r} be linear, and let
      \phi^*:\mathbb F_{2^r}\to V_s be its adjoint for the trace pairing.
      Choose a\in\mathbb F_{2^r} and b\in V_s such that

      a+\phi(y)\ne0\quad(y\in V_s)

      and

      w_H(\phi^*(z)+b)>k\quad(z\in\mathbb F_{2^r}).

      Then

      f(x,y)=g\!\left(\frac{x}{a+\phi(y)}\right)\oplus b\cdot y

      is k-resilient.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialSpreadResilientFunction
      - CryptBoolean.partialSpreadResilientFunction_append
      - CryptBoolean.walshTransform_partialSpreadResilientFunction_append
      - CryptBoolean.isResilient_partialSpreadResilientFunction
    fidelity_note: >-
      “m\ge k” is represented as k-resiliency. The field/cube identification
      and the adjoint trace pairing are explicit data rather than silently
      inferred from coordinates.
    reuse_note: >-
      This construction reuses the Chapter 6 `PS_ap` field layer, the Chapter 2
      trace-pairing coordinates, and the canonical Walsh-zero criterion.
    dependencies:
      - carlet-6-partial-spread-construction
      - carlet-2-trace-pairing-coordinates
      - carlet-4-theorem-3

  - id: carlet-7-prop-33-dobbertin-walsh
    kind: proposition
    location: >-
      Proposition 33 and Relation (64) (Carlet, p. 121)
    statement: |-
      Let n be positive and even. Let
      f:V_{n/2}\times V_{n/2}\to\mathbb F_2 be bent and satisfy
      f(x,0)=0 for every x. Let g:V_{n/2}\to\mathbb F_2 be balanced and define

      h(x,y)=f(x,y)\oplus\delta_0(y)g(x).

      Then

      W_h(u,v)=
      \begin{cases}
      0,&u=0,\\
      W_f(u,v)+W_g(u),&u\ne0.
      \end{cases}

      In particular, h is balanced.
    formal_status: formalized
    declarations:
      - CryptBoolean.dobbertinConstruction
      - CryptBoolean.dobbertinConstruction_append
      - CryptBoolean.walshTransform_dobbertinConstruction_general
      - CryptBoolean.walshTransform_dobbertinConstruction
