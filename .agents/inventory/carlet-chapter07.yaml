      - CryptBoolean.functionAlgebraicDegree_addingVariable_eq
      - CryptBoolean.functionAlgebraicDegree_addingVariable_eq_source
      - CryptBoolean.nonlinearity_addingVariable_ge_source
    fidelity_note: >-
      The parameter sentence records lower degree/nonlinearity values in the
      source shorthand; the first conclusion is independent of sharpness.
    reuse_note: >-
      This is the one-variable affine specialization of the direct-sum
      construction.
    dependencies:
