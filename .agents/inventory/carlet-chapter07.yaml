  - id: carlet-7-theorem-14-indirect-sum
    kind: theorem-family
    location: >-
      Theorem 14 and Relations (66)--(67) (Carlet, pp. 126--127)
    statement: |-
      Let r,s>0, let t<r and m<s. Let f_1,f_2:V_r\to\mathbb F_2 be
      t-resilient and let g_1,g_2:V_s\to\mathbb F_2 be m-resilient. Define

      h(x,y)=f_1(x)\oplus g_1(y)
        \oplus(f_1\oplus f_2)(x)(g_1\oplus g_2)(y).

      Then h is (t+m+1)-resilient and

      W_h(a,b)=\frac12W_{f_1}(a)(W_{g_1}(b)+W_{g_2}(b))
              +\frac12W_{f_2}(a)(W_{g_1}(b)-W_{g_2}(b)).

      If the Walsh supports of f_1,f_2 are disjoint and likewise those of
      g_1,g_2, then

      \operatorname{nl}(h)
      =\min_{i,j\in\{1,2\}}
        \left(
          2^{r+s-2}
          +2^{r-1}\operatorname{nl}(g_j)
          +2^{s-1}\operatorname{nl}(f_i)
          -\operatorname{nl}(f_i)\operatorname{nl}(g_j)
        \right).
    formal_status: formalized
    declarations:
      - CryptBoolean.two_mul_walshTransform_indirectSum
      - CryptBoolean.walshTransform_indirectSum_cast_eq_relation_66
      - CryptBoolean.isResilient_indirectSum
      - CryptBoolean.two_mul_maxWalshMagnitude_indirectSum_of_disjointWalshSupport
      - CryptBoolean.nonlinearity_indirectSum_cast_eq_relation_67_spectral
      - CryptBoolean.nonlinearity_indirectSum_cast_eq_relation_67
    fidelity_note: >-
      Relation (66) is first represented over the integers without division.
      The Relation (67) declaration simplifies the minimum over four pairs to
      the minimum nonlinearity in each spectrally disjoint pair.
    reuse_note: >-
      The existing Chapter 6 `indirectSum` is reused. Relation (66) is the sole
      spectral controller for resilience and Relation (67).
    dependencies:
      - carlet-6-indirect-sum
      - carlet-7-direct-sum-resilient
      - carlet-4-theorem-3
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-theorem-14-indirect-sum-degree
    kind: theorem-family
    location: >-
      Degree clause of Theorem 14 (Carlet, pp. 126--127; corrected
      nonconstant hypotheses)
    statement: |-
      In the setting of Theorem 14, if f_1\oplus f_2 and
      g_1\oplus g_2 are both nonconstant, then

      \deg(h)=\max\bigl(
        \deg f_1,\deg g_1,
        \deg(f_1\oplus f_2)+\deg(g_1\oplus g_2)
      \bigr).

      If either difference is constant, the corresponding branch reduces to
      a direct sum and has the degree supplied by that specialization.
    formal_status: formalized
    declarations:
      - CryptBoolean.booleanBlockProduct
      - CryptBoolean.booleanBlockProduct_append
      - CryptBoolean.functionAlgebraicDegree_booleanBlockProduct
      - CryptBoolean.functionAlgebraicDegree_indirectSum
      - CryptBoolean.functionAlgebraicDegree_indirectSum_of_leftDifference_eq_zero
      - CryptBoolean.functionAlgebraicDegree_indirectSum_of_leftDifference_eq_one
      - CryptBoolean.functionAlgebraicDegree_indirectSum_of_rightDifference_eq_zero
      - CryptBoolean.functionAlgebraicDegree_indirectSum_of_rightDifference_eq_one
    fidelity_note: >-
      The printed degree branch assumes only distinct pairs, but its proof uses
      both pairwise sums nonconstant. Distinct complementary functions make a
      sum constant and can invalidate the displayed degree formula.
    reuse_note: >-
      The nonconstant branch reuses the ANF degree of products on disjoint
      blocks; the constant branches reuse the Chapter 7 direct-sum degree
      theorem.
    dependencies:
      - carlet-7-theorem-14-indirect-sum
      - carlet-7-direct-sum-degree
      - carlet-2-def-algebraic-degree

  - id: carlet-7-prop-34-three-function-construction
    kind: proposition
    location: >-
      Proposition 34 and Relations (68)--(69) (Carlet, pp. 127--128)
    statement: |-
      Let n>0 and k<n. Let f_1,f_2,f_3:V_n\to\mathbb F_2 each be
      correlation immune of order k, respectively k-resilient. Put

      s_1=f_1\oplus f_2\oplus f_3,\qquad
      s_2=f_1f_2\oplus f_1f_3\oplus f_2f_3.

      Then s_1 is correlation immune of order k, respectively k-resilient, if
      and only if s_2 has the same property.

      Moreover,

      \operatorname{nl}(s_2)\ge
      \frac12\left(
        \operatorname{nl}(s_1)+
        \sum_{i=1}^3\operatorname{nl}(f_i)-2^{n-1}
      \right).

    formal_status: formalized
    declarations:
      - CryptBoolean.isCorrelationImmune_threeFunctionSum_iff_pairwiseProductSum
      - CryptBoolean.isResilient_threeFunctionSum_iff_pairwiseProductSum
      - CryptBoolean.two_mul_maxWalshMagnitude_pairwiseProductSum_le
      - CryptBoolean.relation_68_threeFunctionConstruction
      - CryptBoolean.nonlinearity_pairwiseProductSum_cast_lower_bound
    fidelity_note: >-
      Both the correlation-immune and resilient branches are retained. The
      half-factor inequalities also receive division-free integer forms.
    reuse_note: >-
      Chapter 6 Relation (50), already formalized as
      `walshTransform_threeFunctionIdentity`, is reused as the exact spectral
      identity for every conclusion.
    dependencies:
      - carlet-6-prop-22-three-function-identity
      - carlet-4-theorem-3
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-rel-69-three-function-disjoint-spectra
    kind: theorem
    location: >-
      Relation (69) (Carlet, p. 128)
    statement: |-
      Under the hypotheses of Proposition 34, suppose the Walsh supports of
      f_1,f_2,f_3 are pairwise disjoint. Then

      \operatorname{nl}(s_2)\ge
      \frac12\left(
        \operatorname{nl}(s_1)+
        \min_{1\le i\le3}\operatorname{nl}(f_i)
      \right).
    formal_status: formalized
    declarations:
      - CryptBoolean.two_mul_maxWalshMagnitude_pairwiseProductSum_le_of_pairwiseDisjoint
      - CryptBoolean.relation_69_threeFunctionConstruction
      - CryptBoolean.nonlinearity_pairwiseProductSum_cast_lower_bound_of_pairwiseDisjoint
    fidelity_note: >-
      Pairwise disjointness means at most one of the three input Walsh
      coefficients is nonzero at each frequency. A division-free natural
      inequality precedes the displayed half-factor form.
    reuse_note: >-
      The proof specializes Relation (50) through a shared disjoint-Walsh-
      support predicate and then reuses Relation (35).
    dependencies:
      - carlet-7-prop-34-three-function-construction
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-disjoint-truth-support-sum
    kind: theorem-family
    location: >-
      Disjoint-support remark (Carlet, p. 128)
    statement: |-
      Let g,h:V_n\to\mathbb F_2 have disjoint truth supports and put
      f=g\oplus h.

      Then f is balanced exactly when

      w_H(g)+w_H(h)=2^{n-1}.

      If g and h are correlation immune of order m and f is balanced, then f
      is m-resilient and

      \operatorname{nl}(f)
      \ge\operatorname{nl}(g)+\operatorname{nl}(h)-2^{n-1}.

      Also

      \deg(f)\le\max(\deg g,\deg h),

      and equality can occur.
    formal_status: formalized
    declarations:
      - CryptBoolean.hammingWeight_add_eq_of_disjoint_truthSupport
      - CryptBoolean.isBalanced_add_iff_hammingWeight_add_eq_two_pow_pred
      - CryptBoolean.walshTransform_add_of_disjoint_truthSupport
      - CryptBoolean.isResilient_add_of_disjoint_truthSupport
      - CryptBoolean.maxWalshMagnitude_add_le_of_disjoint_truthSupport
      - CryptBoolean.nonlinearity_add_le_two_pow_pred_add_of_disjoint_truthSupport
      - CryptBoolean.nonlinearity_add_sub_two_pow_pred_le_of_disjoint_truthSupport
      - CryptBoolean.functionAlgebraicDegree_add_le_max_of_disjoint_truthSupport
      - CryptBoolean.exists_disjoint_truthSupport_functionAlgebraicDegree_add_eq_max
    fidelity_note: >-
      “Can be equal” is represented by a separate finite existence witness,
      not by an unconditional equality.
    reuse_note: >-
      The proof composes support-cardinality addition, linearity of the raw
      Fourier transform, Theorem 3, and Relation (35).
    dependencies:
      - carlet-2-def-support-weight
      - carlet-4-theorem-3
      - carlet-4-rel-35-nonlinearity-walsh
      - carlet-2-def-algebraic-degree

  - id: carlet-7-maiorana-mcfarland-count
    kind: theorem-family
    location: >-
      Maiorana--McFarland counts (Carlet, Section 7.6, p. 129)
    statement: |-
      Let r>0 and s=n-r.

      The number of pairs (\phi,g) in Relation (59) satisfying
      \phi(y)\ne0 for every y is

      (2^{r+1}-2)^{2^s}.

      The number of pairs satisfying w_H(\phi(y))>m for every y is

      \left(
        2\sum_{i=m+1}^{r}\binom ri
      \right)^{2^{n-r}}.

      If r=1 or r\ge3, the first quantity is at most 2^{2^{n-1}}. At r=2
      the printed bound is false and the strict reverse inequality holds.
    formal_status: formalized
    declarations:
      - CryptBoolean.pointwiseConstrainedGeneralMaioranaMcFarlandParametersEquiv
      - CryptBoolean.card_pointwiseConstrainedGeneralMaioranaMcFarlandParameters
      - CryptBoolean.card_nonzero_f₂Cube
      - CryptBoolean.card_f₂Cube_weight_gt_eq_sum_choose
      - CryptBoolean.card_nonzeroGeneralMaioranaMcFarlandParameters
      - CryptBoolean.card_highWeightGeneralMaioranaMcFarlandParameters
      - CryptBoolean.card_nonzeroGeneralMaioranaMcFarlandParameters_le
      - CryptBoolean.card_nonzeroGeneralMaioranaMcFarlandParameters_sourceBound_lt_at_two
    fidelity_note: >-
      These count construction data (\phi,g), as the source does; they do not
      quotient different data that may define the same Boolean function.
      The source's claimed upper bound for every positive r fails at r=2:
      already for one fiber it asserts 6\le4. The exact valid range and the
      strict counterexample are both formalized.
    reuse_note: >-
      The proof is a finite independent-choice count over fibers and reuses
      Mathlib's Boolean-cube cardinalities.
    dependencies:
      - carlet-7-rel-59-maiorana-mcfarland-general
      - carlet-7-maximum-correlation-support

  - id: carlet-7-naive-resilient-count-bound
    kind: theorem
    location: >-
      Naive counting bound (Carlet, p. 129)
    statement: |-
      The number of m-resilient n-variable Boolean functions is at most

      2^{\sum_{i=0}^{n-m-1}\binom ni}.
    formal_status: formalized
    declarations:
      - CryptBoolean.exists_eq_affineFunction_fullFrequency_of_isResilient_natPred
      - CryptBoolean.natCard_isResilient_le_naiveBound
    fidelity_note: >-
      The finite class is counted extensionally as Boolean functions, not as
      syntactic ANF expressions.
    reuse_note: >-
      This is the Chapter 4 degree count specialized through Siegenthaler's
      bound.
    dependencies:
      - carlet-7-siegenthaler-degree-bounds
      - carlet-4-degree-count

