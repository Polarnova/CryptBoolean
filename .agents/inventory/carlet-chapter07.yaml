  - id: carlet-7-direct-sum-resilient
    kind: theorem-family
    location: >-
      Direct sum of functions (Carlet, Section 7.5.2.I.B, pp. 122--123)
    statement: |-
      Let f:V_r\to\mathbb F_2 be t-resilient and let
      g:V_s\to\mathbb F_2 be m-resilient, with t<r and m<s. Then

      h(x,y)=f(x)\oplus g(y)

      is (t+m+1)-resilient and

      W_h(a,b)=W_f(a)W_g(b).

      \operatorname{nl}(h)
      =2^{r+s-1}
       -\frac12(2^r-2\operatorname{nl}(f))
                    (2^s-2\operatorname{nl}(g))

      =2^r\operatorname{nl}(g)+2^s\operatorname{nl}(f)
       -2\operatorname{nl}(f)\operatorname{nl}(g).

      Finally, h has no nonzero linear structure if and only if neither f nor
      g has a nonzero linear structure.
    formal_status: formalized
    declarations:
      - CryptBoolean.card_f₂Support_append
      - CryptBoolean.walshTransform_natAbs_le_maxWalshMagnitude
      - CryptBoolean.maxWalshMagnitude_booleanDirectSum
      - CryptBoolean.isResilient_booleanDirectSum
      - CryptBoolean.two_mul_nonlinearity_booleanDirectSum_add_product
      - CryptBoolean.nonlinearity_booleanDirectSum_cast_eq_half_product
      - CryptBoolean.nonlinearity_booleanDirectSum_cast_eq_source
      - CryptBoolean.nonlinearity_booleanDirectSum
      - CryptBoolean.booleanDerivative_booleanDirectSum_append
      - CryptBoolean.isLinearStructure_booleanDirectSum_append
      - CryptBoolean.noNonzeroLinearStructure_booleanDirectSum
    fidelity_note: >-
      Feasible resilient orders are explicit. The half-factor formula is also
      represented by a division-free natural-number identity.
    reuse_note: >-
      The existing Chapter 6 direct-sum definition and Walsh product are the
      canonical core; Chapter 7 adds only the resilience, degree, nonlinearity,
      and linear-structure consequences.
    dependencies:
      - carlet-6-direct-sum
      - carlet-4-theorem-3
      - carlet-4-rel-35-nonlinearity-walsh
      - carlet-4-def-linear-kernel

  - id: carlet-7-direct-sum-degree
    kind: theorem
    location: >-
      Degree of a direct sum (Carlet, Section 7.5.2.I.B, p. 123)
    statement: |-
      For Boolean functions f:V_r\to\mathbb F_2 and
      g:V_s\to\mathbb F_2 on disjoint coordinate blocks,

      \deg(f\oplus g)=\max(\deg f,\deg g).
    formal_status: formalized
    declarations:
      - CryptBoolean.functionAlgebraicDegree_add_constant_eq
      - CryptBoolean.functionAlgebraicDegree_eq_zero_iff_exists_constant
      - CryptBoolean.functionAlgebraicDegree_add_eq_right_of_lt
      - CryptBoolean.functionAlgebraicDegree_booleanDirectSum
    fidelity_note: >-
      The exact equality, rather than only the standard upper bound, requires
      transporting the two ANFs into disjoint ambient coordinate blocks.
    reuse_note: >-
      The proof transports the canonical ANF coefficients into the two
      disjoint ambient coordinate blocks and reuses `booleanDirectSum`.
    dependencies:
      - carlet-7-direct-sum-resilient
      - carlet-2-def-algebraic-degree

  - id: carlet-7-rel-65-siegenthaler-concatenation
    kind: theorem-family
    location: >-
      Siegenthaler concatenation and Relation (65) (Carlet, p. 123)
    statement: |-
      For f,g:V_r\to\mathbb F_2 define

      h(x,z)=(z\oplus1)f(x)\oplus zg(x).

      Then

      W_h(a,c)=W_f(a)+(-1)^cW_g(a).

      If f and g are both m-resilient, then h is m-resilient. If moreover

      W_f(a)+W_g(a)=0

      for every frequency a of weight m+1, then h is
      (m+1)-resilient.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_hyperplaneExtension_append
      - CryptBoolean.isResilient_hyperplaneExtension
      - CryptBoolean.isResilient_succ_hyperplaneExtension_of_walshCancellation
    fidelity_note: >-
      The second conclusion is a sufficient spectral cancellation condition,
      not an iff characterization.
    reuse_note: >-
      The Walsh identity is proved once for the canonical concatenation and
      feeds both resilience conclusions through Chapter 4 Theorem 3.
    dependencies:
      - carlet-4-theorem-3
      - carlet-2-def-walsh-transform

  - id: carlet-7-siegenthaler-concatenation-nonlinearity
    kind: theorem-family
    location: >-
      Nonlinearity of Siegenthaler concatenation (Carlet, pp. 123--124)
    statement: |-
      For the concatenation h of f and g,

      \operatorname{nl}(h)
      \ge\operatorname{nl}(f)+\operatorname{nl}(g).

      If the Walsh supports of f and g are disjoint, then

      \operatorname{nl}(h)
      =2^{r-1}+\min(\operatorname{nl}(f),\operatorname{nl}(g)).
    formal_status: formalized
    declarations:
      - CryptBoolean.nonlinearity_add_le_hyperplaneExtension
      - CryptBoolean.maxWalshMagnitude_hyperplaneExtension_of_disjointWalshSupport
      - CryptBoolean.nonlinearity_hyperplaneExtension_of_disjointWalshSupport
    fidelity_note: >-
      Disjoint Walsh support means that no frequency carries nonzero
      coefficients for both functions.
    reuse_note: >-
      Relation (65) supplies the spectral maximum inequalities; Relation (35)
      supplies the exact nonlinearity conversion.
    dependencies:
      - carlet-7-rel-65-siegenthaler-concatenation
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-7-siegenthaler-concatenation-degree
    kind: theorem-family
    location: >-
      Degree, derivatives, and linear structures of concatenation (Carlet,
      p. 124)
    statement: |-
      Let q=f\oplus g and let h be their concatenation. Then

      h(x,z)=f(x)\oplus zq(x)

      and

      D_{(a,c)}h(x,z)
      =D_af(x)\oplus cq(x)\oplus zD_aq(x)\oplus cD_aq(x).

      If q\ne0 and \deg(q)=\max(\deg f,\deg g), then

      \deg(h)=1+\max(\deg f,\deg g).

      If 0<\deg(q) and \deg(q)\ge\deg(f), then no direction (a,1) is a
      linear structure of h.

      A direction (a,0) is a linear structure exactly when a is a common
      linear structure of f and g with the same derivative constant.

      Consequently, under the same positive-degree condition on q, if there
      is no nonzero a for which D_af and D_ag are equal constants, then h
      has no nonzero linear structure.
    formal_status: formalized
    declarations:
      - CryptBoolean.hyperplaneExtension_append_eq_add_mul_difference
      - CryptBoolean.hyperplaneExtension_eq_booleanDirectSum_add_booleanBlockProduct
      - CryptBoolean.booleanDerivative_hyperplaneExtension_append
      - CryptBoolean.HaveEqualConstantDerivative
      - CryptBoolean.isLinearStructure_hyperplaneExtension_append_zero_iff
      - CryptBoolean.functionAlgebraicDegree_hyperplaneExtension_eq_succ_max
      - CryptBoolean.not_isLinearStructure_hyperplaneExtension_append_one
      - CryptBoolean.no_nonzero_linearStructure_hyperplaneExtension
    fidelity_note: >-
      The degree hypothesis controlling directions (a,1) and the separate
      common-derivative hypothesis controlling directions (a,0) are retained
      as printed. Lean assigns degree zero to the zero function, whereas the
      source's “highest monomials are not all the same” excludes q=0; the
      explicit q\ne0 hypothesis preserves that condition. For the
      linear-structure conclusion the source also needs positive degree:
      complementary constant f and g give q=1 and make every direction
      (a,1) a constant derivative.
    reuse_note: >-
      The proof uses the canonical Boolean derivative and algebraic-degree
      operations without duplicating the linear-kernel predicate.
    dependencies:
      - carlet-7-rel-65-siegenthaler-concatenation
      - carlet-4-def-linear-kernel
      - carlet-2-def-2-derivative
      - carlet-2-def-algebraic-degree

  - id: carlet-7-concatenation-family
    kind: theorem-family
    location: >-
      Generalized concatenation (Carlet, p. 124)
    statement: |-
      Let (f_y)_{y\in V_s} be a family of r-variable m-resilient functions and
      define

      F(x,y)=f_y(x).

      Then F is m-resilient, and for every a\in V_r and b\in V_s,

      W_F(a,b)=\sum_{y\in V_s}(-1)^{b\cdot y}W_{f_y}(a).
    formal_status: formalized
    declarations:
      - CryptBoolean.familyConcatenation
      - CryptBoolean.familyConcatenation_append
      - CryptBoolean.firstBlockSlice_familyConcatenation
      - CryptBoolean.walshTransform_familyConcatenation_append
      - CryptBoolean.isResilient_familyConcatenation
    fidelity_note: >-
      The indexed family and both frequency blocks are explicit.
    reuse_note: >-
      This finite Walsh identity generalizes Relation (65) and the resilience
      conclusion again uses Chapter 4 Theorem 3.
    dependencies:
      - carlet-7-rel-65-siegenthaler-concatenation
      - carlet-4-theorem-3

  - id: carlet-7-tarannikov-elementary-construction
    kind: theorem-family
    location: >-
      Tarannikov's elementary construction (Carlet, p. 125)
    statement: |-
      Let g:V_r\to\mathbb F_2 and define

      h(x_1,\ldots,x_r,z)
      =z\oplus g(x_1,\ldots,x_{r-1},x_r\oplus z).

      Its Walsh transform is zero when the last two frequency coordinates are
      equal and otherwise is twice the corresponding Walsh coefficient of g.
      Consequently,

      \operatorname{nl}(h)=2\operatorname{nl}(g).

      If g is m-resilient, then h is m-resilient. If additionally
      W_g(a,1)=0 for every a of weight at most m, then h is
      (m+1)-resilient. If \deg(g)\ge1, then \deg(h)=\deg(g).
      The direction supported on the last two coordinates is a nonzero linear
      structure of h.
    formal_status: formalized
    declarations:
      - CryptBoolean.tarannikovPenultimateIndex
      - CryptBoolean.tarannikovLastIndex
      - CryptBoolean.tarannikovShearLinearMap
      - CryptBoolean.tarannikovShearLinearMap_involutive
