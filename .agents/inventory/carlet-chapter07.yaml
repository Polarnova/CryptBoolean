      - CryptBoolean.walshTransform_dobbertinConstruction_ne_zeroFirstBlock
      - CryptBoolean.isBalanced_dobbertinConstruction
    fidelity_note: >-
      The block dimensions and the zero-flat normal form are explicit.
    reuse_note: >-
      The proof reuses the bent zero-flat restriction spectrum and the
      Chapter 2 Walsh transform, adding only the used flat-switching adapter.
    dependencies:
      - carlet-6-def-7-bent
      - carlet-5-def-4-normality
      - carlet-5-flat-indicator-walsh-nonlinearity
      - carlet-2-balanced-zero-walsh

  - id: carlet-7-dobbertin-nonlinearity
    kind: theorem-family
    location: >-
      Nonlinearity consequence of Proposition 33 (Carlet, pp. 121--122)
    statement: |-
      Under the hypotheses of Proposition 33,

      \operatorname{nl}(h)
      \ge \operatorname{nl}(f)+\operatorname{nl}(g)-2^{n/2-1}
      =2^{n-1}-2^{n/2}+\operatorname{nl}(g).

      If n\ge4, this construction cannot produce a positively resilient
      function.
    formal_status: formalized
    declarations:
      - CryptBoolean.maxWalshMagnitude_dobbertinConstruction_le
      - CryptBoolean.nonlinearity_dobbertinConstruction_add_le
      - CryptBoolean.nonlinearity_dobbertinConstruction_lowerBound
      - CryptBoolean.nonlinearity_dobbertinConstruction_boundTerm_eq
      - CryptBoolean.nonlinearity_dobbertinConstruction_lowerBound_source
      - CryptBoolean.not_isResilient_dobbertinConstruction_of_pos
    fidelity_note: >-
      The printed non-resiliency sentence needs n>=4. For n=2 the claimed
      obstruction has a finite counterexample.
    reuse_note: >-
      The lower bound is the triangle inequality applied to Relation (64),
      followed by the bent Walsh magnitude and Relation (35).
    dependencies:
      - carlet-7-prop-33-dobbertin-walsh
      - carlet-4-rel-35-nonlinearity-walsh
      - carlet-6-def-7-bent

  - id: carlet-7-adding-variable
    kind: theorem-family
    location: >-
      Adding a variable (Carlet, Section 7.5.2.I.A, p. 122)
    statement: |-
      If f:V_r\to\mathbb F_2 is t-resilient, then

      h(x,z)=f(x)\oplus z

      is (t+1)-resilient. If f has parameters

      (r,t,r-t-1,\,2^{r-1}-2^{t+1}),

      then h has parameters

      (r+1,t+1,r-t-1,\,2^r-2^{t+2}).

      The last coordinate direction is a nonzero linear structure of h.
    formal_status: formalized
    declarations:
      - CryptBoolean.oneVariableParity
      - CryptBoolean.oneVariableParity_apply
      - CryptBoolean.oneVariableParity_eq_booleanFunctionF₂Encoding
      - CryptBoolean.oneVariableParity_eq_affineFunction
