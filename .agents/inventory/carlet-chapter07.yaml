      - CryptBoolean.tarannikovLinearStructureDirection_ne_zero
      - CryptBoolean.tarannikovShearLinearEquiv_direction
      - CryptBoolean.tarannikovLinearStructureDirection_isNonzeroLinearStructure
    fidelity_note: >-
      The spectral branch condition is retained because it is the common proof
      source for every parameter consequence.
    reuse_note: >-
      This is an invertible linear change followed by adding one affine
      coordinate, so the proof reuses affine invariance, Walsh modulation, and
      the canonical derivative API.
    dependencies:
      - carlet-7-adding-variable
      - carlet-2-affine-invariance
