  - id: carlet-9-carlet-higher-order-bound
    kind: theorem
    location: >-
      Carlet's higher-order extension of Lobanov's bound (Carlet,
      Section 9.1.5, p. 136; exact domain recovered from reference [70],
      Theorem 1)
    statement: |-
      Let f:V_n -> F_2 and let r be a natural number such that

      0<r<AI(f).

      Then

      nl_r(f) >= 2 sum_{i=0}^{AI(f)-r-1} binom(n-r,i).
    formal_status: formalized
    declarations:
      - CryptBoolean.annihilatorSpaceDimension_add_sum_choose_sub_degree_le
      - CryptBoolean.sum_choose_sub_degree_le_hammingWeight_mul
      - CryptBoolean.two_mul_sum_choose_sub_le_higherOrderNonlinearity
    references: [70]
    fidelity_note: >-
      The survey's phrase "in most cases" describes when this valid universal
      inequality improves the earlier elementary bound; it is not a missing
      theorem hypothesis. Reference [70, Definition 1 and Theorem 1] requires
      positive order and AI(f)-r-1>=0, and also gives the survey's mentioned
      stronger max--min refinement. The positive-order hypothesis is necessary
      for the displayed factor-two inequality under the project's total
      order-zero definition.
    reuse_note: >-
      Reuse the higher-order minimizer, algebraic-immunity witnesses, the
      Chapter 9 weight bound, and finite-dimensional annihilator spaces. The
      proof refines the weight split of a closest Reed--Muller word.
