  - id: carlet-9-mesnager-higher-order-bound
    kind: theorem
    location: >-
      Mesnager's higher-order improvement (Carlet, Section 9.1.5, p. 136)
    statement: |-
      Let f:V_n -> F_2, set k=AI(f), and let 0<r<k. Then

      nl_r(f)
        >= sum_{i=0}^{k-r-1} binom(n,i)
         + sum_{i=k-2r}^{k-r-1} binom(n-r,i).

      Binomial coefficients with negative lower index are zero; equivalently,
      the second sum begins at max(0,k-2r).
    formal_status: formalized
    declarations:
      - CryptBoolean.annihilatorSpaceDimension_le_hammingWeight_productMismatch
      - CryptBoolean.annihilatorSpaceDimensions_add_le_hammingWeight_add
      - CryptBoolean.sum_choose_add_degreeBand_le_higherOrderNonlinearity
    references: [277]
    fidelity_note: >-
      The positive-order and r<AI(f) hypotheses are explicit in the cited
      primary theorem. The integer-index convention prevents natural-number
      subtraction from changing the second sum when k<2r.
    reuse_note: >-
      Reuse the Chapter 4 higher-order nonlinearity minimizer and Chapter 9
      weight and perturbation bounds. The refined partition of the closest
      Reed--Muller difference is new.
    dependencies:
      - carlet-9-ai-weight-bounds
      - carlet-9-ai-addition-stability
      - carlet-9-basic-higher-order-nonlinearity-from-ai
      - carlet-4-def-higher-order-nonlinearity
      - carlet-3-reed-muller-code

  - id: carlet-9-optimal-ai-lobanov-corollaries
    kind: corollary-family
    location: >-
      Optimal-immunity specializations of Lobanov's bound (Carlet,
      Section 9.2, p. 137)
    statement: |-
      Let n>0 and let f:V_n -> F_2 have optimal algebraic immunity.

      If n is even and AI(f)=n/2, then

      nl(f) >= 2^(n-1)-2 binom(n-1,n/2-1)
             = 2^(n-1)-binom(n,n/2).

      If n is odd and AI(f)=(n+1)/2, then

      nl(f) >= 2^(n-1)-binom(n-1,(n-1)/2).
    formal_status: formalized
    declarations:
      - CryptBoolean.nonlinearity_lowerBound_of_even_optimalAlgebraicImmunity
      - CryptBoolean.even_optimalAlgebraicImmunity_lowerBound_eq
      - CryptBoolean.centralBinomial_le_nonlinearity_of_even_optimalAlgebraicImmunity
      - CryptBoolean.nonlinearity_lowerBound_of_odd_optimalAlgebraicImmunity
    reuse_note: >-
      These are parity specializations of Lobanov's theorem followed by
      finite binomial-sum and Pascal identities.
    dependencies:
      - carlet-9-lobanov-bound

  - id: carlet-9-majority-parameters
    kind: theorem-family
    location: >-
      Majority function (Carlet, Sections 9.1.4, 9.2, and 9.3,
      pp. 135, 137)
    statement: |-
      Let n>0. Define Maj_n:V_n -> F_2 by

      Maj_n(x)=1 iff 2 w_H(x)>=n,

      equivalently iff w_H(x)>=ceil(n/2). Then Maj_n is symmetric,
      floor(n/2)-normal, and

      AI(Maj_n)=ceil(n/2).

      Its exact nonlinearity is

      nl(Maj_n)=2^(n-1)-binom(n-1,n/2)                 when n is even,

      nl(Maj_n)=2^(n-1)-binom(n-1,(n-1)/2)           when n is odd.
    formal_status: formalized
    declarations:
