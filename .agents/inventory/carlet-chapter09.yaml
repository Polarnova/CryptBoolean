  - id: carlet-9-majority-threshold-variants
    kind: corollary-family
    location: >-
      Majority threshold variants (Carlet, footnote 54, p. 137)
    statement: |-
      Replacing the majority condition w_H(x)>=n/2 by any of

      w_H(x)>n/2,  w_H(x)<=n/2,  or  w_H(x)<n/2

      gives a function affinely equivalent to Maj_n, possibly after adding
      the constant one. Consequently all four threshold variants have the
      same algebraic immunity ceil(n/2).
