  - id: carlet-9-carlet-feng-nonlinearity
    kind: theorem
    location: >-
      Nonlinearity bound following Relation (70) (Carlet, Section 9.3,
      p. 140)
    statement: |-
      Under the hypotheses of Theorem 15,

      nl(f) >= 2^(n-1) - n ln(2) 2^(n/2) - 1.

      The inequality is interpreted after embedding the integer nonlinearity
      in the real numbers.
