  - id: carlet-9-lobanov-bound
    kind: theorem
    location: >-
      Lobanov's tight bound (Carlet, Section 9.1.5, p. 136)
    statement: |-
      Let f:V_n -> F_2. Then

      nl(f) >= 2 sum_{i=0}^{AI(f)-2} binom(n-1,i),

      with the sum equal to zero when AI(f)<2.
    formal_status: formalized
    declarations:
