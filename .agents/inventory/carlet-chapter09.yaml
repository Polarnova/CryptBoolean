scope_note: >-
  The 19 source-facing items below retain the theorem-complete statements from
  Carlet pages 133--140. Ten additional records preserve citation-only
  families, incomplete asymptotic claims, a vectorial almost-bent refinement,
  and empirical fast-algebraic observations under source_recovery. The random
  algebraic-immunity sentence is not promoted because Carlet states it for
  random Boolean functions while the cited primary theorem is for uniformly
  random balanced functions. The Carlet--Feng construction uses n>=2, restored
  from the cited primary theorem: the survey's printed positive-integer domain
  makes the support endpoint and Relation (70) invalid at n=1.
items:
  - id: carlet-9-trace-power-run-bound
    kind: theorem
    location: >-
      Algebraic immunity of monomial functions (Carlet, Section 9.1.2,
      p. 134)
    statement: |-
      Let n>0, let K=GF(2^n), let a in K, and represent the exponent d modulo
      2^n-1 by an n-bit word. Let r(d) be the number of cyclic maximal
      nonempty blocks of consecutive ones in that word. Set

      f(x)=Tr_n(a x^d).

      If r(d)<sqrt(n)/2, then

      AI(f) <= r(d) floor(sqrt(n))
               + ceil(n/floor(sqrt(n))) - 1.
    formal_status: formalized
    declarations:
      - CryptBoolean.binaryWeight_ofBits
      - CryptBoolean.binaryWeight_two_pow_sub_one
      - CryptBoolean.ofBits_eq_sum
      - CryptBoolean.rotateBinaryExponent
      - CryptBoolean.testBit_rotateBinaryExponent
      - CryptBoolean.binaryCyclicExponent
      - CryptBoolean.binaryCyclicExponent_lt
      - CryptBoolean.binaryCyclicExponent_succ_eq_rotate
      - CryptBoolean.binaryWeight_binaryCyclicExponent
      - CryptBoolean.binaryCyclicExponent_pos
      - CryptBoolean.pow_binaryCyclicExponent
      - CryptBoolean.functionAlgebraicDegree_traceMonomial_le_binaryWeight
      - CryptBoolean.tracePowerFunction
      - CryptBoolean.cyclicOneRunCount
      - CryptBoolean.cyclicOneRunCount_binaryCyclicExponent
      - CryptBoolean.cyclicOneRunCount_pos
      - CryptBoolean.traceRunMultiplierPositions
      - CryptBoolean.traceRunMultiplierExponent
      - CryptBoolean.bitIndices_traceRunMultiplierExponent
      - CryptBoolean.testBit_traceRunMultiplierExponent
      - CryptBoolean.traceRunMultiplierExponent_lt_two_pow
      - CryptBoolean.binaryWeight_traceRunMultiplierExponent
      - CryptBoolean.positiveCyclicSum
      - CryptBoolean.pow_positiveCyclicSum
      - CryptBoolean.binaryWeight_positiveCyclicSum_traceRunMultiplier_le
      - CryptBoolean.binaryWeight_traceRunMultiplier_add_binaryCyclicExponent_le
      - CryptBoolean.algebraicImmunity_tracePowerFunction_le_runBound
    references: [282]
    fidelity_note: >-
      The ceiling in the quotient and the floor in its denominator were
      checked against the rendered page and the cited Nawaz--Gong--Gupta
      theorem. Reference [282] explicitly counts cyclic runs, so the first and
      last bit belong to one run when both are one. The exponent residue and
      positive-n domain are explicit so that the run count and quotient are
      total; cyclic shifts within a binary cyclotomic coset preserve r(d).
      The production proof first establishes the stronger carry estimate
      r(d)(floor(sqrt(n))-1)+ceil(n/floor(sqrt(n))) and then derives the
      printed bound for nonzero exponents. The final theorem retains the
      source's real inequality r(d)<sqrt(n)/2, although the multiplier estimate
      itself holds without that restriction.
    reuse_note: >-
      Reuse absolute trace, trace-monomial algebraic degree, univariate binary
      degree, algebraic-immunity witnesses, and the FABL product-degree bound.
      The new mathematics is the run-count arithmetic and the explicit
      low-degree multiplier from the cited proof.
    dependencies:
      - carlet-2-trace-monomial-degree
      - carlet-2-univariate-binary-degree
      - carlet-4-def-annihilator-algebraic-immunity

  - id: carlet-9-prop-38
    kind: proposition
    location: >-
      Proposition 38 (Carlet, Sections 9.1.3, pp. 134--135)
    statement: |-
      Let n be odd and let f:V_n -> F_2 be balanced. If f has no nonzero
      annihilator of algebraic degree at most (n-1)/2, then

      AI(f)=(n+1)/2.

      Equivalently, under balancedness it is enough to exclude low-degree
      annihilators of f; the same exclusion for f+1 follows automatically.
    formal_status: formalized
    declarations:
      - CryptBoolean.algebraicImmunity_eq_ceiling_half_of_odd_balanced_of_no_annihilator
    references: [38]
    reuse_note: >-
      Reuse the Reed--Muller dimension and duality theorems, the annihilator
      evaluation linear map and its finite dimensions, balancedness, and the
      universal ceiling-half upper bound for algebraic immunity. Add a general
      pure coding lemma saying that the complement of an information set in a
      binary self-dual code is again an information set.
    dependencies:
      - carlet-3-reed-muller-code
      - carlet-3-reed-muller-dimension
      - carlet-3-theorem-2
      - carlet-4-annihilator-linear-system
      - carlet-4-ai-upper-bound

  - id: carlet-9-normality-ai-bound
    kind: theorem
    location: >-
      Relationship between normality and algebraic immunity (Carlet,
      Section 9.1.4, p. 135)
    statement: |-
      Let f:V_n -> F_2. If f is k-normal, then

      AI(f) <= n-k.

      More precisely, if f is constantly epsilon on a k-dimensional affine
      flat A, then the indicator of A is a nonzero annihilator of f+epsilon
      and has algebraic degree n-k.
    formal_status: formalized
    declarations:
      - CryptBoolean.algebraicImmunity_le_sub_of_isKNormal
    reuse_note: >-
      This is a direct composition of the existing fixed-k normality
      predicate, affine-flat indicator support and degree theorems, and the
      algebraic-immunity witness API.
    dependencies:
      - carlet-5-def-4-normality
      - carlet-3-prop-12
      - carlet-4-def-annihilator-algebraic-immunity

  - id: carlet-9-ai-does-not-force-normality
    kind: asymptotic-corollary
    location: >-
      Failure of the converse normality implication (Carlet,
      Section 9.1.4, p. 135)
    statement: |-
      Let a>1. As n tends to infinity, the uniform probability that an
      n-variable Boolean function is not floor(a log_2(n))-normal tends to
      one, while every n-variable Boolean function satisfies

      AI(f)<=ceil(n/2).

      In particular, for every a>1 and all sufficiently large n there exists
      f such that

      AI(f)<=n-floor(a log_2(n))

      but f is not floor(a log_2(n))-normal. Thus an algebraic-immunity upper
      bound does not imply the converse normality conclusion.
    formal_status: formalized
    declarations:
      - CryptBoolean.tendsto_carletNonnormalityDimension_div
      - CryptBoolean.eventually_ceilingHalf_le_sub_carletNonnormalityDimension
      - CryptBoolean.eventually_exists_algebraicImmunity_le_sub_not_isKNormal
    references: [65]
    fidelity_note: >-
      The universal algebraic-immunity bound is written with its exact
      ceiling; the survey informally writes n/2. The existential conclusion
      is the precise eventual form of the printed converse failure.
    reuse_note: >-
      Reuse the already formalized random nonnormality limit and universal
      algebraic-immunity upper bound. Only the eventual comparison
      ceil(n/2)<=n-floor(a log_2(n)) is new.
    dependencies:
      - carlet-9-normality-ai-bound
      - carlet-5-random-nonnormality
      - carlet-4-ai-upper-bound

  - id: carlet-9-ai-weight-bounds
    kind: theorem
    location: >-
      Weight bounds from algebraic immunity (Carlet, Section 9.1.5,
      pp. 135--136)
    statement: |-
      Let f:V_n -> F_2 and k=AI(f). Then

      sum_{i=0}^{k-1} binom(n,i)
        <= w_H(f)
        <= sum_{i=0}^{n-k} binom(n,i).

      An empty lower sum is zero. The upper bound is the corresponding lower
      bound for f+1, using AI(f+1)=AI(f) and w_H(f+1)=2^n-w_H(f).
    formal_status: formalized
    declarations:
      - CryptBoolean.algebraicImmunity_add_constant_one
      - CryptBoolean.sum_choose_below_algebraicImmunity_le_hammingWeight
      - CryptBoolean.hammingWeight_le_sum_choose_to_sub_algebraicImmunity
    reuse_note: >-
      Reuse the exact domain and codomain dimensions of the annihilator
      evaluation map and rank--nullity for the lower bound. Reuse the Chapter
      5 complement-weight identity for the upper bound. Prove complement
      invariance of algebraic immunity once for this and later nodes.
    dependencies:
      - carlet-4-def-annihilator-algebraic-immunity
      - carlet-4-annihilator-linear-system
      - carlet-2-def-support-weight
      - carlet-5-quadratic-weight-nonlinearity-values

  - id: carlet-9-optimal-odd-ai-balanced
    kind: corollary
    location: >-
      Consequence of the weight bounds (Carlet, Section 9.1.5, p. 136)
    statement: |-
      Let n be odd and let f:V_n -> F_2. If

      AI(f)=(n+1)/2,

      then f is balanced, equivalently w_H(f)=2^(n-1).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBalanced_of_odd_of_algebraicImmunity_eq_ceiling_half
    reuse_note: >-
      Specialize the preceding two-sided weight bound and close the result by
      the standard half-binomial-sum identity.
    dependencies:
      - carlet-9-ai-weight-bounds
      - carlet-2-def-support-weight

  - id: carlet-9-ai-addition-stability
    kind: theorem
    location: >-
      Low-degree perturbation inequality (Carlet, Section 9.1.5, p. 136)
    statement: |-
      Let f,h:V_n -> F_2 and suppose deg(h)<=r. Then

      AI(f) <= AI(f+h)+r

      and

      AI(f+h) <= AI(f)+r.

      Equivalently, with integer subtraction,

      AI(f)-r <= AI(f+h) <= AI(f)+r.
    formal_status: formalized
    declarations:
      - CryptBoolean.algebraicImmunity_add_le_add_functionAlgebraicDegree
      - CryptBoolean.algebraicImmunity_sub_functionAlgebraicDegree_le_add
    references: [75, 119]
    fidelity_note: >-
      The two addition inequalities are the total natural-number form of the
      printed subtraction inequality and do not hide truncated subtraction.
      Allowing any upper bound r on deg(h) is the monotone generalization of
      the source's choice r=deg(h).
    reuse_note: >-
      Multiply a minimum-degree annihilator by the appropriate low-degree
      perturbation and use FABL.functionAlgebraicDegree_mul_le_add. Apply the
      same argument again because (f+h)+h=f.
    dependencies:
      - carlet-4-def-annihilator-algebraic-immunity
      - carlet-2-def-algebraic-degree

  - id: carlet-9-basic-nonlinearity-from-ai
    kind: theorem
    location: >-
      First-order consequence of low-degree perturbation (Carlet,
      Section 9.1.5, p. 136)
    statement: |-
      Let n>0 and let f:V_n -> F_2. Then

      nl(f) >= sum_{i=0}^{AI(f)-2} binom(n,i),

      with the sum equal to zero when AI(f)<2.
    formal_status: formalized
    declarations:
      - CryptBoolean.sum_choose_below_algebraicImmunity_sub_one_le_nonlinearity
    references: [75, 119]
    reuse_note: >-
      Choose a closest affine function, apply algebraic-immunity stability
      with r=1, and apply the weight lower bound to their sum. Reuse the
      canonical nonlinearity minimizer theorem.
    dependencies:
      - carlet-9-ai-weight-bounds
      - carlet-9-ai-addition-stability
      - carlet-4-def-nonlinearity
      - carlet-3-reed-muller-code

  - id: carlet-9-basic-higher-order-nonlinearity-from-ai
    kind: theorem
    location: >-
      Higher-order consequence of low-degree perturbation (Carlet,
      Section 9.1.5, p. 136)
    statement: |-
      Let f:V_n -> F_2 and let r be a natural number. Then

      nl_r(f) >= sum_{i=0}^{AI(f)-r-1} binom(n,i),

      with the sum equal to zero when AI(f)<=r.
    formal_status: formalized
    declarations:
