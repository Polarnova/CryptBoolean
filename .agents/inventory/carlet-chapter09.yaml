  - id: carlet-9-theorem-15
    kind: theorem
    location: >-
      Theorem 15 (Carlet, Sections 9.3, pp. 138--139; domain restored from
      Carlet--Feng, Theorem 1)
    statement: |-
      Let n>=2, let K=GF(2^n), and let alpha be a primitive element of K.
      Let f:K -> F_2 have support

      {0} union {alpha^i | 0 <= i <= 2^(n-1)-2}.

      Then f is balanced and

      AI(f)=ceil(n/2).
    formal_status: formalized
    declarations:
      - CryptBoolean.carletFengSupport
      - CryptBoolean.carletFengFieldFunction
      - CryptBoolean.carletFengBooleanFunction
      - CryptBoolean.mem_carletFengSupport_iff
      - CryptBoolean.carletFengSupport_card
      - CryptBoolean.support_carletFengBooleanFunction
      - CryptBoolean.isBalanced_carletFengBooleanFunction
      - CryptBoolean.algebraicImmunity_carletFengBooleanFunction
      - CryptBoolean.carletFeng_balanced_and_algebraicImmunity
    references: [80, 149]
    fidelity_note: >-
      The survey prints "any positive integer". The cited Carlet--Feng
      theorem requires n>=2, and n=1 makes the printed endpoint and Relation
      (70) incoherent, so the primary-source domain is restored explicitly.
      The support has exactly 2^(n-1) elements by primitivity of alpha.
    reuse_note: >-
      Reuse the bounded univariate representation, binary exponent weight,
      the univariate binary-degree formula, algebraic-immunity witnesses, and
      finite-field cardinality. Isolate the reusable Vandermonde/BCH
      consecutive-zero support bound from the construction theorem.
    dependencies:
      - carlet-2-univariate-representation
      - carlet-2-univariate-binary-degree
      - carlet-4-def-annihilator-algebraic-immunity
      - carlet-4-ai-upper-bound
