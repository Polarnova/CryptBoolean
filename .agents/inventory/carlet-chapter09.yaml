  - id: carlet-9-rel-70
    kind: theorem
    location: >-
      Relation (70) (Carlet, Sections 9.3, pp. 139--140)
    statement: |-
      Under the hypotheses of Theorem 15, the bounded univariate
      representation of f is

      f(x)=1+sum_{i=1}^{2^n-2}
                 (alpha^i/(1+alpha^i)^(1/2)) x^i,

      where u^(1/2)=u^(2^(n-1)) in GF(2^n).
    formal_status: formalized
    declarations:
      - CryptBoolean.carletFengUnivariateRepresentation
      - CryptBoolean.coeff_carletFengUnivariateRepresentation
      - CryptBoolean.coeff_top_carletFengUnivariateRepresentation
