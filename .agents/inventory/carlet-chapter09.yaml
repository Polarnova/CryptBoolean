source_recovery:
  - id: carlet-9-random-algebraic-immunity
    kind: asymptotic-theorem
    location: >-
      Algebraic immunity of random functions (Carlet, Section 9.1.1,
      p. 134)
    source_claim: |-
      Carlet states that, for every a<1, as n tends to infinity a random
      Boolean function f almost surely satisfies

      AI(f) > n/2-sqrt((n/2) ln(n/(2a ln(2)))).
    statement_status: primary-domain-mismatch
    formal_status: open
    declarations: []
    references: [131]
    first_release_scope: required-after-source-recovery
    recovered_primary_statement: |-
      Didier's cited theorem is for a uniformly random balanced Boolean
      function and requires 0<a<1 for the displayed logarithm. With
      probability tending to one it places AI(f) between the displayed lower
      threshold and (n+1)/2.
    fidelity_note: >-
      Replacing all random Boolean functions by balanced random Boolean
      functions would silently change the source domain. Conversely, the
      survey's all-functions statement needs an independent proof or a
      transfer argument not supplied by the citation.
    reuse_note: >-
      Any formalization should reuse the finite uniform-probability patterns
      from random nonlinearity and random nonnormality and the annihilator
      evaluation linear map.
    blocker: >-
      Reconcile the source/citation sampling domains and recover a complete
      finite probability inequality before promotion.
