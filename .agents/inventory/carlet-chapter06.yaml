  - id: carlet-6-quadratic-trace-families
    kind: construction-family
    location: >-
      Carlet, Section 6.2, pp. 81--82
    source_claim: >-
      In even dimension n with gcd(i,n)=1,
      Tr_n(v x^(2^i+1)) is bent exactly when v is not a cube. Carlet says the
      analogous calculation applies to the Kasami exponent
      2^(2i)-2^i+1. He also gives the quadratic bent function
      Tr_n(sum_(i=1)^(n/2-1) x^(2^i+1)) +
      Tr_(n/2)(x^(2^(n/2)+1)), and, when gcd(n,3)=gcd(i,n)=1, the bent
