  - id: carlet-6-bent-cayley-strongly-regular
    kind: theorem
    location: >-
      Strong regularity of the Boolean Cayley graph (Carlet, p. 78)
    statement: |-
      Let n\ge2 be even, let f:V_n\to\mathbb F_2 be bent with f(0)=0, and
      join distinct x,y\in V_n exactly when f(x+y)=1. If S_f is the support
      of f, the resulting graph is strongly regular with parameters

      \left(2^n,\ |S_f|,\ |S_f|-2^{n-2},\ |S_f|-2^{n-2}\right).
    formal_status: formalized
    declarations:
      - CryptBoolean.booleanCayleyGraph
      - CryptBoolean.booleanCayleyGraph_adj
      - CryptBoolean.card_commonNeighbors_booleanCayleyGraph
      - CryptBoolean.degree_booleanCayleyGraph
      - CryptBoolean.isSRGWith_booleanCayleyGraph_of_isBent
    fidelity_note: >-
      The source's strong-regularity sentence is made precise with the standard f(0)=0 Boolean-Cayley convention and the exact parameters forced by the preceding Hadamard difference-set identity.
    reuse_note: >-
      Common-neighbor counts are identified directly with the existing support difference multiplicity, and the graph itself is Mathlib's additive Cayley graph.
    dependencies:
