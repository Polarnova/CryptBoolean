    source_claim: >-
      For f(x)=Tr_n(a x^i), Carlet lists the known monomial bent
      families up to Frobenius conjugacy: Gold exponents i=2^j+1 when
      n/gcd(j,n) is even, with bentness exactly when a is not an i-th power;
