  - id: carlet-6-codimension-two-restrictions
    kind: theorem
    location: >-
      Codimension-two decomposition consequences (Carlet, p. 97)
    statement: |-
      Let f be bent on V_N, with N even, and let E\le V_N have codimension
      two. The four restrictions of f to the cosets of E, under any fixed
      linear coordinate identification with V_{N-2}, have the same set of
      Walsh magnitudes. If E^\perp=\langle a,b\rangle, all four restrictions
      are bent if and only if D_aD_b\widetilde f is the constant one function.
    formal_status: formalized
    references: [41]
