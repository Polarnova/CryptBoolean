      - CryptBoolean.isModulatedAffineFlatIndicator_of_card_support_mul_card_rawFourierSupport_eq
      - CryptBoolean.card_support_mul_card_rawFourierSupport_eq_two_pow_iff
    fidelity_note: >-
      Because the pseudo-Boolean input is nonzero, the equality-case modulation scalar must be nonzero; the reviewed statement records this necessary condition explicitly.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
