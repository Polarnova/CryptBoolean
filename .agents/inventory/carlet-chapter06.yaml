  - id: carlet-6-lemma-2-walsh-congruence
    kind: lemma
    location: >-
      Lemma 2 (Carlet, p. 77)
    statement: |-
      Let n\ge2 be even. A Boolean function
      f:V_n\to\mathbb F_2 is bent if and only if

      W_f(a)\equiv 2^{n/2}\pmod {2^{n/2+1}}
      \qquad(a\in V_n).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBent_iff_forall_walshTransform_modeq
    fidelity_note: >-
