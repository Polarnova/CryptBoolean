      - CryptBoolean.partialSpreadFunction_zero
      - CryptBoolean.hasExactGPSRepresentation_partialSpreadFunction
      - CryptBoolean.isBent_partialSpreadFunction
    fidelity_note: >-
      The positive nondegenerate half-dimension convention makes the two cardinality cases and exact partial-spread expression total; the dual statement retains the same representation.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
