  - id: carlet-6-prop-16-support-code
    kind: proposition
    location: >-
      Proposition 16 (Carlet, pp. 78--79; corrected dimension range)
    statement: |-
      Let
      n\ge4 be even, let S_f=\{u_1,\ldots,u_w\} be the support of
      f:V_n\to\mathbb F_2, and let

      C_f=\{(v\mathbin\cdot u_1,\ldots,v\mathbin\cdot u_w):v\in V_n\}.

      Then f is bent if and only if \dim C_f=n and the nonzero words of
      C_f have exactly the two weights

      2^{n-2}\quad\text{and}\quad w_H(f)-2^{n-2},

      with both weights occurring.
    formal_status: formalized
    declarations:
      - CryptBoolean.supportCodeMap
      - CryptBoolean.supportCode
      - CryptBoolean.supportCodewordWeight
      - CryptBoolean.supportCodewordWeight_zero
      - CryptBoolean.supportCodewordWeight_eq_card_filter
      - CryptBoolean.codeCharacterSum_support_eq_card_sub_two_weight
      - CryptBoolean.four_mul_supportCodewordWeight_eq
      - CryptBoolean.SupportCodeHasExactlyTwoNonzeroWeights
      - CryptBoolean.isBent_iff_supportCode_finrank_and_two_nonzero_weights
    fidelity_note: >-
      Carlet states positive even dimension, but in dimension two one displayed nonzero weight can be zero. The reviewed node therefore uses n >= 4 and records the exceptional failure explicitly.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
