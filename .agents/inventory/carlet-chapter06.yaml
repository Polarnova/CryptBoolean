  - id: carlet-6-theorem-8-perfect-nonlinearity
    kind: theorem
    location: >-
      Theorem 8 (Carlet, p. 78)
    statement: |-
      A Boolean function f:V_n\to\mathbb F_2
      is bent if and only if every derivative in a nonzero direction is balanced:

      \forall a\in V_n\setminus\{0\},\qquad D_af\text{ is balanced}.

      Equivalently, f satisfies the propagation criterion of degree n.
    formal_status: formalized
    declarations:
      - CryptBoolean.isBent_iff_forall_nonzero_derivative_isBalanced
      - CryptBoolean.isBent_iff_satisfiesPropagationCriterion_dimension
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
