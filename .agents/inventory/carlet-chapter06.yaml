  - id: carlet-6-support-code-alternate-characterizations
    kind: theorem-family
    location: >-
      Carlet, alternatives following Proposition 16, p. 79; corrected by
      four-variable counterexamples
    statement: |-
      For the support code C_f, the following two reported converses are false
      without additional hypotheses absent from the printed statements.

      First, let f_1:V_4\to\mathbb F_2 vanish at (1,0,0,0) and equal one
      elsewhere. Then \dim C_{f_1}=4, its two nonzero weights are 7 and 8,
      and 7+8=w_H(f_1)=15, but f_1 is not bent.

      Second, let f_2(x)=x_2+x_3 on V_4. Then w_H(f_2)=8 is even, the two
      nonzero weights of C_{f_2} are 4 and 8, and 4=2^{4-2}, but f_2 is not
      bent.
    formal_status: formalized
    references: [348]
    declarations:
      - CryptBoolean.finrank_supportCode_eq_n_iff_injective
      - CryptBoolean.SupportCodeHasExactlyTwoNonzeroWeightValues
      - CryptBoolean.HasSupportCodeWeightSumAlternative
      - CryptBoolean.HasSupportCodeEvenLengthQuarterWeightAlternative
      - CryptBoolean.supportCodeWeightSumCounterexample
      - CryptBoolean.supportCodeQuarterWeightCounterexample
      - CryptBoolean.supportCodeWeightSumAlternative_not_characterize_bent
      - CryptBoolean.supportCodeEvenLengthQuarterWeightAlternative_not_characterize_bent
    fidelity_note: >-
      The survey prints both conditions as iff characterizations. Direct finite
      verification in the same support-code model gives counterexamples to both
      converses already in dimension four, so no strengthened theorem is
      substituted. The exact two-nonzero-weight predicate requires distinct
      positive occurring values and ignores the zero word, matching coding-theory
      terminology.
    reuse_note: >-
