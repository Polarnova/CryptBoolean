      - carlet-2-def-walsh-transform
      - carlet-2-fourier-inversion

  - id: carlet-6-rel-44-dual-isometry
    kind: theorem
    location: >-
      Relation (44) (Carlet, p. 79)
    statement: |-
      If f,g:V_n\to\mathbb F_2 are bent,
      then

      W_{\widetilde f+\widetilde g}(0)=W_{f+g}(0).

      Consequently,

      d_H(\widetilde f,\widetilde g)=d_H(f,g),

      so duality preserves pairwise Hamming distance on bent functions.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_zero_bentDual_add
      - CryptBoolean.hammingDistance_bentDual
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-dual
      - carlet-2-rel-22-plancherel
      - carlet-2-def-hamming-distance

  - id: carlet-6-rel-45-dual-derivatives
    kind: theorem
    location: >-
      Relation (45) (Carlet, pp. 79--80)
    statement: |-
      Let f:V_n\to\mathbb F_2 be bent
      and let a,b\in V_n. The function

      g(x)=f(x+b)+a\mathbin\cdot x

      is bent, and its dual is

      \widetilde g(x)=\widetilde f(x+a)+b\mathbin\cdot(x+a).

      Writing \ell_c(x)=c\mathbin\cdot x, one has

      W_{D_a\widetilde f+\ell_b}(0)
      =W_{D_bf+\ell_a}(0).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBent_domainTranslate
      - CryptBoolean.isBent_domainTranslate_add_linear
      - CryptBoolean.bentDual_domainTranslate_add_linear
      - CryptBoolean.walshTransform_zero_bentDual_derivative_add_linear
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
