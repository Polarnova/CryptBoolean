  - id: carlet-6-prop-26-partially-bent
    kind: proposition
    location: >-
      Proposition 26 (Carlet, Relation (53), pp. 103--104)
    statement: |-
      For a Boolean
      function f:V_n\to\mathbb F_2, let

      N_{\Delta_f}=|\{b:\Delta_f(b)\ne0\}|,
      \qquad
      N_{W_f}=|\{u:W_f(u)\ne0\}|.

      Then N_{\Delta_f}N_{W_f}\ge2^n. Equality holds if and only if every
      derivative D_bf is balanced or constant. Equivalently, there are
      complementary subspaces E,E' and functions g,h, with g bent on
      E and h affine on E', such that

      f(x+y)=g(x)+h(y)
      \qquad(x\in E,\ y\in E').

      Such functions are called partially bent. Every quadratic function is
      partially bent, and every partially bent function is plateaued.
    formal_status: formalized
    declarations:
      - CryptBoolean.autocorrelationSupport
      - CryptBoolean.mem_autocorrelationSupport
      - CryptBoolean.nonzeroAutocorrelationCount
      - CryptBoolean.rawFourierSupport_autocorrelation
      - CryptBoolean.two_pow_le_nonzeroAutocorrelationCount_mul_card_walshSupport
