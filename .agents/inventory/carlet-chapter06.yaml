  - id: carlet-6-theorem-9-flat-switching
    kind: theorem
    location: >-
      Theorem 9 (Carlet, pp. 90--91)
    statement: |-
      Let f be bent on V_n, let
      b+E be an affine flat, and put f^*=f+\mathbf1_{b+E}. Then f^* is
      bent if and only if either of the following equivalent conditions holds:

      1. for every a\notin E, the derivative D_af is balanced on b+E;
      2. on every coset of E^\perp, the restriction of
         \widetilde f(x)+b\mathbin\cdot x is constant or balanced.

      If both f and f^* are bent, then \dim E\ge n/2 and the restriction
      of f to b+E has algebraic degree at most
      \dim E-n/2+1. Conversely, if \dim E=n/2 and that restriction is
      affine, then f^* is bent.
    formal_status: formalized
    declarations:
      - CryptBoolean.flatSwitch
      - CryptBoolean.IsBalancedOnAffineFlat
      - CryptBoolean.IsConstantOrBalancedOnAffineFlat
      - CryptBoolean.affineFlatWalshSum
      - CryptBoolean.walshTransform_sub_flatSwitch
      - CryptBoolean.affineFlatWalshSum_eq_bitSignInt_mul_walshTransform_restriction
      - CryptBoolean.affineSubspaceRestrictionImbalance_bentDual_add_linear
      - CryptBoolean.abs_affineSubspaceRestrictionImbalance_bentDual_add_linear
      - CryptBoolean.autocorrelation_flatSwitch
      - CryptBoolean.isBent_flatSwitch_iff_derivative_balanced_on_affineFlat
      - CryptBoolean.isBent_flatSwitch_iff_bentDual_add_linear_constant_or_balanced
