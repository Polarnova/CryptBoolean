  - id: carlet-6-dual
    kind: definition
    location: >-
      Bent dual (Carlet, Section 6.1, p. 79)
    statement: |-
      Let n be even and let
      f:V_n\to\mathbb F_2 be bent. Its dual is the unique Boolean function
      \widetilde f:V_n\to\mathbb F_2 satisfying

      W_f(u)=2^{n/2}(-1)^{\widetilde f(u)}
      \qquad(u\in V_n).

      The function \widetilde f is bent and satisfies

      W_{\widetilde f}(a)=2^{n/2}(-1)^{f(a)},
      \qquad
      \widetilde{\widetilde f}=f.
    formal_status: formalized
    declarations:
      - CryptBoolean.bentDual
      - CryptBoolean.walshTransform_eq_two_pow_half_mul_bitSignInt_bentDual
      - CryptBoolean.realSignView_bentDual
