  - id: carlet-6-def-partial-bent
    kind: definition
    location: >-
      Partial bent functions (Carlet, p. 105)
    statement: |-
      Let n be even. A Boolean
      function f:V_n\to\mathbb F_2 is partial bent if there is an integer
      \lambda such that, on V_n\setminus\{0\}, its raw Fourier transform as
      a \{0,1\}-valued function takes exactly the two values \lambda and
      \lambda+2^{n/2}.
    formal_status: formalized
    declarations:
      - CryptBoolean.HasPartialBentFourierLevels
      - CryptBoolean.IsPartialBent
      - CryptBoolean.partialBentIntegerFourier
      - CryptBoolean.partialBentIntegerFourier_cast
    fidelity_note: >-
      The level is integral because the raw Fourier transform of a zero-one-valued Boolean function is integer-valued; equality of the punctured spectral range records that both displayed values occur.
    reuse_note: >-
      The definition is expressed directly through the canonical raw pseudo-Boolean Fourier transform and remains distinct from the derivative-based IsPartiallyBent predicate.
    dependencies:
      - carlet-2-pseudoboolean-fourier

  - id: carlet-6-partial-bent-duality
    kind: theorem
    location: >-
      Duality for partial bent functions (Carlet, p. 105)
    statement: |-
      Let f be partial
      bent with Fourier levels \lambda and \lambda+2^{n/2}. Define its dual
      at zero by \widetilde f(0)=f(0) and, for every nonzero u, by

      \widetilde f(u)=
      \begin{cases}
      0,&\widehat f(u)=\lambda,\\
      1,&\widehat f(u)=\lambda+2^{n/2}.
      \end{cases}

      Then \widetilde f is partial bent and \widetilde{\widetilde f}=f.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBentDual
      - CryptBoolean.partialBentDual_zero
      - CryptBoolean.exists_partialBentDual_fourierLevels
      - CryptBoolean.partialBentDual_involution
      - CryptBoolean.exists_isPartialBent_partialBentDual_and_involution
    fidelity_note: >-
      Carlet gives the two branches on the punctured frequency space. The statement adopts the formal convention \widetilde f(0)=f(0), verified to make the dual a total Boolean function and the involution claim well-formed.
    reuse_note: >-
      The integral transform adapter composes raw Fourier involution with the punctured spectral branch definition; the resulting dual-level theorem proves both closure and involution without reusing the differently normalized bent dual.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-2-cor-2-fourier-involution

  - id: carlet-6-partial-bent-degree-bound
    kind: theorem
    location: >-
      Counterexample to the printed partial-bent degree bound (Carlet, p. 105)
    statement: |-
      On V_2, let f be the indicator of the point (1,0). Then f is
      partial bent, but

      \deg_{\mathrm{alg}}(f)=2>2/2.

      Thus the printed half-dimension bound requires additional regularity
      hypotheses beyond the exact punctured two-level definition.
    formal_status: formalized
    declarations:
