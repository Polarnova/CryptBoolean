  - id: carlet-6-prop-20-general-maiorana-mcfarland
    kind: proposition
    location: >-
      Proposition 20 (Carlet, Relation (49), pp. 84--85)
    statement: |-
      Let n=r+s be
      even with r\le s, let \varphi:V_s\to V_r, and put

      f_{\varphi,g}(x,y)=x\mathbin\cdot\varphi(y)+g(y).

      For every a\in V_r and b\in V_s,

      W_{f_{\varphi,g}}(a,b)
      =2^r\sum_{y\in\varphi^{-1}(a)}(-1)^{g(y)+b\mathbin\cdot y}.

      If every fiber \varphi^{-1}(a) is an affine subspace of dimension
      s-r and, when r<s, the restriction of g to every fiber is bent,
      then f_{\varphi,g} is bent.
    formal_status: formalized
    declarations:
      - CryptBoolean.maioranaMcFarlandFiberCharacterSum
      - CryptBoolean.walshTransform_maioranaMcFarlandGeneral
      - CryptBoolean.isBent_iff_maioranaMcFarlandFiberCharacterSum_natAbs
