  - id: carlet-6-prop-27-fourier-uncertainty
    kind: proposition
    location: >-
      Proposition 27 (Carlet, pp. 104--105)
    statement: |-
      Let
      \varphi:V_n\to\mathbb R be nonzero, and write

      N_\varphi=|\{x:\varphi(x)\ne0\}|,
      \qquad
      N_{\widehat\varphi}=|\{u:\widehat\varphi(u)\ne0\}|.

      Then N_\varphi N_{\widehat\varphi}\ge2^n. Equality holds if and only if
      there are a nonzero real number \lambda, a frequency u, and an affine
      flat F such that

      \varphi(x)=
      \begin{cases}
      \lambda(-1)^{u\mathbin\cdot x},&x\in F,\\
      0,&x\notin F.
      \end{cases}
    formal_status: formalized
    declarations:
      - CryptBoolean.pseudoBooleanSupport
      - CryptBoolean.mem_pseudoBooleanSupport
      - CryptBoolean.two_pow_le_card_pseudoBooleanSupport_mul_card_rawFourierSupport
