  - id: carlet-6-prop-22-three-function-identity
    kind: proposition
    location: >-
      Proposition 22 (Carlet, Relation (50), pp. 94--95)
    statement: |-
      For Boolean functions
      f_1,f_2,f_3, put

      s_1=f_1+f_2+f_3,
      \qquad
      s_2=f_1f_2+f_1f_3+f_2f_3.

      As integer-valued functions, f_1+f_2+f_3=s_1+2s_2; consequently

      W_{f_1}+W_{f_2}+W_{f_3}=W_{s_1}+2W_{s_2}.
    formal_status: formalized
