      - carlet-6-dual
      - carlet-2-def-algebraic-degree

  - id: carlet-6-prop-19
    kind: proposition
    location: >-
      Proposition 19 (Carlet, Relation (47), p. 83)
    statement: |-
      Let n\ge2 be even, let
      f:V_n\to\mathbb F_2 be bent, and put

      d=\deg_{\mathrm{alg}}(f),
      \qquad
      \widetilde d=\deg_{\mathrm{alg}}(\widetilde f).

      Then

      \frac n2-d
      \ge
      \frac{\frac n2-\widetilde d}{\widetilde d-1}.
    formal_status: formalized
    declarations:
      - CryptBoolean.two_pow_ceilDiv_dvd_booleanCharacterSum_of_degree_le
      - CryptBoolean.bentDual_functionAlgebraicDegree_relation
    fidelity_note: >-
      The positive even-dimension convention makes every displayed degree and denominator meaningful. The complete domains, hypotheses, normalization, and rational inequality match the reviewed source passage.
