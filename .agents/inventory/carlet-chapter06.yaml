  - id: carlet-6-half-degree-anf-complement
    kind: corollary
    location: >-
      Complementary half-degree ANF coefficients (Carlet, p. 81)
    statement: |-
      Let n\ge4,
      let f:V_n\to\mathbb F_2 be bent, and let c_{f,I} denote the coefficient
      of x^I in the ANF of f. For every I\subseteq[n] with |I|=n/2,

      c_{\widetilde f,I}=c_{f,[n]\setminus I},
      \qquad
      c_{f,I}=c_{\widetilde f,[n]\setminus I}.
    formal_status: formalized
    declarations:
      - CryptBoolean.anfCoeff_bentDual_eq_complement_of_card_eq_half
      - CryptBoolean.anfCoeff_eq_bentDual_complement_of_card_eq_half
