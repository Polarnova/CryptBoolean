  - id: carlet-6-hadamard-difference-set-cayley
    kind: characterization-family
    location: >-
      Carlet, Section 6 opening discussion and Section 6.6.3, pp. 78 and 100
    source_claim: >-
      For f : V_n -> F_2, bentness is equivalent to the matrix
      H[x,y] = (-1)^(f(x+y)) being Hadamard and to supp(f) being a difference
      set in the elementary Abelian 2-group V_n. The difference-set condition
      implies that the Boolean Cayley graph G_f is strongly regular. Carlet later
      reports a further characterization of bent functions through Cayley graphs.
    statement_status: mixed-complete-equivalences-and-incomplete-cayley-reference
    formal_status: open
    declarations: []
    references: [18, 134, 202]
    first_release_scope: required-after-source-recovery
    fidelity_note: >-
      The two equivalences are complete in the survey. The strongly regular
      graph sentence omits its parameters, and the later Cayley-graph
      characterization is only a citation. Neither is strengthened to an unstated
      parameter theorem here.
    reuse_note: >-
      The Walsh and derivative characterizations already provide the scalar
      spectral content. Promotion should add explicit Hadamard-matrix,
      difference-set, and strongly-regular-graph layers rather than encode those
      objects as Boolean-function aliases.
    blocker: >-
      The repository has no reviewed design or graph API for these objects, and
      reference [18] must be recovered for the exact Cayley parameters and the
      later iff characterization.
    dependencies:
      - carlet-6-def-7-bent
      - carlet-6-theorem-8-perfect-nonlinearity
      - carlet-2-def-support-weight

