  - id: carlet-6-dual-nnf
    kind: theorem
    location: >-
      Numerical normal form of the dual (Carlet, pp. 79--80)
    statement: |-
      Let
      f:V_n\to\mathbb F_2 be bent, and write its numerical normal form as

      f(x)=\sum_{S\subseteq[n]}\lambda_Sx^S.

      If \delta_0(x) is one at x=0 and zero elsewhere, then

      \widetilde f(x)
      =\frac12-\frac{2^{n/2}}2\,\delta_0(x)
      +\frac{(-1)^{w_H(x)}}{2^{n/2}}
        \sum_{\operatorname{supp}(x)\subseteq S}
          2^{n-|S|}\lambda_S.

      This identity determines the numerical normal form of \widetilde f.
    formal_status: formalized
    declarations:
      - CryptBoolean.booleanRealEmbedding_bentDual_eq_rawFourierTransform
      - CryptBoolean.booleanRealEmbedding_bentDual_eq_numericalCoeff_sum
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-dual
      - carlet-2-nnf-existence-uniqueness
      - carlet-2-rel-30-nnf-fourier

  - id: carlet-6-prop-17-dual-nnf-divisibility
    kind: proposition
    location: >-
      Proposition 17 (Carlet, p. 80)
    statement: |-
      Let f:V_n\to\mathbb F_2 be bent,
      where n is even, and let \lambda_I and \widetilde\lambda_I be the
      integer numerical-normal-form coefficients of f and \widetilde f.
      For every proper subset I\subsetneq[n] with |I|>n/2,

      2^{|I|-n/2}\mid\lambda_I,
      \qquad
      2^{|I|-n/2}\mid\widetilde\lambda_I.
    formal_status: formalized
    declarations:
