      exactly when a is not a cube; i=(2^(n/4)+1)^2 for 4 | n, for which one
      coefficient example is known but the full coefficient set is open; and
      i=2^(n/3)+2^(n/6)+1 for 6 | n, with the displayed relative-trace
      criterion on a. The section also gives
      Tr_(n/2)(x^(2^(n/2)+1)), the necessary coprimality alternative for any
      bent power exponent, and bent restrictions of Kasami functions to the
      trace-zero hyperplane when n+1=3k+1 or 3k-1.
