  - id: carlet-6-prop-31-normal-extension-replacement
    kind: proposition
    location: >-
      Proposition 31 (Carlet, p. 108)
    statement: |-
      Let \beta be bent on U, let
      f be bent on U\times W\times W, and suppose
      \beta\preccurlyeq f through

      f(x,y,0)=\beta(x).

      For any bent \beta':U\to\mathbb F_2, define

      f'(x,y,z)=
      \begin{cases}
      \beta'(x),&z=0,\\
      f(x,y,z),&z\ne0.
      \end{cases}

      Then f' is bent and \beta'\preccurlyeq f'.
    formal_status: formalized
    declarations:
