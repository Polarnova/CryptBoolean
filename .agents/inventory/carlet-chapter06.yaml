  - id: carlet-6-rel-46-dual-poisson
    kind: theorem
    location: >-
      Relation (46) (Carlet, p. 81)
    statement: |-
      Let f:V_n\to\mathbb F_2 be bent, let
      E\le V_n, and let a,b\in V_n. Then

      \sum_{x\in a+E}(-1)^{\widetilde f(x)+b\mathbin\cdot x}
      =2^{-n/2}|E|(-1)^{a\mathbin\cdot b}
       \sum_{x\in b+E^\perp}(-1)^{f(x)+a\mathbin\cdot x}.
    formal_status: formalized
    declarations:
      - CryptBoolean.bentDual_poissonSummationFormula
    fidelity_note: >-
