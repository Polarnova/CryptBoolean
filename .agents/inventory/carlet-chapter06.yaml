    fidelity_note: >-
      This is a formal counterexample to the literal printed assertion under the exact-two-level definition. The singleton indicator on V_2 has punctured levels -1 and 1 but algebraic degree two; the footnote identifying partial bent functions with partial difference sets indicates an omitted nontriviality or regularity convention.
    reuse_note: >-
      The explicit two-variable indicator composes the canonical partial-bent predicate with FABL's top-degree support-parity characterization to certify the strict failure of the printed bound.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-6-prop-18-rothaus-degree-bound

  - id: carlet-6-partial-bent-types
    kind: theorem
    location: >-
      The two types of partial bent functions (Carlet, p. 105)
    statement: |-
      Let n>0 be even, put q=2^{n/2} and e=f(0), and let f be partial
      bent with Fourier levels \lambda and \lambda+q. Exactly one of the
      two identities

      \widehat f(0)-e=-(\lambda-e)(q-1)

      and

      \widehat f(0)-e=(q+\lambda-e)(q+1)

      holds; these alternatives define the two types.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBent_fourier_level_types
    fidelity_note: >-
      This deliberately corrects the printed type formulas. For the punctured spectrum and e=f(0), Parseval gives -(\lambda-e)(q-1) or (q+\lambda-e)(q+1); Carlet's second displayed factor q-\lambda fails even for f(0)=0, while omitting e fails when f(0)=1.
    reuse_note: >-
      Parseval and the integral Fourier adapter reduce the punctured two-level multiplicities to the corrected mutually exclusive integer dichotomy.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-2-parseval

  - id: carlet-6-partial-bent-disjoint-support-sum
    kind: theorem
    location: >-
      Counterexample to the printed partial-bent sum assertion (Carlet, p. 105)
    statement: |-
      On V_2, let f be the indicator of \{(1,0)\} and let g(x)=x_2,
      the indicator of \{(0,1),(1,1)\}. Their punctured Fourier levels are
      \{-1,1\} and \{-2,0\}, respectively. Both functions are partial bent
      of the corrected first type, and

      \operatorname{supp}(f)\cap\operatorname{supp}(g)\subseteq\{0\}.

      Nevertheless, f+g is not partial bent. Hence the printed closure assertion
      also requires an additional regularity convention.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBentSumCounterexampleCompanion
      - CryptBoolean.partialBentCounterexamples_refute_disjoint_support_sum
    fidelity_note: >-
      This is a formal counterexample to the literal printed assertion under the exact-two-level definition. The two functions have disjoint supports and both satisfy the corrected first-type identity, but their sum has only one punctured Fourier level. The partial-difference-set reading therefore needs an omitted regularity convention.
    reuse_note: >-
      The two explicit functions compose the integral Fourier adapter, the corrected first-type identity, exact support computation, and the canonical partial-bent predicate to certify failure of closure.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-6-partial-bent-types
      - carlet-2-pseudoboolean-fourier

  - id: carlet-6-def-plateaued
    kind: definition
    location: >-
      Plateaued functions (Carlet, pp. 105--106)
    statement: |-
      A Boolean function is
      plateaued with amplitude \lambda>0 when every Walsh coefficient belongs
      to \{0,\lambda,-\lambda\}. A plateaued function is bent exactly when
      its Walsh transform has full support. Parseval's identity forces
      \lambda=2^r with 2r\ge n; consequently every Walsh coefficient is
      divisible by 2^{\lceil n/2\rceil}.
    formal_status: formalized
    declarations:
