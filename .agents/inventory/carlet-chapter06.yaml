  - id: carlet-6-hadamard-difference-set-characterizations
    kind: theorem-family
    location: >-
      Carlet, Section 6 opening discussion, p. 78
    statement: |-
      Let n\ge2 be even and let f:V_n\to\mathbb F_2. The matrix

      H_f(x,y)=(-1)^{f(x+y)}

      is Hadamard if and only if f is bent. If S_f is the support of f and

      N_{S_f}(a)=|\{x\in S_f:x+a\in S_f\}|,

      then f is bent if and only if

      |S_f|\ge2^{n-2}\quad\text{and}\quad
      N_{S_f}(a)=|S_f|-2^{n-2}\quad(a\ne0).

      Thus S_f is a Hadamard difference set in the additive group V_n.
    formal_status: formalized
    declarations:
      - CryptBoolean.f₂BitWeight
      - CryptBoolean.hammingNorm_eq_sum_f₂BitWeight
      - CryptBoolean.hammingNorm_add_restrictSupport_identity
      - CryptBoolean.bentSignMatrix
      - CryptBoolean.bentSignMatrix_mul_conjTranspose_apply
      - CryptBoolean.isBent_iff_bentSignMatrix_isHadamard
      - CryptBoolean.differenceMultiplicity
      - CryptBoolean.IsHadamardDifferenceSet
      - CryptBoolean.differenceMultiplicity_support_eq_hammingNorm_restriction
      - CryptBoolean.hammingWeight_booleanDerivative_add_two_mul_differenceMultiplicity
      - CryptBoolean.isBent_iff_support_isHadamardDifferenceSet
    fidelity_note: >-
      The Hadamard-matrix equivalence is proved without extra dimension
      assumptions. The difference-set equivalence retains the source's positive
      even-dimensional domain and states the difference multiplicity and
      parameters explicitly; the lower cardinality bound makes natural-number
      subtraction faithful to the integer parameter formula.
    reuse_note: >-
      The proof composes the existing derivative characterization, the Chapter 4
      autocorrelation identity, and the Chapter 2 Hamming-weight API. The generic
      support-restriction identity is also reused by the existing dimension-seven
      nonlinearity proof.
