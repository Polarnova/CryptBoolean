    source_claim: >-
      For gcd(k,n)=1, n not divisible by 3, and a not a cube,
      the Kasami function
      f(x)=Tr_n(a x^(2^(2k)-2^k+1))
      is bent. For a in GF(4)\GF(2) and k=3, in dimension 10 a constant
      translate f+Tr_n(b) is nonnormal for some b, while in dimension 14 f is
      not weakly normal. Every cubic bent function in eight variables is
      normal.
