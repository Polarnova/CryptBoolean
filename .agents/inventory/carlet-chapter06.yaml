      let K=\operatorname{GF}(2^m) be the quadratic subfield of
      L=\operatorname{GF}(2^{2m}), and let a,\omega\in L\setminus K. If
      i is coprime to 2^{2m}-1, then there is a unique z\in K such that

      a(z+\omega)^i\in K.
