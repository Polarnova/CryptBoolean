  - id: carlet-6-def-8-normal-extension
    kind: definition
    location: >-
      Normal extension (Carlet, Definition 8, pp. 107--108)
    statement: |-
      Let
      \beta:V_k\to\mathbb F_2 and f:V_n\to\mathbb F_2 be bent. Write
      \beta\preccurlyeq f when there are a nonnegative integer m and a
      linear isomorphism

      L:V_k\times V_m\times V_m\longrightarrow V_n

      such that

      f\bigl(L(u,w,0)\bigr)=\beta(u)
      \qquad(u\in V_k,\ w\in V_m).

      Equivalently, V_n=U\oplus W_1\oplus W_2 with
      \dim W_1=\dim W_2, and the restriction of f to
      U\oplus W_1 is \beta pulled back from U. Every bent function is
      a normal extension of itself.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsNormalExtension
      - CryptBoolean.IsNormalExtension.isBent_left
      - CryptBoolean.IsNormalExtension.isBent_right
      - CryptBoolean.isNormalExtension_refl
    fidelity_note: >-
      The coordinate-invariant linear-isomorphism form is equivalent to Carlet's direct decomposition V=U+W_1+W_2 with equal complementary dimensions.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-7-bent

  - id: carlet-6-normal-extension-composition-duality
    kind: theorem
    location: >-
      Composition and duality of normal extensions (Carlet, p. 108)
    statement: |-
      The
      relation \preccurlyeq is transitive. Moreover, if
      \beta\preccurlyeq f, then

      \widetilde\beta\preccurlyeq\widetilde f.

      In standard coordinates, duality exchanges the two equal complementary
      summands.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshAdjointLinearEquiv
