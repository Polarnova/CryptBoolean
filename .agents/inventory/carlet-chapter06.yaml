  - id: carlet-6-def-partial-bent
    kind: definition
    location: >-
      Partial bent functions (Carlet, p. 105)
    statement: |-
      Let n be even. A Boolean
      function f:V_n\to\mathbb F_2 is partial bent if there is an integer
      \lambda such that, on V_n\setminus\{0\}, its raw Fourier transform as
      a \{0,1\}-valued function takes exactly the two values \lambda and
      \lambda+2^{n/2}.
    formal_status: formalized
    declarations:
      - CryptBoolean.HasPartialBentFourierLevels
      - CryptBoolean.IsPartialBent
      - CryptBoolean.partialBentIntegerFourier
      - CryptBoolean.partialBentIntegerFourier_cast
    fidelity_note: >-
      The level is integral because the raw Fourier transform of a zero-one-valued Boolean function is integer-valued; equality of the punctured spectral range records that both displayed values occur.
    reuse_note: >-
      The definition is expressed directly through the canonical raw pseudo-Boolean Fourier transform and remains distinct from the derivative-based IsPartiallyBent predicate.
    dependencies:
      - carlet-2-pseudoboolean-fourier

  - id: carlet-6-partial-bent-duality
    kind: theorem
    location: >-
      Duality for partial bent functions (Carlet, p. 105)
    statement: |-
      Let f be partial
      bent with Fourier levels \lambda and \lambda+2^{n/2}. Define its dual
      at zero by \widetilde f(0)=f(0) and, for every nonzero u, by

      \widetilde f(u)=
      \begin{cases}
      0,&\widehat f(u)=\lambda,\\
      1,&\widehat f(u)=\lambda+2^{n/2}.
      \end{cases}

      Then \widetilde f is partial bent and \widetilde{\widetilde f}=f.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBentDual
      - CryptBoolean.partialBentDual_zero
      - CryptBoolean.exists_partialBentDual_fourierLevels
      - CryptBoolean.partialBentDual_involution
      - CryptBoolean.exists_isPartialBent_partialBentDual_and_involution
    fidelity_note: >-
      Carlet gives the two branches on the punctured frequency space. The statement adopts the formal convention \widetilde f(0)=f(0), verified to make the dual a total Boolean function and the involution claim well-formed.
    reuse_note: >-
      The integral transform adapter composes raw Fourier involution with the punctured spectral branch definition; the resulting dual-level theorem proves both closure and involution without reusing the differently normalized bent dual.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-2-cor-2-fourier-involution

  - id: carlet-6-partial-bent-degree-bound
    kind: theorem
    location: >-
      Counterexample to the printed partial-bent degree bound (Carlet, p. 105)
    statement: |-
      On V_2, let f be the indicator of the point (1,0). Then f is
      partial bent, but

      \deg_{\mathrm{alg}}(f)=2>2/2.

      Thus the printed half-dimension bound requires additional regularity
      hypotheses beyond the exact punctured two-level definition.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBentDegreeCounterexample
      - CryptBoolean.partialBentDegreeCounterexample_refutes_bound
    fidelity_note: >-
      This is a formal counterexample to the literal printed assertion under the exact-two-level definition. The singleton indicator on V_2 has punctured levels -1 and 1 but algebraic degree two; the footnote identifying partial bent functions with partial difference sets indicates an omitted nontriviality or regularity convention.
    reuse_note: >-
      The explicit two-variable indicator composes the canonical partial-bent predicate with FABL's top-degree support-parity characterization to certify the strict failure of the printed bound.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-6-prop-18-rothaus-degree-bound

  - id: carlet-6-partial-bent-types
    kind: theorem
    location: >-
      The two types of partial bent functions (Carlet, p. 105)
    statement: |-
      Let n>0 be even, put q=2^{n/2} and e=f(0), and let f be partial
      bent with Fourier levels \lambda and \lambda+q. Exactly one of the
      two identities

      \widehat f(0)-e=-(\lambda-e)(q-1)

      and

      \widehat f(0)-e=(q+\lambda-e)(q+1)

      holds; these alternatives define the two types.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBent_fourier_level_types
    fidelity_note: >-
      This deliberately corrects the printed type formulas. For the punctured spectrum and e=f(0), Parseval gives -(\lambda-e)(q-1) or (q+\lambda-e)(q+1); Carlet's second displayed factor q-\lambda fails even for f(0)=0, while omitting e fails when f(0)=1.
    reuse_note: >-
      Parseval and the integral Fourier adapter reduce the punctured two-level multiplicities to the corrected mutually exclusive integer dichotomy.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-2-parseval

  - id: carlet-6-partial-bent-disjoint-support-sum
    kind: theorem
    location: >-
      Counterexample to the printed partial-bent sum assertion (Carlet, p. 105)
    statement: |-
      On V_2, let f be the indicator of \{(1,0)\} and let g(x)=x_2,
      the indicator of \{(0,1),(1,1)\}. Their punctured Fourier levels are
      \{-1,1\} and \{-2,0\}, respectively. Both functions are partial bent
      of the corrected first type, and

      \operatorname{supp}(f)\cap\operatorname{supp}(g)\subseteq\{0\}.

      Nevertheless, f+g is not partial bent. Hence the printed closure assertion
      also requires an additional regularity convention.
    formal_status: formalized
    declarations:
      - CryptBoolean.partialBentSumCounterexampleCompanion
      - CryptBoolean.partialBentCounterexamples_refute_disjoint_support_sum
    fidelity_note: >-
      This is a formal counterexample to the literal printed assertion under the exact-two-level definition. The two functions have disjoint supports and both satisfy the corrected first-type identity, but their sum has only one punctured Fourier level. The partial-difference-set reading therefore needs an omitted regularity convention.
    reuse_note: >-
      The two explicit functions compose the integral Fourier adapter, the corrected first-type identity, exact support computation, and the canonical partial-bent predicate to certify failure of closure.
    dependencies:
      - carlet-6-def-partial-bent
      - carlet-6-partial-bent-types
      - carlet-2-pseudoboolean-fourier

  - id: carlet-6-def-plateaued
    kind: definition
    location: >-
      Plateaued functions (Carlet, pp. 105--106)
    statement: |-
      A Boolean function is
      plateaued with amplitude \lambda>0 when every Walsh coefficient belongs
      to \{0,\lambda,-\lambda\}. A plateaued function is bent exactly when
      its Walsh transform has full support. Parseval's identity forces
      \lambda=2^r with 2r\ge n; consequently every Walsh coefficient is
      divisible by 2^{\lceil n/2\rceil}.
    formal_status: formalized
    declarations:
      - CryptBoolean.HasPlateauedWalshAmplitude
      - CryptBoolean.IsPlateaued
      - CryptBoolean.isPlateaued_iff_hasPlateauedWalshSpectrum
      - CryptBoolean.isBent_iff_isPlateaued_and_forall_walshTransform_ne_zero
      - CryptBoolean.card_walshSupport_mul_amplitude_sq_eq_two_pow_two_mul
      - CryptBoolean.exists_plateauedAmplitudeExponent
      - CryptBoolean.two_pow_add_one_div_two_dvd_walshTransform_of_hasPlateauedWalshAmplitude
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-2-def-walsh-transform
      - carlet-2-parseval
      - carlet-6-def-7-bent

  - id: carlet-6-plateaued-support-nonlinearity
    kind: theorem
    location: >-
      Walsh-support bound (Carlet, p. 106)
    statement: |-
      If N_{W_f} is the cardinality
      of the Walsh support of f:V_n\to\mathbb F_2, then

      \operatorname{nl}(f)
      \le 2^{n-1}\left(1-\frac1{\sqrt{N_{W_f}}}\right).

      Equality holds if and only if f is plateaued.
    formal_status: formalized
    declarations:
      - CryptBoolean.maxWalshMagnitude_eq_of_hasPlateauedWalshAmplitude
      - CryptBoolean.sum_walshTransform_sq_walshSupport
      - CryptBoolean.two_pow_sq_le_card_walshSupport_mul_maxWalshMagnitude_sq
      - CryptBoolean.two_pow_sq_eq_card_walshSupport_mul_maxWalshMagnitude_sq_iff_plateaued
      - CryptBoolean.nonlinearity_cast_le_walshSupport_bound
      - CryptBoolean.nonlinearity_cast_eq_walshSupport_bound_iff_plateaued
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-plateaued
      - carlet-4-rel-35-nonlinearity-walsh
      - carlet-2-parseval

  - id: carlet-6-prop-28-second-order-plateaued
    kind: proposition
    location: >-
      Proposition 28 (Carlet, Relation (55), p. 106)
    statement: |-
      A Boolean function
      f:V_n\to\mathbb F_2 is plateaued if and only if there is a positive
      integer \lambda such that, for every x\in V_n,

      \sum_{a,b\in V_n}(-1)^{D_aD_bf(x)}=\lambda^2.

      The integer \lambda is the Walsh amplitude.
    formal_status: formalized
    declarations:
      - CryptBoolean.hasPlateauedWalshAmplitude_iff_forall_walshTransform_cube_eq
      - CryptBoolean.isPlateaued_iff_exists_forall_secondDerivativeDoubleSum_eq_sq
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-plateaued
      - carlet-6-prop-24-second-order-characterization

  - id: carlet-6-plateaued-coset-orphan
    kind: theorem
    location: >-
      Langevin's orphan theorem (Carlet, p. 106)
    statement: |-
      Order the cosets of
      R(1,n) as follows: g+R(1,n) is below f+R(1,n) when there are
      minimum-weight representatives g_1 and f_1 of the respective cosets
      such that \operatorname{supp}(g_1)\subseteq\operatorname{supp}(f_1).
      A maximal coset for this order is called an orphan. If f is plateaued and
      f\notin R(1,n), then f+R(1,n) is an orphan. The non-affine hypothesis
      is necessary: affine functions are plateaued, while R(1,n) is the least
      coset in this order.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsFirstOrderCosetLeader
      - CryptBoolean.FirstOrderCosetBelow
      - CryptBoolean.IsFirstOrderOrphan
      - CryptBoolean.IsPlateaued.add_affineFunction
      - CryptBoolean.eq_of_plateaued_cosetLeaders_of_support_subset
      - CryptBoolean.isFirstOrderOrphan_of_isPlateaued
    fidelity_note: >-
      This deliberately corrects the source's missing non-affine hypothesis: an affine function is plateaued, but its first-order Reed--Muller coset has the empty minimum-weight support and is least rather than maximal.
    reuse_note: >-
      The support order is represented directly on first-order Reed--Muller cosets, and the maximality theorem composes affine invariance, coset-leader normalization, Parseval, and the plateaued Walsh-support identity.
    dependencies:
      - carlet-6-def-plateaued
      - carlet-6-plateaued-support-nonlinearity
      - carlet-3-reed-muller-code
      - carlet-4-def-nonlinearity
      - carlet-2-parseval

  - id: carlet-6-def-8-normal-extension
    kind: definition
    location: >-
      Normal extension (Carlet, Definition 8, pp. 107--108)
    statement: |-
      Let
      \beta:V_k\to\mathbb F_2 and f:V_n\to\mathbb F_2 be bent. Write
      \beta\preccurlyeq f when there are a nonnegative integer m and a
      linear isomorphism

      L:V_k\times V_m\times V_m\longrightarrow V_n

      such that

      f\bigl(L(u,w,0)\bigr)=\beta(u)
      \qquad(u\in V_k,\ w\in V_m).

      Equivalently, V_n=U\oplus W_1\oplus W_2 with
      \dim W_1=\dim W_2, and the restriction of f to
      U\oplus W_1 is \beta pulled back from U. Every bent function is
      a normal extension of itself.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsNormalExtension
      - CryptBoolean.IsNormalExtension.isBent_left
      - CryptBoolean.IsNormalExtension.isBent_right
      - CryptBoolean.isNormalExtension_refl
    fidelity_note: >-
      The coordinate-invariant linear-isomorphism form is equivalent to Carlet's direct decomposition V=U+W_1+W_2 with equal complementary dimensions.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-7-bent

  - id: carlet-6-normal-extension-composition-duality
    kind: theorem
    location: >-
      Composition and duality of normal extensions (Carlet, p. 108)
    statement: |-
      The
      relation \preccurlyeq is transitive. Moreover, if
      \beta\preccurlyeq f, then

      \widetilde\beta\preccurlyeq\widetilde f.

      In standard coordinates, duality exchanges the two equal complementary
      summands.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshAdjointLinearEquiv
      - CryptBoolean.walshTransform_comp_linearEquiv
      - CryptBoolean.bentDual_comp_linearEquiv
      - CryptBoolean.bentDual_canonical_normalExtension
      - CryptBoolean.IsNormalExtension.trans
      - CryptBoolean.IsNormalExtension.bentDual
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-8-normal-extension
      - carlet-6-dual
      - carlet-6-rel-46-dual-poisson

  - id: carlet-6-normal-zero-dimensional-characterization
    kind: theorem
    location: >-
      Zero-dimensional normal extensions (Carlet, p. 108; corrected normality convention)
    statement: |-
      Let f:V_n\to\mathbb F_2 be bent. If normality means that
      f is constant on an n/2-dimensional linear subspace, then

      f\text{ is normal}
      \quad\Longleftrightarrow\quad
      \varepsilon\preccurlyeq f
      \text{ for some }\varepsilon\in\mathbb F_2.

      For the affine-flat convention of Definition 4, the exact statement is
      instead

      f\text{ is }(n/2)\text{-normal}
      \quad\Longleftrightarrow\quad
      \varepsilon\preccurlyeq(f\circ A)

      for some \varepsilon\in\mathbb F_2 and some affine automorphism A
      of V_n.

      The affine automorphism cannot in general be omitted. The two-variable
      function

      f(x_1,x_2)=(x_1+1)(x_2+1)

      is bent and constant on a one-dimensional affine flat, but it is not
      constant on any one-dimensional linear subspace.
    formal_status: formalized
    declarations:
      - CryptBoolean.zeroDimensionalBooleanFunction
      - CryptBoolean.zeroDimensionalBooleanFunction_apply
      - CryptBoolean.isBent_zeroDimensionalBooleanFunction
      - CryptBoolean.IsSubspaceNormal
      - CryptBoolean.IsAffineNormalExtension
      - CryptBoolean.isKNormal_comp_affineEquiv_iff
      - CryptBoolean.exists_isNormalExtension_zeroDimensional_iff_isSubspaceNormal
      - CryptBoolean.exists_isAffineNormalExtension_zeroDimensional_iff_isKNormal
      - CryptBoolean.exists_isKNormal_not_isNormalExtension_zeroDimensional
    fidelity_note: >-
      Carlet's zero-dimensional sentence is exact for constancy on a linear half-dimensional subspace. Under Chapter 5's affine-flat definition of normality an affine automorphism is necessary; the two-variable counterexample records the correction.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-8-normal-extension
      - carlet-5-def-4-normality
      - carlet-2-affine-invariance

  - id: carlet-6-prop-29-direct-sum-normality
    kind: proposition
    location: >-
      Proposition 29 (Carlet, p. 108)
    statement: |-
      Let
      f_i:V_i\to\mathbb F_2 be bent for i=1,2. The direct sum
      f_1\oplus f_2 is normal if and only if there are bent functions
      \beta_i such that \beta_i\preccurlyeq f_i for i=1,2 and either
      \beta_1 is linearly equivalent to \beta_2, or \beta_1 is linearly
      equivalent to \beta_2+1.
    formal_status: formalized
    declarations:
      - CryptBoolean.AreLinearlyEquivalentOrComplementary
      - CryptBoolean.isSubspaceNormal_booleanDirectSum_iff
    fidelity_note: >-
      The statement follows Carlet's linear-subspace normality convention and does not silently replace linear equivalence by affine equivalence.
    reuse_note: >-
      The classification composes the canonical direct-sum construction, normal-extension coordinates, and the affine-flat restriction equality case; the paired linear-equivalence-or-complement relation records precisely the two constant values.
    dependencies:
      - carlet-6-direct-sum
      - carlet-6-def-8-normal-extension
      - carlet-6-normal-zero-dimensional-characterization
      - carlet-5-affine-flat-restriction-bound

  - id: carlet-6-prop-30-normality-descends
    kind: proposition
    location: >-
      Proposition 30 (Carlet, p. 108)
    statement: |-
      If \beta\preccurlyeq f and the bent
      function f is normal, then the bent function \beta is normal.
    formal_status: formalized
    declarations:
      - CryptBoolean.isSubspaceNormal_comp_linearEquiv_iff
      - CryptBoolean.IsNormalExtension.isSubspaceNormal_left
    fidelity_note: >-
      The statement follows Carlet's linear-subspace normality convention and retains descent from a genuine normal extension.
    reuse_note: >-
      The production proof transports normality across a linear equivalence and then descends it through the normal-extension relation.
    dependencies:
      - carlet-6-def-8-normal-extension
      - carlet-6-normal-zero-dimensional-characterization
      - carlet-6-prop-31-normal-extension-replacement
      - carlet-5-affine-flat-restriction-bound

  - id: carlet-6-prop-31-normal-extension-replacement
    kind: proposition
    location: >-
      Proposition 31 (Carlet, p. 108)
    statement: |-
      Let \beta be bent on U, let
      f be bent on U\times W\times W, and suppose
      \beta\preccurlyeq f through

      f(x,y,0)=\beta(x).

      For any bent \beta':U\to\mathbb F_2, define

      f'(x,y,z)=
      \begin{cases}
      \beta'(x),&z=0,\\
      f(x,y,z),&z\ne0.
      \end{cases}

      Then f' is bent and \beta'\preccurlyeq f'.
    formal_status: formalized
    declarations:
      - CryptBoolean.canonicalNormalExtensionReplacement
      - CryptBoolean.canonicalNormalExtensionReplacement_apply_append
      - CryptBoolean.isBent_canonicalNormalExtensionReplacement
      - CryptBoolean.normalExtensionReplacement
      - CryptBoolean.normalExtensionReplacement_apply
      - CryptBoolean.normalExtensionReplacement_isNormalExtension
    fidelity_note: >-
      The coordinate presentation is equivalent to Carlet's direct-sum formulation and preserves both bentness and the normal-extension relation.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-8-normal-extension
      - carlet-6-normal-extension-composition-duality
      - carlet-6-rel-46-dual-poisson

  - id: carlet-6-rel-56-complete-quadratic
    kind: theorem
    location: >-
      Relation (56) (Carlet, pp. 109--110)
    statement: |-
      Define the complete quadratic
      function on V_n by

      q_n(x)=\sum_{1\le i<j\le n}x_ix_j.

      For every x\in V_n, its value is the parity of
      \binom{w_H(x)}2. If n is even, the polar form of q_n has trivial
      radical and q_n is bent.
    formal_status: formalized
    declarations:
      - FABL.completeQuadraticBit
      - CryptBoolean.functionAlgebraicDegree_completeQuadraticBit_le_two
      - CryptBoolean.completeQuadraticBit_eq_choose_support_card
      - CryptBoolean.completeQuadraticPolarFrequency
      - CryptBoolean.quadraticPolarKernel_completeQuadraticBit_eq_crossSum
      - CryptBoolean.quadraticPolarKernel_completeQuadraticBit_eq_dotProduct
      - CryptBoolean.completeQuadraticPolarFrequency_eq_zero_of_even
      - CryptBoolean.quadraticRadical_completeQuadraticBit_eq_bot
      - CryptBoolean.isBent_completeQuadraticBit
      - CryptBoolean.completeQuadraticBit_zero_dimension
      - CryptBoolean.isBent_completeQuadraticBit_zero_dimension
      - CryptBoolean.completeQuadraticBit_two_dimension
      - CryptBoolean.isBent_completeQuadraticBit_two_dimension
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-quadratic-bent-characterization
      - carlet-2-def-support-weight

  - id: carlet-6-kerdock-parameters
    kind: theorem
    location: >-
      Kerdock parameters (Carlet, pp. 109--110)
    statement: |-
      Let n\ge2 be even and
      let F be a family of 2^{n-1} Boolean functions on V_n containing
      zero. Suppose that every nonzero member of F has algebraic degree two
      and that f+g is bent whenever f,g\in F are distinct. Then

      K(F)=\bigcup_{f\in F}\bigl(f+R(1,n)\bigr)

      contains R(1,n), is contained in R(2,n), has 2^{2n} words, and
      has minimum distance
      2^{n-1}-2^{n/2-1}. The first-order Reed--Muller cosets in this union
      are pairwise distinct.
    formal_status: formalized
    declarations:
      - CryptBoolean.IsKerdockRepresentativeFamily
      - CryptBoolean.kerdockCodeOfRepresentatives
      - CryptBoolean.functionAlgebraicDegree_le_two_of_mem_kerdockRepresentatives
      - CryptBoolean.reedMuller_one_subset_kerdockCodeOfRepresentatives
      - CryptBoolean.kerdockCodeOfRepresentatives_subset_reedMuller_two
      - CryptBoolean.nonlinearity_add_eq_kerdockDistance_of_mem
      - CryptBoolean.hasDistinctFirstOrderCosets_of_isKerdockRepresentativeFamily
      - CryptBoolean.kerdockRepresentativeFamily_offDiag_nonempty
      - CryptBoolean.card_kerdockCodeOfRepresentatives
      - CryptBoolean.minimumPairNonlinearity_eq_kerdockDistance
      - CryptBoolean.minimumHammingDistance_kerdockCodeOfRepresentatives
      - CryptBoolean.kerdockCodeOfRepresentatives_parameters
    fidelity_note: >-
      This is a conditional reduction: a representative family F is an input hypothesis. It proves the code parameters from that hypothesis and does not assert that such a family exists; existence belongs only to the separate field-construction node.
    reuse_note: >-
      The proof composes bent pairwise differences with the existing Reed--Muller code and coset-distance results while leaving representative-family construction external.
    dependencies:
      - carlet-6-def-7-bent
      - carlet-3-reed-muller-code
      - carlet-4-reed-muller-coset-distance

  - id: carlet-6-kerdock-field-trace-identity
    kind: theorem
    location: >-
      Self-dual normal-basis trace identity (Carlet, pp. 109--110)
    statement: |-
      Let
      m=2t+1 and identify V_m with \mathbb F_{2^m} through a self-dual
      normal basis. Explicitly, assume that the coordinate equivalence
      intertwines Frobenius squaring with cyclic rotation, identifies the
      absolute trace with the coordinate sum, and identifies the trace pairing
      with the standard binary dot product. Under the induced identification
      V_{m+1}\simeq\mathbb F_{2^m}\times\mathbb F_2, the complete quadratic
      function of Relation (56) is

      q(x,z)=\operatorname{Tr}_m\!\left(\sum_{j=1}^{t}x^{2^j+1}\right)
            +z\operatorname{Tr}_m(x).
    formal_status: formalized
    declarations:
      - CryptBoolean.completeQuadraticBit_eq_kerdockFieldRepresentative_one_of_selfDualNormalCoordinates
    fidelity_note: >-
      The formal theorem unpacks the self-dual normal-basis condition into its
      cyclic Frobenius, coordinate-trace, and self-dual trace-pairing equations;
      under these explicit hypotheses its domain and conclusion match Carlet's
      conditional coordinate identity.
    reuse_note: >-
      The proof composes the canonical complete quadratic polar form, the
      finite-field Kerdock trace quadratic, and the existing affine-difference
      criterion without introducing a second normalization.
    dependencies:
      - carlet-6-rel-56-complete-quadratic
      - carlet-2-absolute-trace
      - carlet-6-kerdock-field-construction

  - id: carlet-6-kerdock-field-construction
    kind: theorem
    location: >-
      Finite-field construction of the Kerdock code (Carlet, pp. 109--110)
    statement: |-
      Let m=2t+1, set n=m+1, and define

      q(x,z)=\operatorname{Tr}_m\!\left(\sum_{j=1}^{t}x^{2^j+1}\right)
            +z\operatorname{Tr}_m(x)

      on \mathbb F_{2^m}\times\mathbb F_2. For
      u\in\mathbb F_{2^m}, set q_u(x,z)=q(ux,z) and transport these
      functions to V_n along an \mathbb F_2-linear coordinate
      identification. The representative q_0 is zero, every q_u with
      u\ne0 has algebraic degree two, and q_u+q_v is bent whenever
      u\ne v. Thus the 2^m representatives form a Kerdock representative
      family. Consequently the union of the cosets q_u+R(1,n) is a Kerdock
      code with 2^{2n} words and minimum distance
      2^{n-1}-2^{n/2-1}.
    formal_status: formalized
    declarations:
      - CryptBoolean.kerdockTraceQuadratic
      - CryptBoolean.kerdockFieldQuadratic
      - CryptBoolean.absoluteTrace_algebraMap_odd
      - CryptBoolean.kerdockTraceCube
      - CryptBoolean.kerdockTraceLinearCube
      - CryptBoolean.functionAlgebraicDegree_kerdockTraceCube_le_two
      - CryptBoolean.functionAlgebraicDegree_kerdockTraceLinearCube_le_one
      - CryptBoolean.kerdockFieldCoordinateEquiv
      - CryptBoolean.kerdockFieldRepresentative
      - CryptBoolean.kerdockFieldRepresentative_coordinate
      - CryptBoolean.kerdockFieldRepresentative_zero
      - CryptBoolean.functionAlgebraicDegree_kerdockFieldRepresentative_le_two
      - CryptBoolean.quadraticPolarKernel_kerdockFieldRepresentative
      - CryptBoolean.quadraticPolarKernel_kerdockFieldRepresentative_add
      - CryptBoolean.eq_zero_of_forall_quadraticPolarKernel_kerdockFieldRepresentative_add
      - CryptBoolean.isBent_kerdockFieldRepresentative_add
      - CryptBoolean.functionAlgebraicDegree_kerdockFieldRepresentative_eq_two
      - CryptBoolean.kerdockFieldRepresentative_injective
      - CryptBoolean.kerdockFieldRepresentativeFamily
      - CryptBoolean.card_kerdockFieldRepresentativeFamily
      - CryptBoolean.isKerdockRepresentativeFamily_kerdockField
      - CryptBoolean.kerdockFieldConstruction_parameters
    fidelity_note: >-
      The construction defines Carlet's footnote-44 trace formula directly and transports it through an arbitrary binary linear coordinate equivalence. The separate self-dual-normal-basis identity remains open, and the conditional parameter theorem is used only after the representative family has been constructed.
    reuse_note: >-
      The proof composes absolute-trace algebra, the quadratic polar-form criterion, trace-pairing coordinates, and the conditional Kerdock parameter reduction without postulating a representative family.
    dependencies:
      - carlet-5-quadratic-trace-representation
      - carlet-6-quadratic-bent-characterization
      - carlet-6-kerdock-parameters
      - carlet-2-absolute-trace
      - carlet-2-trace-pairing-coordinates

