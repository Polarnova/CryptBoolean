  - id: carlet-6-reference-101-hyper-bent-family
    kind: theorem
    location: >-
      Carlet, trace family from reference [101], p. 103
    source_claim: >-
      Let n be even, lambda in GF(2^(n/2))^*, and
      0<r<n/2. Assume that the binary cyclotomic cosets modulo 2^(n/2)+1
      containing 2^r-1 and 2^r+1 both have size n, and that
      Tr_(n/2)(lambda x^(2^r+1)) is balanced on GF(2^(n/2)). Then
      Tr_n(lambda (x^((2^r-1)(2^(n/2)-1)) +
                   x^((2^r+1)(2^(n/2)-1))))
      is bent, equivalently hyper-bent, if and only if
      Tr_(n/2)(x^(-1)+lambda x^(2^r+1))
      is balanced on GF(2^(n/2)).
    statement_status: complete-source-statement
    formal_status: open
    declarations: []
    references: [101]
    first_release_scope: required-after-source-recovery
    fidelity_note: >-
      The hypotheses, both exponents, the nonzero coefficient, and the iff
      balance condition are retained. Bent and hyper-bent are equivalent only
      for this family as stated by Carlet; no general equivalence is inferred.
    reuse_note: >-
      Promotion should reuse the field hyper-bent transform and balance
      predicate, with a separate cyclotomic-coset size interface.
    blocker: >-
      The repository lacks cyclotomic-coset cardinality and inverse-power
      character-sum declarations needed for this equivalence.
    dependencies:
      - carlet-6-def-hyper-bent
      - carlet-2-absolute-trace
      - carlet-2-balanced-zero-walsh

