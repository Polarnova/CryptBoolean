      - carlet-2-cor-1-poisson-summation

  - id: carlet-6-quadratic-bent-characterization
    kind: theorem
    location: >-
      Quadratic bent functions (Carlet, Section 6.2, pp. 80--81)
    statement: |-
      Let n\ge2
      be even and let f:V_n\to\mathbb F_2 have algebraic degree at most two. The
      following conditions are equivalent:

      1. f is bent;
      2. w_H(f)=2^{n-1}\pm2^{n/2-1};
      3. the alternating polar form

      \phi_f(x,y)=f(0)+f(x)+f(y)+f(x+y)

         is nondegenerate, equivalently the linear kernel of f is \{0\};
      4. the symmetric zero-diagonal coefficient matrix of the quadratic part of
         f is nonsingular;
      5. after an invertible affine change of variables, f has the form

      x_1x_2+x_3x_4+\cdots+x_{n-1}x_n+\varepsilon
      \qquad(\varepsilon\in\mathbb F_2).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBent_iff_quadraticRadical_eq_bot
      - CryptBoolean.isBent_iff_linearKernel_eq_bot_of_degree_le_two
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
      The associated declarations compose the canonical statements listed under dependencies and introduce no parallel definition or normalization.
    dependencies:
      - carlet-6-def-7-bent
      - carlet-5-def-quadratic-symplectic-form
      - carlet-5-theorem-5
      - carlet-5-quadratic-weight-nonlinearity-values

  - id: carlet-6-prop-18-rothaus-degree-bound
    kind: proposition
    location: >-
      Proposition 18: Rothaus' bound (Carlet, p. 83)
    statement: |-
      Let n\ge4 be even.
      Every bent function f:V_n\to\mathbb F_2 satisfies

      \deg_{\mathrm{alg}}(f)\le n/2,
      \qquad
      \deg_{\mathrm{alg}}(\widetilde f)\le n/2.

      In dimension n=2, every bent function, and hence its dual, has algebraic
      degree exactly two.
    formal_status: formalized
    declarations:
      - CryptBoolean.functionAlgebraicDegree_le_half_of_isBent
      - CryptBoolean.functionAlgebraicDegree_eq_two_of_isBent
    fidelity_note: >-
      The complete domains, hypotheses, normalization, and conclusion match the reviewed source passage.
    reuse_note: >-
