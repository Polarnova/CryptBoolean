scope_note: >-
  The 14 source-facing items below retain the theorem-complete statements from
  Carlet pages 131--133. The five records under source_recovery preserve
  citation-only maximum-correlation, construction, and ANF families whose
  formulas or parameter ranges are not complete in the survey. The even
