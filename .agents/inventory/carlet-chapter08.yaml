  - id: carlet-8-order-k-maiorana-code-constructions
    kind: construction-family
    location: >-
      Maiorana--McFarland constructions for PC(l) of order k (Carlet,
      Section 8.2, p. 133)
    source_claim: |-
      Carlet reports a linear-code construction [221] and nonlinear-code
      generalizations [59,60]. Reference [59], Corollary 9, gives the recovered
      sufficient condition for

      f(x,y)=x\cdot\phi(y)\oplus g(y):

      every sum of between one and l coordinate functions of \phi is
      k-resilient, and

      w_H(\phi(y)\oplus\phi(y\oplus b))\ge k+1

      for every y and every nonzero b with w_H(b)\le l. Under these conditions
      f satisfies PC(l) of order k.
    statement_status: primary-condition-recovered-code-families-incomplete
    formal_status: open
    declarations: []
    references: [59, 60, 221]
    first_release_scope: required-after-source-recovery
    fidelity_note: >-
      The recovered sufficient condition is theorem-complete, but the survey's
      advertised linear- and nonlinear-code constructions require additional
      generator, systematic-code, minimum-distance, and dual-distance data not
      present on page 133.
    reuse_note: >-
      Promote the recovered condition by reusing the Chapter 7 general
      Maiorana--McFarland map and canonical resiliency predicate. Add a code
      layer only when the primary construction theorems require it.
    blocker: >-
      Recover the exact code constructions and their parameter-existence
