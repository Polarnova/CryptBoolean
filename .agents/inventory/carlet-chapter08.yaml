      - CryptBoolean.satisfiesPropagationCriterion_of_hasOddPredTwoBentNormalForm
      - CryptBoolean.satisfiesPropagationCriterion_pred_two_iff_hasOddPredTwoBentNormalForm
    references: [60]
    fidelity_note: >-
      The three coordinate alternatives are the explicit forms (1)--(3) in
