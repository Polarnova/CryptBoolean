  residual-dimension hypotheses needed to avoid the two-variable quadratic
  counterexample. Proposition 37 uses disjoint supports of the complements of
  its high-weight indexing vectors, as required by Proposition 36.
items:
  - id: carlet-8-even-pc-pred-two-bent
    kind: theorem
    location: >-
      Extremal even-dimensional propagation criterion (Carlet, Section 8.1,
      p. 131)
    statement: |-
      Let n be even with n\ge4 and let f:V_n\to\mathbb F_2. If f satisfies
      PC(n-2), then f satisfies PC(n). Equivalently,

      f\text{ satisfies }PC(n-2)
      \quad\Longleftrightarrow\quad
      f\text{ is bent}.

      Consequently, no balanced n-variable function satisfies PC(n-2).
    formal_status: formalized
    declarations:
      - CryptBoolean.isBent_of_satisfiesPropagationCriterion_pred_two_of_even
      - CryptBoolean.satisfiesPropagationCriterion_pred_two_iff_isBent_of_even
      - CryptBoolean.satisfiesPropagationCriterion_dimension_of_pred_two_of_even
      - CryptBoolean.not_satisfiesPropagationCriterion_pred_two_of_even_of_isBalanced
    fidelity_note: >-
      Carlet prints the assertion for even n without a lower bound. The
      condition n\ge4 is necessary: at n=2, PC(n-2)=PC(0) is vacuous and does
      not imply bentness. The n=4 endpoint is valid; the cited primary paper
      states the result only for n>4.
    reuse_note: >-
      Reuse the canonical propagation predicate and the Chapter 6 equivalence
      between bentness and balancedness of every nonzero derivative.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-6-theorem-8-perfect-nonlinearity

  - id: carlet-8-odd-pc-pred-one-classification
    kind: classification
    location: >-
      Odd-dimensional PC(n-1) classification (Carlet, Section 8.1, p. 131)
    statement: |-
      Let n\ge3 be odd and let f:V_n\to\mathbb F_2. Then f satisfies PC(n-1)
      if and only if there exist a bent function
      g:V_{n-1}\to\mathbb F_2 and an affine function
      \ell:V_n\to\mathbb F_2 such that

      f(x_1,\ldots,x_n)
      =g(x_1\oplus x_n,\ldots,x_{n-1}\oplus x_n)
       \oplus\ell(x_1,\ldots,x_n).
    formal_status: formalized
    declarations:
      - CryptBoolean.oddDiagonalProjection
      - CryptBoolean.oddDiagonalBentLift
      - CryptBoolean.HasOddDiagonalBentNormalForm
      - CryptBoolean.satisfiesPropagationCriterion_pred_one_iff_hasOddDiagonalBentNormalForm
    fidelity_note: >-
      The odd-dimensional domain, the n\ge3 endpoint, all n-1 arguments of g,
      and the arbitrary affine summand are exactly the reviewed survey
      statement. Bentness is on the even-dimensional space V_{n-1}.
    reuse_note: >-
      Express the displayed coordinate map as a linear map, then reuse bent
      derivative balance and affine-addition invariance rather than introducing
      a second propagation or bentness predicate.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-6-def-7-bent
      - carlet-2-def-affine-functions

  - id: carlet-8-odd-pc-pred-two-classification
    kind: classification
    location: >-
      Odd-dimensional PC(n-2) classification (Carlet, Section 8.1, p. 131;
      equivalent form in reference [60], Proposition 1)
    statement: |-
      Let n\ge3 be odd and let f:V_n\to\mathbb F_2. Then f satisfies PC(n-2)
      if and only if there exist a bent function
      g:V_{n-1}\to\mathbb F_2, an affine function
      \ell:V_n\to\mathbb F_2, and coordinates y_1,\ldots,y_{n-1} of one of
      the following forms:

      * y_j=x_j\oplus x_n for every j;
      * for one index i, y_i=x_i and y_j=x_j\oplus x_n for j\ne i;
      * y_j=x_j\oplus x_{n-1} for 1\le j\le n-2, and y_{n-1}=x_n;

      such that f(x)=g(y_1,\ldots,y_{n-1})\oplus\ell(x).

      Equivalently, there is a nonzero a\in V_n with w_H(a)\ge n-1 such that
      D_af is constant, while D_bf is balanced for every nonzero b\ne a.
      Thus f has exactly one nonzero linear structure, of weight n-1 or n.
    formal_status: formalized
    declarations:
      - CryptBoolean.coordinateDirection
      - CryptBoolean.HasUniqueHighWeightLinearStructure
      - CryptBoolean.satisfiesPropagationCriterion_pred_two_iff_hasUniqueHighWeightLinearStructure
