source_recovery:
  - id: carlet-8-maximum-correlation-bound
    kind: theorem-family
    location: >-
      Maximum-correlation consequence (Carlet, Section 8.1, p. 131)
    source_claim: >-
      Carlet reports that maximum-correlation bounds for PC(l) functions, in
      particular bent functions, follow directly from Relations (40) and (27).
      Reference [37] gives the special consequence that if f satisfies PC(t)
      and a comparison function depends on k coordinates with k\ge n-t, then
      their distance is at least
      2^{n-1}-2^{(n+k)/2-1}, equivalently the corresponding normalized maximum
      correlation is at most 2^{(k-n)/2}.
    statement_status: survey-incomplete-primary-specialization-recovered
    formal_status: open
    declarations: []
    references: [37]
    first_release_scope: required-after-source-recovery
    fidelity_note: >-
      The survey displays no formula or quantification over coordinate sets.
      The cited primary paper supplies the stated special bound and a more
      general derivative-nonlinearity theorem; the exact general theorem must
      be inventoried before deciding which result Carlet intended here.
    reuse_note: >-
      Any promoted form should compose Relation (40) with the propagating-
      subspace Walsh-square estimate, using the existing maximum-correlation
      and distance-to-coordinate-functions normalizations.
    blocker: >-
      Recover and review the complete primary theorem, including its general
      derivative parameter and all coordinate-cardinality ranges.
    dependencies:
      - carlet-4-rel-40-maximum-correlation-bound
      - carlet-8-propagating-subspace-nonlinearity-bound

