  - id: carlet-8-pc-algebraic-degree-bound
    kind: theorem
    location: >-
      Algebraic-degree bound for propagation criteria (Carlet, Section 8.1,
      p. 131)
    statement: |-
      Let n\ge3, let 1\le l<n, and let f:V_n\to\mathbb F_2. If f satisfies
      PC(l), then

      \deg(f)\le n-1.
    formal_status: formalized
    declarations:
      - CryptBoolean.differenceMultiplicity_even
      - CryptBoolean.functionAlgebraicDegree_le_pred_of_satisfiesPropagationCriterion
    fidelity_note: >-
      The survey calls n-1 the only known general upper bound. Its surrounding
      section assumes l<n and a nontrivial propagation criterion. The explicit
      n\ge3 condition is necessary: the two-variable function x_1x_2 satisfies
      PC(1) but has degree 2.
    reuse_note: >-
      Reuse FABL's canonical ANF algebraic degree and the existing PC
      derivative-balance predicate; no Fourier-degree notion is involved.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-2-def-algebraic-degree

  - id: carlet-8-propagating-subspace-nonlinearity-bound
    kind: theorem-family
    location: >-
      Nonlinearity bound from a propagating subspace (Carlet, Section 8.1,
      p. 131)
    statement: |-
      Let F\le V_n have dimension l, and let f:V_n\to\mathbb F_2. Assume that
      D_af is balanced for every nonzero a\in F. Then, for every u\in V_n,

      W_f(u)^2\le 2^{2n-l},

      and hence, with the second exponent interpreted over the reals,

      \operatorname{nl}(f)
      \ge 2^{n-1}-2^{n-l/2-1}.

      In particular, if 0\le l\le n and f satisfies PC(l), then the same
      nonlinearity bound holds.
    formal_status: formalized
    declarations:
      - CryptBoolean.walshTransform_sq_le_of_balanced_derivatives_on_subspace
      - CryptBoolean.nonlinearity_lowerBound_of_balanced_derivatives_on_subspace
      - CryptBoolean.walshTransform_sq_le_of_satisfiesPropagationCriterion
      - CryptBoolean.nonlinearity_lowerBound_of_satisfiesPropagationCriterion
    references: [355]
    fidelity_note: >-
      The raw integer Walsh-square bound is recorded before the real square-root
      form, so odd l introduces no hidden integer exponent or rounding. The
      PC(l) corollary uses an l-dimensional coordinate subspace, every nonzero
      vector of which has weight at most l.
    reuse_note: >-
      Specialize raw Poisson summation and Wiener--Khintchine to F^\perp, then
      compose the resulting Walsh bound with Relation (35). Existing subspace,
      autocorrelation, and raw-Walsh APIs suffice.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-2-cor-1-poisson-summation
      - carlet-2-rel-25-wiener-khinchin
      - carlet-4-rel-35-nonlinearity-walsh

  - id: carlet-8-propagation-bound-equality-parameters
    kind: theorem
    location: >-
      Equality restriction for the propagation nonlinearity bound (Carlet,
      Section 8.1, p. 131)
    statement: |-
      Let 1\le l\le n and let f:V_n\to\mathbb F_2 satisfy PC(l). If

      \operatorname{nl}(f)=2^{n-1}-2^{n-l/2-1},

      then either n is odd and l=n-1, or n is even and l=n.
    formal_status: formalized
    declarations:
      - CryptBoolean.propagationCriterion_nonlinearity_equality_parameters
    fidelity_note: >-
      This is only a necessary restriction on equality cases, exactly as the
      phrase “equality can occur only if” states; it does not assert existence
      at either endpoint. The exponent retains the real square-root
      normalization of the preceding item.
    reuse_note: >-
      Reuse the propagating-subspace bound, Parseval, and the perfect-
      nonlinearity characterization to isolate the only possible parity
      endpoints.
    dependencies:
      - carlet-8-propagating-subspace-nonlinearity-bound
      - carlet-2-parseval
      - carlet-6-theorem-8-perfect-nonlinearity

  - id: carlet-8-walsh-square-pc-characterization
    kind: characterization
    location: >-
      Wiener--Khintchine characterization (Carlet, Section 8.1.1, p. 131)
    statement: |-
      Let 0\le l\le n and let f:V_n\to\mathbb F_2. Then f satisfies PC(l)
      if and only if, for every nonzero a\in V_n with w_H(a)\le l,

      \sum_{u\in V_n}(-1)^{a\cdot u}W_f(u)^2=0.
    formal_status: formalized
    declarations:
      - CryptBoolean.sum_vectorWalshCharacter_mul_walshTransform_sq
      - CryptBoolean.satisfiesPropagationCriterion_iff_sum_vectorWalshCharacter_mul_walshTransform_sq_eq_zero
    fidelity_note: >-
      The statement uses Carlet's unnormalized integer Walsh transform. The
      missing factor 2^n in Fourier inversion is harmless only because the
      asserted value is zero; no normalized FABL coefficient is silently
      substituted.
    reuse_note: >-
      Compose the canonical PC/autocorrelation equivalence with Relation (25)
      and raw Fourier involution.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-2-rel-25-wiener-khinchin
      - carlet-2-balanced-zero-walsh

  - id: carlet-8-prop-35-affine-flat-walsh-square-characterization
    kind: proposition
    location: >-
      Proposition 35 (Carlet, pp. 131--132)
    statement: |-
      Let 0\le l\le n and let f:V_n\to\mathbb F_2. Write w\preceq u when
      \operatorname{supp}(w)\subseteq\operatorname{supp}(u). Then f satisfies
      PC(l) if and only if, for every u,v\in V_n with w_H(u)\ge n-l,

      \sum_{w\preceq u}W_f(w\oplus v)^2
      =2^{n+w_H(u)}.
    formal_status: formalized
    declarations:
      - CryptBoolean.predecessorWalshSquareSum
      - CryptBoolean.predecessorWalshSquareSum_eq_autocorrelationSum
      - CryptBoolean.satisfiesPropagationCriterion_iff_predecessorWalshSquareSum
    references: [60]
    fidelity_note: >-
      The sum is over support inclusion w\preceq u, not a complement relation,
      and includes every affine shift v. The right side and every transform use
      the raw Walsh normalization printed in Proposition 35.
    reuse_note: >-
      Derive the equivalence from Relation (27) using the existing raw Poisson,
      autocorrelation, support, and coordinate-subspace APIs.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-2-cor-1-poisson-summation
      - carlet-2-rel-25-wiener-khinchin

  - id: carlet-8-maiorana-mcfarland-pc-construction
    kind: construction
    location: >-
      Maiorana--McFarland propagation construction (Carlet, Section 8.1.2,
      p. 132)
    statement: |-
      Let \phi:V_s\to V_r and g:V_s\to\mathbb F_2, and define

      f(x,y)=x\cdot\phi(y)\oplus g(y)
      \qquad(x\in V_r,\ y\in V_s).

      For a\in V_r and b\in V_s,

      D_{(a,b)}f(x,y)
      =x\cdot D_b\phi(y)\oplus a\cdot\phi(y\oplus b)\oplus D_bg(y).

      Suppose that:

      1. for every nonzero b\in V_s with w_H(b)\le l and every y\in V_s,
         D_b\phi(y)\ne0; equivalently, every fiber \phi^{-1}(u) is empty, a
         singleton, or has minimum distance greater than l;
      2. for every nonzero a\in V_r with w_H(a)\le l, the Boolean function
         y\mapsto a\cdot\phi(y) is balanced.

      Then f satisfies PC(l) on V_r\times V_s.
    formal_status: formalized
    declarations:
      - CryptBoolean.binaryMapDerivative
      - CryptBoolean.binaryMapDerivative_zero
      - CryptBoolean.MaioranaMcFarlandFibersHaveMinimumDistanceGreaterThan
      - CryptBoolean.booleanDerivative_booleanMaioranaMcFarlandGeneral_append
      - CryptBoolean.booleanDerivative_booleanMaioranaMcFarlandGeneral_append_apply
      - CryptBoolean.binaryMapDerivative_ne_zero_iff_fibersHaveMinimumDistanceGreaterThan
      - CryptBoolean.satisfiesPropagationCriterion_booleanMaioranaMcFarlandGeneral
      - CryptBoolean.satisfiesPropagationCriterion_booleanMaioranaMcFarlandGeneral_of_fibers
    fidelity_note: >-
      Condition 2 is exactly the balance of every sum of between one and l
      coordinate functions of \phi. Condition 1 retains both the pointwise
      derivative form and Carlet's fiber-distance equivalence. No injectivity
      or linearity of \phi is added.
    reuse_note: >-
      Reuse the Chapter 7 general Maiorana--McFarland function and differentiate
      it compositionally. For b\ne0, balance follows by summing over the x
      block; the b=0 case is precisely condition 2.
    dependencies:
      - carlet-7-rel-59-maiorana-mcfarland-general
      - carlet-2-def-2-derivative
      - carlet-2-balanced-zero-walsh

  - id: carlet-8-dobbertin-pc-obstruction
    kind: theorem
    location: >-
      Dobbertin-construction obstruction (Carlet, Section 8.1.2, p. 132)
    statement: |-
      Let n>0 be even. Let f:V_{n/2}\times V_{n/2}\to\mathbb F_2 be bent and
      satisfy f(x,0)=0 for every x, let g:V_{n/2}\to\mathbb F_2 be balanced,
      and define Dobbertin's function

      h(x,y)=f(x,y)\oplus\delta_0(y)g(x).

      If n/2\le l\le n, then h does not satisfy PC(l).
    formal_status: formalized
    declarations:
      - CryptBoolean.not_satisfiesPropagationCriterion_dobbertinConstruction
    fidelity_note: >-
      This records the exact Chapter 7 Dobbertin construction to which the
      survey's obstruction refers. Relation (64) makes W_h(0,v)=0 for every v;
      Proposition 35 then contradicts the required positive Walsh-square sum.
    reuse_note: >-
      Reuse the compiled zero-first-block spectrum from Proposition 33 and
      specialize Proposition 35 to the vector supported on the second block.
    dependencies:
      - carlet-8-prop-35-affine-flat-walsh-square-characterization
      - carlet-7-prop-33-dobbertin-walsh

  - id: carlet-8-prop-36-order-characterization
    kind: proposition
    location: >-
      Proposition 36 (Carlet, Section 8.2, p. 132)
    statement: |-
      Let l+k\le n and let f:V_n\to\mathbb F_2. Then f satisfies EPC(l) of
      order k if and only if, for every a,b\in V_n with
      w_H(a)\le l, w_H(b)\le k, and (a,b)\ne(0,0),

      \sum_{x\in V_n}
        (-1)^{f(x)\oplus f(x\oplus a)\oplus b\cdot x}=0.

      The function f satisfies PC(l) of order k if and only if the same
      identity holds for every such a,b that additionally satisfy

      \operatorname{supp}(a)\cap\operatorname{supp}(b)=\varnothing.
    formal_status: formalized
    declarations:
      - CryptBoolean.all_coordinateRestrictions_balanced_iff_walshTransform_eq_zero
      - CryptBoolean.satisfiesPropagationCriterionOfOrder_iff_derivativeRestrictions_balanced
      - CryptBoolean.walshTransform_booleanDerivative_eq_sum_bitSignInt
      - CryptBoolean.walshTransform_booleanDerivative_zero_direction
      - CryptBoolean.satisfiesExtendedPropagationCriterion_iff_walshTransform_booleanDerivative_eq_zero
      - CryptBoolean.satisfiesPropagationCriterionOfOrder_iff_walshTransform_booleanDerivative_eq_zero
    references: [299]
    fidelity_note: >-
      The standard domain l+k\le n is made explicit so the exact-coordinate-
      restriction definition is nonvacuous and equivalent to the displayed
      ambient spectral condition. Cases with a=0 are retained as printed and
      reduce to orthogonality of a nontrivial character.
    reuse_note: >-
      Identify the displayed sum with the raw Walsh transform of D_af at b,
      then reuse the Chapter 4 Walsh-zero characterization of resiliency and
      the canonical EPC and coordinate-restriction PC predicates.
    dependencies:
      - carlet-4-def-propagation-criteria
      - carlet-4-theorem-3
      - carlet-2-def-2-derivative

  - id: carlet-8-prop-37-restriction-walsh-characterization
    kind: proposition
    location: >-
      Proposition 37 (Carlet, Section 8.2, p. 133)
    statement: |-
      Let l+k\le n and let f:V_n\to\mathbb F_2. For v\in V_n define the raw
      Walsh transform of the restriction of f to the coordinate subspace
      V_v=\{x\in V_n\mid x\preceq v\} by

      W_f^v(w)=\sum_{x\preceq v}(-1)^{f(x)\oplus w\cdot x}.

      Then f satisfies EPC(l) of order k if and only if, for every u,v\in V_n
      with w_H(u)\ge n-l and w_H(v)\ge n-k,

      \sum_{w\preceq u}W_f(w)W_f^v(w)
      =2^{w_H(u)+w_H(v)}.

      The function f satisfies PC(l) of order k if and only if the same
      identity holds for all such u,v whose complements have disjoint
      supports:

      \operatorname{supp}(\bar u)\cap\operatorname{supp}(\bar v)
      =\varnothing.
    formal_status: formalized
    declarations:
      - CryptBoolean.predecessorSubspace
      - CryptBoolean.mem_predecessorSubspace_iff
      - CryptBoolean.card_predecessorSubspace
      - CryptBoolean.perpendicular_predecessorSubspace
      - CryptBoolean.mem_perpendicular_predecessorSubspace_iff
      - CryptBoolean.coordinateRestrictedWalshTransform
      - CryptBoolean.predecessorWalshRestrictionProductSum
      - CryptBoolean.derivativeWalshRectangleSum
      - CryptBoolean.predecessorWalshRestrictionProductSum_eq_derivativeWalshRectangleSum
      - CryptBoolean.satisfiesExtendedPropagationCriterion_iff_predecessorWalshRestrictionProductSum
      - CryptBoolean.satisfiesPropagationCriterionOfOrder_iff_predecessorWalshRestrictionProductSum
    references: [303]
    fidelity_note: >-
      The support condition is on the complements of the high-weight vectors
      u and v. Dropping the complement bars would contradict Proposition 36.
      The restricted transform is written as an ambient character sum over
      V_v, eliminating any hidden choice of a coordinate-space identification.
    reuse_note: >-
      Apply raw Poisson summation to the bivariate function
      (a,b)\mapsto W_{D_af}(b), using Proposition 36 for its vanishing region
      and the existing restriction and support-inclusion APIs.
    dependencies:
      - carlet-8-prop-36-order-characterization
      - carlet-2-cor-1-poisson-summation

  - id: carlet-8-sac-order-algebraic-degree
    kind: theorem
    location: >-
      Preneel's SAC-of-order degree bound (Carlet, Section 8.2, p. 133)
    statement: |-
      Let k+3\le n and let f:V_n\to\mathbb F_2 satisfy SAC of order k. Then

      \deg(f)\le n-k-1.

      More precisely, every restriction of f obtained by fixing any k input
      coordinates has algebraic degree at most n-k-1.
    formal_status: formalized
    declarations:
      - CryptBoolean.coordinateRestriction_zeroFixed_apply
      - CryptBoolean.anfCoeff_coordinateRestriction_zeroFixed_univ
      - CryptBoolean.coordinateRestriction_degree_le_of_satisfiesStrictAvalancheCriterionOfOrder
      - CryptBoolean.functionAlgebraicDegree_le_of_satisfiesStrictAvalancheCriterionOfOrder
    references: [297]
    fidelity_note: >-
      The survey prints only k<n. The stronger residual-dimension condition
      n-k\ge3 is necessary for the unqualified statement: the complete
      quadratic q_n satisfies SAC of order n-2, while its two-variable
      restrictions have degree 2 rather than 1. This correction preserves the
      source claim on its valid range instead of silently formalizing a false
      endpoint.
    reuse_note: >-
      Apply the general PC degree bound to each canonical coordinate
      restriction and reuse the existing restriction-recovery theorem for
      algebraic degree.
    dependencies:
      - carlet-8-pc-algebraic-degree-bound
      - carlet-4-def-propagation-criteria
      - carlet-2-def-algebraic-degree

  - id: carlet-8-extremal-order-complete-quadratic-classification
    kind: classification
    location: >-
      Extremal high-order propagation classification (Carlet, Section 8.2,
      p. 133; reference [60], Theorem 5)
    statement: |-
      Let f:V_n\to\mathbb F_2 and suppose either

      * n\ge6, l is positive and even, and l\le n-4; or
      * n\ge10, l is odd, and 5\le l\le n-5.

      Then f satisfies PC(l) of order n-l-2 if and only if there exists an
      affine function h:V_n\to\mathbb F_2 such that

      f(x_1,\ldots,x_n)
      =\bigoplus_{1\le i<j\le n}x_ix_j\oplus h(x_1,\ldots,x_n).
    formal_status: formalized
    declarations:
